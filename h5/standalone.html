    return Promise.resolve(external);
  }

  function wecomState() {
    const cfg = (global.APP_CONFIG && APP_CONFIG.wecom) || {};
    if (!cfg.enabled) return { state: 'off', text: '未启用（演示模式）' };
    if (external) return { state: 'on', text: '已通过企业微信识别：' + external.name };
    if (wecomError) return { state: 'error', text: wecomError };
    return { state: 'wait', text: wecomChecked ? '已启用，等待企业微信授权' : '检测中' };
  }

  function logout() {
    external = null;
    wecomError = '';
    try {
      localStorage.removeItem(K_PROFILE);
      localStorage.removeItem(K);
    } catch (e) { /* ignore */ }
  }

  global.Session = {
    all: all,
    findById: findById,
    current: current,
    switchTo: switchTo,
    grouped: grouped,
    scopeOf: scopeOf,
    avatarOf: avatarOf,
    bootstrap: bootstrap,
    wecomState: wecomState,
    logout: logout,
    isExternal: function () { return !!external; }
  };
})(window);

</script>
<script>
/* ==== js/ui.js ==== */
/* 通用 UI 工具：模板转义、状态标签、弹层、提示、图片压缩 */
(function (global) {
  const fmt = global.BIZ.fmt;

  function esc(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function money(value) { return fmt.money(value); }
  function money2(value) { return fmt.money2(value); }

  function icon(name, cls) {
    return '<svg class="ic ' + (cls || '') + '"><use href="#i-' + name + '"/></svg>';
  }

  function toast(message, type, ms) {
    const host = document.getElementById('toast-host');
    if (!host) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = message;
    host.appendChild(el);
    setTimeout(function () {
      el.style.opacity = '0';
      el.style.transition = 'opacity .2s';
      setTimeout(function () { el.remove(); }, 220);
    }, ms || 2200);
  }

  let openSheet = null;

  function sheet(opts) {
    const host = document.getElementById('sheet-host');
    const mask = document.createElement('div');
    mask.className = 'mask';
    const actions = opts.actions || [];
    mask.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="sheet-head">' +
          '<div class="sheet-title">' + esc(opts.title || '') + '</div>' +
          (opts.sub ? '<div class="sheet-sub">' + opts.sub + '</div>' : '') +
        '</div>' +
        '<div class="sheet-body">' + (opts.body || '') + '</div>' +
        (actions.length ? '<div class="sheet-foot">' + actions.map(function (a, i) {
          return '<button class="btn ' + (a.cls || 'ghost') + '" data-act="' + i + '"' + (a.disabled ? ' disabled' : '') + '>' + esc(a.label) + '</button>';
        }).join('') + '</div>' : '') +
      '</div>';

    let closed = false;
    function close() {
      if (closed) return;
      closed = true;
      mask.remove();
      if (openSheet === api) openSheet = null;
      document.body.style.overflow = '';
      if (opts.onClose) opts.onClose();
    }

    const api = {
      close: close,
      el: mask.querySelector('.sheet'),
      body: mask.querySelector('.sheet-body'),
      subEl: mask.querySelector('.sheet-sub'),
      setSub: function (text) { if (api.subEl) api.subEl.innerHTML = text; }
    };

    mask.addEventListener('click', function (e) {
      if (e.target === mask && opts.dismissible !== false) close();
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const action = actions[Number(btn.dataset.act)];
      if (!action || !action.onClick) { close(); return; }
      const result = action.onClick(close, api.body);
      if (result !== false) close();
    });

    host.appendChild(mask);
    document.body.style.overflow = 'hidden';
    openSheet = api;
    if (opts.mount) opts.mount(api.body, close);
    const first = api.body.querySelector('input, select, textarea');
    if (first && opts.autofocus !== false) setTimeout(function () { first.focus(); }, 120);
    return api;
  }

  function confirm(opts) {
    return new Promise(function (resolve) {
      let decided = false;
      sheet({
        title: opts.title || '请确认',
        sub: opts.sub,
        body: opts.body || '',
        dismissible: true,
        onClose: function () { if (!decided) { decided = true; resolve(false); } },
        actions: [
          { label: opts.cancelText || '取消', cls: 'ghost', onClick: function () { decided = true; resolve(false); } },
          { label: opts.okText || '确认', cls: opts.danger ? 'danger-solid' : 'primary', onClick: function () { decided = true; resolve(true); } }
        ]
      });
    });
  }

  function statusPill(status) {
    return '<span class="pill ' + fmt.statusCls(status) + '">' + esc(fmt.statusLabel(status)) + '</span>';
  }

  const SUPPLIER_STATUS = {
    pending: { label: '待接单', cls: 'warn' },
    confirmed: { label: '备货中', cls: 'info' },
    shipping: { label: '配送中', cls: 'info' },
    // 验收完成只代表「货已收」，结算金额仍需双方共同确认，不能标成已完成
    accepted: { label: '已验收', cls: 'good' },
    issue: { label: '无法接单', cls: 'bad' }
  };

  function supplierPill(status) {
    const s = SUPPLIER_STATUS[status] || { label: status || '未知', cls: 'gray' };
    return '<span class="pill ' + s.cls + '">' + esc(s.label) + '</span>';
  }

  function supplierStatusText(status) {
    return (SUPPLIER_STATUS[status] || { label: status || '未知' }).label;
  }

  function empty(ico, title, sub) {
    return '<div class="empty"><div class="ico">' + (ico || '📭') + '</div>' +
      '<div class="t">' + esc(title) + '</div>' +
      (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>';
  }

  function timeText(iso) { return fmt.fullTime(iso); }
  // 预计到达可能是「2026-11-24」或完整 ISO，统一显示成可读文本
  function dateTimeText(value) {
    if (!value) return '';
    const v = String(value);
    return v.length > 10 ? fmt.fullTime(v) : v;
  }
  function shortTime(iso) { return fmt.shortTime(iso); }
  function fromNow(iso) { return fmt.fromNow(iso); }

  function copy(text) {
    const value = String(text || '');
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(value).then(function () {
        toast('已复制：' + value, 'good', 1400);
      }).catch(function () { fallbackCopy(value); });
    } else {
      fallbackCopy(value);
    }
  }

  function fallbackCopy(value) {
    const ta = document.createElement('textarea');
    ta.value = value;
    ta.style.cssText = 'position:fixed;top:-999px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('已复制：' + value, 'good', 1400); }
    catch (e) { toast('复制失败，请手动选择', 'error'); }
    ta.remove();
  }

  function compressImage(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function () {
        const img = new Image();
        img.onload = function () {
          const side = maxSide || 900;
          const scale = Math.min(1, side / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality || 0.72));
        };
        img.onerror = function () { reject(new Error('图片读取失败')); };
        img.src = reader.result;
      };
      reader.onerror = function () { reject(new Error('图片读取失败')); };
      reader.readAsDataURL(file);
    });
  }

  function debounce(fn, wait) {
    let timer = null;
    return function () {
      const args = arguments, ctx = this;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(ctx, args); }, wait || 200);
    };
  }

  function todayStr() {
    const d = new Date();
    const p = function (n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  // 订单进度：提交 → 战区审核/审批 → 待接单 → 配送 → 验收 → 结算确认 → 对账完成
  // V1.24+ 门店单先走 order-review，验收后进入 settle-*，结算确认后才回到 accepted 待对账
  function stepsOf(order) {
    const s = order.status;
    const closed = s === 'cancelled' || s === 'rejected';
    const approval = ['order-review', 'budget-region', 'budget-central', 'amount-approval', 'dept-approval'].indexOf(s) >= 0;
    const supply = ['supplier', 'preparing'].indexOf(s) >= 0;
    const ship = ['delivering', 'delivered', 'partial'].indexOf(s) >= 0;
    const settling = ['settle-pending', 'settle-supplier', 'settle-disputed'].indexOf(s) >= 0;
    const accepted = s === 'accepted';
    const done = s === 'done';
    const afterAccept = settling || accepted || done;
    return [
      { label: '已提交', done: true },
      { label: '审核审批', done: !approval && !closed, active: approval },
      { label: '待接单', done: supply || ship || afterAccept, active: supply },
      { label: '配送', done: ship || afterAccept, active: ship },
      { label: '验收', done: afterAccept, active: s === 'partial' || s === 'delivered' },
      { label: '结算', done: accepted || done, active: settling },
      { label: '完成', done: done }
    ];
  }

  function progressBar(steps) {
    return '<div class="bar" style="height:5px">' +
      '<i style="width:' + Math.round((steps.filter(function (x) { return x.done; }).length / steps.length) * 100) + '%"></i>' +
      '</div>';
  }

  global.UI = {
    esc: esc, money: money, money2: money2, icon: icon,
    toast: toast, sheet: sheet, confirm: confirm,
    statusPill: statusPill, supplierPill: supplierPill, supplierStatusText: supplierStatusText,
    empty: empty, timeText: timeText, dateTimeText: dateTimeText, shortTime: shortTime, fromNow: fromNow,
    copy: copy, compressImage: compressImage, debounce: debounce, todayStr: todayStr,
    stepsOf: stepsOf, progressBar: progressBar
  };
})(window);

</script>

<script>
/* ==== js/pages/home.js ==== */
/* 首页：身份概览、待办、预算、快捷入口 */
(function (Views) {
  const ENTRY_HASH = {
    order: '/catalog', orders: '/orders', accept: '/accept', drafts: '/drafts',
    approve: '/approvals', recon: '/reports?tab=recon', reports: '/reports', supply: '/supplier'
  };
  const TONE = { blue: 'blue', navy: 'navy', teal: 'teal', amber: 'amber', violet: 'violet', gray: 'gray' };

  function greeting() {
    const h = new Date().getHours();
    if (h < 6) return '夜深了';
    if (h < 9) return '早上好';
    if (h < 12) return '上午好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  function dateText() {
    const d = new Date();
    const week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + week;
  }

  function isActive(o) {
    return ['done', 'cancelled', 'rejected'].indexOf(o.status) < 0;
  }

  Views.home = function (root, r, ctx) {
    const domain = BIZ.domain;
    const perm = BIZ.perm;
    const me = ctx.me;
    const st = ctx.state;
    const orders = domain.visibleOrders(st, me);
    const active = orders.filter(isActive);
    const approvals = domain.pendingApprovals(st, me);
    const accepts = domain.pendingAcceptOrders(st, me);
    const budgets = domain.budgetSummary(st, me);
    const report = domain.reportSummary(st);

    const visibleIds = orders.map(function (o) { return o.id; });
    let sla = domain.slaEntries(st).filter(function (x) { return visibleIds.indexOf(x.orderId) >= 0; });
    if (me.role === 'supplier') sla = sla.filter(function (x) { return x.owner === me.supplier; });
    const overdue = sla.filter(function (x) { return x.level === 'overdue'; }).length;
    const warning = sla.filter(function (x) { return x.level === 'warning'; }).length;

    const totalAmount = orders.filter(function (o) { return ['cancelled', 'rejected'].indexOf(o.status) < 0; })
      .reduce(function (s, o) { return s + Number(o.total || 0); }, 0);

    // 统计卡：按角色换口径
    let stats = [];
    if (me.role === 'store' || me.role === 'department') {
      const mine = me.role === 'store'
        ? budgets.reduce(function (s, b) { return s + b.available; }, 0)
        : null;
      stats = [
        { k: '待我处理', v: domain.actionCount(st, me), d: '验收 / 结算' },
        { k: '在途订单', v: active.length, d: '未完成' },
        { k: '累计采购', v: '¥' + UI.money(totalAmount), d: '含审批中' },
        { k: me.role === 'store' ? '可用预算' : '部门采购', v: me.role === 'store' ? '¥' + UI.money(mine) : orders.length + ' 单', d: me.role === 'store' ? '含在途占用' : '全部批次' }
      ];
    } else if (me.role === 'region') {
      stats = [
        { k: '待我审批', v: approvals.length, d: '预算 / 金额' },
        { k: '战区在途', v: active.length, d: '未完成订单' },
        { k: '战区采购额', v: '¥' + UI.money(totalAmount), d: '含审批中' },
        { k: '超时预警', v: overdue, d: warning ? warning + ' 单临近超时' : '暂无临近' }
      ];
    } else if (me.role === 'central') {
      stats = [
        { k: '待我处理', v: approvals.length, d: '核定 / 确认' },
        { k: '在途订单', v: active.length, d: '全公司' },
        { k: '采购总额', v: '¥' + UI.money(report.totals.requested), d: '有效订单' },
        { k: '待对账金额', v: '¥' + UI.money(report.totals.unreconciledAccepted), d: '已验收未对账' }
      ];
    } else {
      const mineOrders = orders.filter(function (o) {
        const rec = (o.supplierRecords || {})[me.supplier];
        return rec && rec.status === 'pending' && ['cancelled', 'rejected'].indexOf(o.status) < 0;
      });
      const toShip = orders.filter(function (o) {
        const rec = (o.supplierRecords || {})[me.supplier];
        return rec && rec.status === 'confirmed';
      });
      const shipping = orders.filter(function (o) {
        const rec = (o.supplierRecords || {})[me.supplier];
        return rec && rec.status === 'shipping';
      });
      const myAmount = orders.reduce(function (sum, o) {
        return sum + o.items.filter(function (x) { return x.supplier === me.supplier; })
          .reduce(function (s, x) { return s + Number(x.price || 0) * Number(x.qty || 0); }, 0);
      }, 0);
      stats = [
        { k: '待接单', v: mineOrders.length, d: '请及时确认' },
        { k: '待发货', v: toShip.length, d: '已接单' },
        { k: '配送中', v: shipping.length, d: '在途批次' },
        { k: '供货金额', v: '¥' + UI.money(myAmount), d: '累计' }
      ];
    }

    // 待办
    let todos = [];
    if (me.role === 'central' || me.role === 'region') {
      todos = approvals.slice(0, 3).map(function (o) {
        return {
          icon: 'check', tone: '',
          title: o.id + ' ' + BIZ.fmt.statusLabel(o.status),
          sub: (o.store || '') + ' · ¥' + UI.money(o.total),
          hash: '/approvals'
        };
      });
    } else if (me.role === 'store' || me.role === 'department') {
      todos = accepts.slice(0, 3).map(function (o) {
        return {
          icon: 'camera', tone: 'good',
          title: o.id + ' 待验收',
          sub: (o.store || '') + ' · ¥' + UI.money(o.total),
          hash: '/accept'
        };
      });
    } else {
      todos = orders.filter(function (o) {
        const rec = (o.supplierRecords || {})[me.supplier];
        return rec && rec.status === 'pending' && ['cancelled', 'rejected'].indexOf(o.status) < 0;
      }).slice(0, 3).map(function (o) {
        return {
          icon: 'truck', tone: 'info',
          title: o.id + ' 待接单',
          sub: (o.store || '') + ' · 我的商品 ' + o.items.filter(function (x) { return x.supplier === me.supplier; }).length + ' 项',
          hash: '/supplier'
        };
      });
    }

    // 结算金额共同确认：门店/部门填写金额，供应商确认；与「待我处理」计数同源
    const settleTodos = domain.pendingSettleOrders(st, me).slice(0, 2).map(function (o) {
      return {
        icon: 'bill', tone: '',
        title: (me.role === 'supplier' ? '待确认结算' : '待填写结算') + ' · ' + o.id,
        sub: (o.store || '') + ' · ¥' + UI.money(o.total),
        hash: '/settle/' + o.id
      };
    });
    if (settleTodos.length) todos = settleTodos.concat(todos).slice(0, 4);

    const entries = perm.homeEntries(me);
    const meta = perm.roleMeta(me.role);

    root.innerHTML =
      '<div class="hero">' +
        '<div class="hero-top">' +
          '<div>' +
            '<div class="hero-hello">' + greeting() + '</div>' +
            '<div class="hero-name">' + UI.esc(me.name) +
              (me.name.indexOf(meta.label) < 0 ? '<span class="hero-tag">' + UI.esc(meta.label) + '</span>' : '') +
            '</div>' +
            '<div class="hero-scope">' + UI.esc(Session.scopeOf(me)) + '</div>' +
          '</div>' +
          '<div class="hero-date">' + dateText() + '</div>' +
        '</div>' +
        '<div class="hero-foot">' +
          // 待办数统一取 actionCount：含验收、结算共同确认等所有待我动作
          '<div class="hero-metric"><div class="k">待办</div><div class="v">' + domain.actionCount(st, me) + '</div></div>' +
          '<div class="hero-metric"><div class="k">在途</div><div class="v">' + active.length + '</div></div>' +
          '<div class="hero-metric"><div class="k">超时</div><div class="v">' + overdue + '</div></div>' +
          '<a class="hero-switch" href="#/profile">' + (Session.isExternal() ? '我的' : '切换身份') + UI.icon('right', 'xs') + '</a>' +
        '</div>' +
      '</div>' +

      (overdue || warning
        ? '<a class="alert ' + (overdue ? '' : 'warn') + '" style="margin-top:12px" href="#/orders">' +
            UI.icon('clock', 'sm') +
            '<span>' + (overdue ? overdue + ' 单已超时' : '') + (overdue && warning ? '，' : '') + (warning ? warning + ' 单临近超时' : '') + '</span>' +
            '<span class="go">查看 ›</span></a>'
        : '') +

      '<div class="stat-grid" style="margin-top:12px">' +
        stats.map(function (s) {
          return '<div class="stat"><div class="k">' + UI.esc(s.k) + '</div>' +
            '<div class="v num">' + s.v + '</div>' +
            '<div class="d">' + UI.esc(s.d) + '</div></div>';
        }).join('') +
      '</div>' +

      '<div class="section">' +
        '<div class="section-head"><span class="section-title">快捷入口</span></div>' +
        '<div class="quick-grid' + (entries.length === 3 ? ' n3' : '') + '">' +
          entries.map(function (e) {
            const badge = e.key === 'approve' ? approvals.length : (e.key === 'accept' ? accepts.length : 0);
            return '<a class="quick" href="#' + (ENTRY_HASH[e.key] || '/home') + '">' +
              '<span class="qi ' + (TONE[e.tone] || 'blue') + '">' + UI.icon(ICON_OF[e.key]) + '</span>' +
              '<span class="ql">' + UI.esc(e.label) + '</span>' +
              (badge ? '<span class="qb">' + badge + '</span>' : '') + '</a>';
          }).join('') +
        '</div>' +
      '</div>' +

      (budgets.length
        ? '<div class="section"><div class="card card-pad">' +
            '<div class="between" style="margin-bottom:6px"><span class="section-title">预算占用</span>' +
            '<a class="section-more" href="#/reports">明细 ' + UI.icon('right', 'xs') + '</a></div>' +
            budgets.slice(0, 4).map(budgetRow).join('') +
            '<div class="tiny muted" style="margin-top:8px">占用率 = （基础已用 + 在途占用 + 已验收）/ 额度</div>' +
          '</div></div>'
        : '') +

      '<div class="section">' +
        '<div class="section-head"><span class="section-title">待办</span>' +
          '<a class="section-more" href="#' + (me.role === 'supplier' ? '/supplier' : me.role === 'store' || me.role === 'department' ? '/accept' : '/approvals') + '">全部 ' + UI.icon('right', 'xs') + '</a>' +
        '</div>' +
        (todos.length
          ? '<div class="card">' + todos.map(function (t) {
              return '<a class="todo" href="#' + t.hash + '">' +
                '<span class="todo-ico ' + (t.tone || '') + '">' + UI.icon(t.icon, 'sm') + '</span>' +
                '<span class="todo-main"><span class="todo-title">' + UI.esc(t.title) + '</span>' +
                '<span class="todo-sub">' + UI.esc(t.sub) + '</span></span>' +
                UI.icon('right', 'sm') + '</a>';
            }).join('') + '</div>'
          : '<div class="card card-pad"><div class="small muted" style="text-align:center;padding:8px 0">暂无待办，' + (me.role === 'supplier' ? '保持及时接单' : '可以开始采购了') + '</div></div>') +
      '</div>' +

      (me.role === 'central' || me.role === 'region'
        ? '<div class="section"><div class="card card-pad">' +
            '<div class="between" style="margin-bottom:8px"><span class="section-title">金额口径</span>' +
            '<a class="section-more" href="#/reports">看板 ' + UI.icon('right', 'xs') + '</a></div>' +
            '<div class="kv"><span class="k">已申请</span><span class="v num">¥' + UI.money(report.totals.requested) + '</span></div>' +
            '<div class="kv"><span class="k">已验收</span><span class="v num">¥' + UI.money(report.totals.accepted) + '</span></div>' +
            '<div class="kv"><span class="k">已对账</span><span class="v num">¥' + UI.money(report.totals.reconciled) + '</span></div>' +
            '<div class="kv"><span class="k">待对账</span><span class="v num money red">¥' + UI.money(report.totals.unreconciledAccepted) + '</span></div>' +
          '</div></div>'
        : '');
  };

  function budgetRow(b) {
    const tone = b.usedPct >= 90 ? 'bad' : b.usedPct >= 70 ? 'warn' : '';
    const items = (b.items || []).map(function (it) {
      const t = it.usedPct >= 90 ? 'bad' : it.usedPct >= 70 ? 'warn' : '';
      return '<div class="budget-item">' +
        '<span class="bi-name">' + UI.esc(it.name) + '</span>' +
        '<span class="bi-bar"><i class="' + t + '" style="width:' + Math.min(100, it.usedPct) + '%"></i></span>' +
        '<span class="bi-pct">¥' + UI.money(it.used) + ' / ' + UI.money(it.budget) + '</span>' +
        '</div>';
    }).join('');
    return '<div class="budget-row">' +
      '<div class="budget-top"><span class="budget-store">' + UI.esc(b.store) + '</span>' +
      '<span class="budget-num">¥' + UI.money(b.used) + ' / ¥' + UI.money(b.budget) + '</span></div>' +
      '<div class="bar"><i class="' + tone + '" style="width:' + b.usedPct + '%"></i></div>' +
      '<div class="bar-legend"><span>' + b.rooms + ' 间房</span><span>在途 ¥' + UI.money(b.occupied) + '</span><span>已验收 ¥' + UI.money(b.spent) + '</span>' +
      '<span style="margin-left:auto">占用 ' + b.usedPct + '%</span></div>' +
      (items ? '<div class="budget-items">' + items + '</div>' : '') +
    '</div>';
  }

  const ICON_OF = {
    order: 'cart', orders: 'orders', accept: 'camera', drafts: 'box',
    approve: 'check', recon: 'bill', reports: 'chart', supply: 'truck', budget: 'bill'
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/catalog.js ==== */
/* 采购下单：左侧竖排两级目录 + 右侧商品列表 + 购物车 */
(function (Views) {
  const TOP_SHORT = {
    '奖品礼品': '奖品礼品',
    '活动及社群物资': '活动社群',
    '日常运营耗材': '日常耗材',
    '宣传印刷物料': '宣传印刷',
    '员工物资': '员工物资'
  };

  const PRODUCTS = BIZ.catalog.CATALOG.map(function (p) {
    return {
      id: p.id,
      name: p.name,
      spec: p.spec,
      unit: p.unit,
      price: p.price,
      supplier: p.supplier,
      category: p.category,
      icon: (BIZ.catalog.CATEGORY_META[p.category] || { icon: '📦' }).icon,
      key: (p.name + ' ' + p.spec + ' ' + p.supplier + ' ' + p.id).toLowerCase()
    };
  });

  const PMAP = {};
  PRODUCTS.forEach(function (p) { PMAP[p.id] = p; });

  const INDEX = BIZ.subcats.build(BIZ.catalog.CATALOG);

  const NAV = (function () {
    const byId = {};
    INDEX.nav.forEach(function (c) {
      c.subs.forEach(function (s) { byId[s.key] = s; });
    });
    return {
      list: [{
        key: 'all', label: '全部物资', short: '全部', count: PRODUCTS.length, subs: []
      }].concat(INDEX.nav.map(function (c) {
        return {
          key: c.key,
          label: c.label,
          short: TOP_SHORT[c.label] || c.label,
          count: c.count,
          subs: c.subs.length > 1 ? c.subs.map(function (s) {
            return { key: s.key, label: s.label, short: s.short, count: s.count };
          }) : []
        };
      })),
      subs: byId
    };
  })();

  // 二级分类 → 商品 id 集合（一次性算好，避免每次筛选都重新归类）
  const SUB_IDS = {};
  INDEX.nav.forEach(function (c) {
    c.subs.forEach(function (s) {
      const map = {};
      s.ids.forEach(function (id) { map[id] = 1; });
      SUB_IDS[s.key] = map;
    });
  });

  Views.catalog = function (root, r, ctx) {
    const domain = BIZ.domain;
    const perm = BIZ.perm;
    const me = ctx.me;
    const state = ctx.state;
    const canBuy = perm.can(me, 'order.create');
    const isDept = perm.isDepartmentFlow(me);

    if (!canBuy) {
      root.innerHTML = UI.empty('🔒', '当前身份无下单权限', '战区负责人与供应商不在采购下单范围内');
      return;
    }

    let cart = Store.loadCart(me.id);
    cart.lines = cart.lines || {};
    // 清理已下架/不存在的商品
    Object.keys(cart.lines).forEach(function (id) {
      if (!PMAP[id] || !cart.lines[id]) delete cart.lines[id];
    });

    // 从草稿箱 / 订单详情跳回时按 URL 参数切到对应门店，否则购物车会被上下文过滤掉
    let storeName = cart.store || (me.role === 'store' ? (me.stores || [])[0] : (me.department || ''));
    if (me.role === 'store' && r.query.store) {
      const wanted = decodeURIComponent(r.query.store);
      if ((me.stores || []).indexOf(wanted) >= 0) storeName = wanted;
    }
    if (me.role === 'store' && (me.stores || []).indexOf(storeName) < 0) storeName = me.stores[0];
    cart.store = storeName;

    const view = { cat: 'all', sub: '', keyword: '', shown: 40, open: true };
    // 与小程序一致：带 category / sub 参数进页面时自动定位并展开对应目录
    if (r.query.category && NAV.list.some(function (c) { return c.key === r.query.category; })) {
      view.cat = r.query.category;
      view.open = true;
    }
    if (r.query.sub && NAV.subs[r.query.sub]) {
      const parent = NAV.list.filter(function (c) {
        return c.subs.some(function (s) { return s.key === r.query.sub; });
      })[0];
      if (parent) { view.cat = parent.key; view.sub = r.query.sub; view.open = true; }
    }

    function persist() {
      cart.store = storeName;
      Store.saveCart(me.id, cart);
      renderCart();
    }

    function lines() {
      return Object.keys(cart.lines).map(function (id) {
        return { id: id, qty: cart.lines[id], product: PMAP[id] };
      }).filter(function (x) { return x.product && x.qty > 0; });
    }

    function totals() {
      const ls = lines();
      return {
        count: ls.length,
        qty: ls.reduce(function (s, x) { return s + x.qty; }, 0),
        amount: ls.reduce(function (s, x) { return s + x.qty * x.product.price; }, 0)
      };
    }

    function filtered() {
      const kw = view.keyword.trim().toLowerCase();
      if (kw) {
        return PRODUCTS.filter(function (p) { return p.key.indexOf(kw) >= 0; });
      }
      if (view.sub && SUB_IDS[view.sub]) {
        const ids = SUB_IDS[view.sub];
        return PRODUCTS.filter(function (p) { return ids[p.id]; });
      }
      if (view.cat !== 'all') return PRODUCTS.filter(function (p) { return p.category === view.cat; });
      return PRODUCTS;
    }

    root.innerHTML =
      '<div class="cat-page">' +
        '<div class="cat-top">' +
          '<div class="ctx-line">' +
            '<div class="ctx-left">' +
              '<div class="ctx-k">' + (isDept ? '采购部门' : '收货门店') + '</div>' +
              '<div class="ctx-v" id="ctx-v"></div>' +
            '</div>' +
            '<div class="ctx-sum"><b id="ctx-amt">¥0</b><span id="ctx-qty">未选商品</span></div>' +
          '</div>' +
          '<div class="search" id="search"><svg class="ic"><use href="#i-search"/></svg>' +
            '<input id="q" type="search" placeholder="搜索商品名称 / 规格 / 供应商" autocomplete="off">' +
            '<button class="clear" id="q-clear"><svg class="ic sm"><use href="#i-close"/></svg></button>' +
          '</div>' +
          '<div class="cat-head"><span class="t" id="cat-title">全部物资 <span id="cat-count"></span></span>' +
            '<span class="c" id="cat-sub"></span></div>' +
        '</div>' +
        '<div class="cat-body">' +
          '<aside class="rail" id="rail"></aside>' +
          '<section class="goods">' +
            '<div id="freq"></div>' +
            '<div class="plist" id="plist"></div>' +
            '<div id="more"></div>' +
          '</section>' +
        '</div>' +
      '</div>' +
      '<div class="cartbar" id="cartbar">' +
        '<div class="sum"><div class="k" id="cart-k">购物车</div><div class="v" id="cart-v">¥0.00</div></div>' +
        '<button class="btn ghost" id="cart-open">清单</button>' +
        '<button class="btn primary" id="cart-go">去结算</button>' +
      '</div>';

    const ctxV = root.querySelector('#ctx-v');

    function renderCtx() {
      if (isDept) {
        ctxV.innerHTML = UI.esc(storeName || me.department || '') + '<span class="pill violet" style="margin-left:6px">部门采购</span>';
      } else if ((me.stores || []).length > 1) {
        ctxV.innerHTML = '<select class="select" id="store-pick" style="height:34px;min-height:34px;padding:0 28px 0 10px;font-size:13.5px;font-weight:600;width:auto;border-radius:9px">' +
          me.stores.map(function (s) {
            return '<option value="' + UI.esc(s) + '"' + (s === storeName ? ' selected' : '') + '>' + UI.esc(s) + '</option>';
          }).join('') + '</select>';
        const pick = ctxV.querySelector('#store-pick');
        if (pick) pick.onchange = function () { storeName = pick.value; persist(); };
      } else {
        ctxV.innerHTML = UI.esc(storeName || '未分配门店');
      }
    }

    function renderRail() {
      const rail = root.querySelector('#rail');
      rail.innerHTML = NAV.list.map(function (c) {
        if (c.key === 'all') {
          return '<div class="rail-cat' + (view.cat === 'all' && !view.keyword ? ' on' : '') + '" data-cat="all">' +
            '<span>全部物资</span><span class="n">' + c.count + '</span></div>';
        }
        // 再点同一大类收起二级目录（列表仍停在该大类）：view.open 必须真正参与渲染
        const open = view.cat === c.key && view.open;
        const on = view.cat === c.key && !view.sub;
        return '<div class="rail-cat' + (on ? ' on' : '') + (open ? ' open' : '') + '" data-cat="' + UI.esc(c.key) + '"' +
          (c.subs.length ? ' title="再点一次可收起二级目录"' : '') + '>' +
          '<span>' + UI.esc(c.short) + '</span>' +
          (c.subs.length ? UI.icon('right') : '<span class="n">' + c.count + '</span>') +
        '</div>' +
        (open ? c.subs.map(function (s) {
          return '<div class="rail-sub compact' + (view.sub === s.key ? ' on' : '') + '" data-sub="' + UI.esc(s.key) + '">' +
            '<span>' + UI.esc(s.short) + '</span><span class="n">' + s.count + '</span></div>';
        }).join('') + '<div class="rail-fold" data-fold="' + UI.esc(c.key) + '">收起 ⌃</div>' : '');
      }).join('') + '<div class="rail-pad"></div>';
    }

    function renderFreq() {
      const host = root.querySelector('#freq');
      if (view.keyword || view.sub || view.cat !== 'all') { host.innerHTML = ''; return; }
      const list = domain.frequentItems(state, me, 6);
      if (!list.length) { host.innerHTML = ''; return; }
      host.innerHTML = '<div class="freq">' +
        '<div class="freq-head"><span class="t">常买清单</span><span class="s">按历史下单排序，点一下加 1 件</span></div>' +
        '<div class="freq-list">' + list.map(function (p) {
          const qty = cart.lines[p.id] || 0;
          return '<button class="freq-chip" data-plus="' + UI.esc(p.id) + '">' +
            '<b>' + UI.esc(p.name) + '</b>' +
            '<span>¥' + UI.money2(p.price) + (qty ? ' · 已选 ' + qty : ' · ＋加入') + '</span></button>';
        }).join('') + '</div></div>';
    }

    function renderList() {
      const list = filtered();
      const shown = Math.min(view.shown, list.length);
      const slice = list.slice(0, shown);

      let title = '全部物资', sub = '';
      if (view.keyword) {
        title = '搜索结果';
        sub = '“' + view.keyword.trim() + '”';
      } else if (view.sub && NAV.subs[view.sub]) {
        const s = NAV.subs[view.sub];
        const parent = NAV.list.filter(function (c) {
          return c.subs.some(function (x) { return x.key === s.key; });
        })[0];
        title = s.label;
        sub = parent ? parent.label : '';
      } else if (view.cat !== 'all') {
        const c = NAV.list.filter(function (x) { return x.key === view.cat; })[0];
        title = c ? c.label : '全部物资';
      }

      root.querySelector('#cat-title').firstChild.nodeValue = title + ' ';
      root.querySelector('#cat-count').textContent = '· 共 ' + list.length + ' 项';
      root.querySelector('#cat-sub').textContent = sub;

      const host = root.querySelector('#plist');
      if (!slice.length) {
        host.innerHTML = UI.empty('🔍', '没有匹配的商品', '换个关键词，或点左侧其他分类');
      } else {
        host.innerHTML = slice.map(function (p) {
          const qty = cart.lines[p.id] || 0;
          return '<div class="prod" data-id="' + UI.esc(p.id) + '">' +
            '<div class="prod-ico">' + p.icon + '</div>' +
            '<div class="prod-main">' +
              '<div class="prod-name">' + UI.esc(p.name) + '</div>' +
              '<div class="prod-spec">' + UI.esc(p.spec || '') +
                (p.supplier ? '<span class="prod-sup"> · ' + UI.esc(p.supplier) + '</span>' : '') + '</div>' +
              '<div class="prod-foot"><span class="prod-price">¥' + UI.money2(p.price) + '</span>' +
                '<span class="prod-unit">/ ' + UI.esc(p.unit || '件') + '</span></div>' +
            '</div>' +
            '<div class="prod-act">' +
              (qty
                ? '<div class="stepper"><button class="step-btn" data-minus="' + UI.esc(p.id) + '">' + UI.icon('minus') + '</button>' +
                  '<span class="step-qty">' + qty + '</span>' +
                  '<button class="step-btn" data-plus="' + UI.esc(p.id) + '">' + UI.icon('plus') + '</button></div>'
                : '<button class="step-btn add" data-plus="' + UI.esc(p.id) + '">' + UI.icon('plus') + '</button>') +
            '</div>' +
          '</div>';
        }).join('');
      }

      const more = root.querySelector('#more');
      if (list.length > shown) {
        more.innerHTML = '<button class="more" id="btn-more">加载更多（还有 ' + (list.length - shown) + ' 项）</button>';
        root.querySelector('#btn-more').onclick = function () {
          view.shown += 40;
          renderList();
        };
      } else {
        more.innerHTML = list.length > 40 ? '<div class="tiny muted" style="text-align:center;padding:10px 0 4px">已显示全部 ' + list.length + ' 项</div>' : '';
      }
    }

    function renderCart() {
      const t = totals();
      const bar = root.querySelector('#cartbar');
      bar.classList.toggle('on', t.qty > 0);
      root.querySelector('#ctx-amt').textContent = '¥' + UI.money2(t.amount);
      root.querySelector('#ctx-qty').textContent = t.qty ? t.qty + ' 件 · ' + t.count + ' 种' : '未选商品';
      root.querySelector('#cart-v').textContent = '¥' + UI.money2(t.amount);
      root.querySelector('#cart-k').textContent = t.count + ' 种 / ' + t.qty + ' 件';
      // 同步列表中的数量显示
      const rows = root.querySelectorAll('.prod[data-id]');
      rows.forEach(function (row) {
        const id = row.dataset.id;
        const qty = cart.lines[id] || 0;
        const act = row.querySelector('.prod-act');
        if (!act) return;
        const has = act.querySelector('.stepper');
        if (qty && !has) {
          act.innerHTML = '<div class="stepper"><button class="step-btn" data-minus="' + id + '">' + UI.icon('minus') + '</button>' +
            '<span class="step-qty">' + qty + '</span>' +
            '<button class="step-btn" data-plus="' + id + '">' + UI.icon('plus') + '</button></div>';
        } else if (!qty && has) {
          act.innerHTML = '<button class="step-btn add" data-plus="' + id + '">' + UI.icon('plus') + '</button>';
        } else if (has) {
          act.querySelector('.step-qty').textContent = qty;
        }
      });
    }

    function changeQty(id, delta) {
      const p = PMAP[id];
      if (!p) return;
      const next = (cart.lines[id] || 0) + delta;
      if (next <= 0) delete cart.lines[id];
      else if (next > 9999) { UI.toast('单个商品最多 9999 件', 'error'); return; }
      else cart.lines[id] = next;
      persist();
      if (next === 0 || next === 1) renderFreq();
      const counter = root.querySelector('#cat-count');
      if (counter) { /* 数量变化不影响条目数 */ }
    }

    function openCart() {
      if (!totals().qty) return;

      function bodyHtml() {
        const ls = lines();
        const t = totals();
        return '<div class="note-box mb12">' + (isDept ? '部门采购' : '收货门店') + '：<b>' + UI.esc(storeName) + '</b> · 共 ' + t.count + ' 种 ' + t.qty + ' 件</div>' +
          '<div class="ship-lines">' + ls.map(function (x) {
            return '<div class="ship-line"><span class="nm">' + UI.esc(x.product.name) +
              '<small>¥' + UI.money2(x.product.price) + ' / ' + UI.esc(x.product.unit || '件') + '</small></span>' +
              '<button class="step-btn" data-sheet-minus="' + UI.esc(x.id) + '">' + UI.icon('minus') + '</button>' +
              '<span class="step-qty">' + x.qty + '</span>' +
              '<button class="step-btn" data-sheet-plus="' + UI.esc(x.id) + '">' + UI.icon('plus') + '</button></div>';
          }).join('') + '</div>';
      }

      const s = UI.sheet({
        title: '采购清单',
        sub: '合计 ¥' + UI.money2(totals().amount),
        body: bodyHtml(),
        actions: [
          { label: '清空清单', cls: 'danger', onClick: function () {
              cart.lines = {};
              persist(); renderFreq();
              return true;
            } },
          { label: '去结算', cls: 'primary', onClick: function () { App.go('/checkout'); } }
        ],
        mount: function (bodyEl) {
          bodyEl.addEventListener('click', function (e) {
            const plus = e.target.closest('[data-sheet-plus]');
            const minus = e.target.closest('[data-sheet-minus]');
            if (!plus && !minus) return;
            const id = plus ? plus.dataset.sheetPlus : minus.dataset.sheetMinus;
            changeQty(id, plus ? 1 : -1);
            if (!totals().qty) { s.close(); return; }
            bodyEl.innerHTML = bodyHtml();
            s.setSub('合计 ¥' + UI.money2(totals().amount));
          });
        }
      });
    }

    // --- 交互 ---
    root.addEventListener('click', function (e) {
      const cat = e.target.closest('[data-cat]');
      if (cat) {
        const key = cat.dataset.cat;
        if (view.cat === key) {
          view.open = !view.open;
        } else {
          view.cat = key;
          view.open = true;
        }
        view.sub = '';
        view.keyword = '';
        view.shown = 40;
        const q = root.querySelector('#q');
        if (q) { q.value = ''; root.querySelector('#search').classList.remove('has'); }
        renderRail(); renderFreq(); renderList();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const fold = e.target.closest('[data-fold]');
      if (fold) {
        view.cat = fold.dataset.fold;
        view.open = false;
        view.sub = '';
        view.shown = 40;
        renderRail(); renderFreq(); renderList();
        return;
      }

      const sub = e.target.closest('[data-sub]');
      if (sub) {
        view.sub = sub.dataset.sub === view.sub ? '' : sub.dataset.sub;
        view.keyword = '';
        view.shown = 40;
        renderRail(); renderFreq(); renderList();
        return;
      }

      const plus = e.target.closest('[data-plus]');
      if (plus) {
        changeQty(plus.dataset.plus, 1);
        return;
      }

      const minus = e.target.closest('[data-minus]');
      if (minus) {
        changeQty(minus.dataset.minus, -1);
      }
    });

    const input = root.querySelector('#q');
    const search = root.querySelector('#search');
    input.addEventListener('input', UI.debounce(function () {
      view.keyword = input.value;
      view.shown = 40;
      search.classList.toggle('has', !!input.value);
      renderRail();
      renderFreq();
      renderList();
    }, 180));

    root.querySelector('#q-clear').onclick = function () {
      input.value = '';
      view.keyword = '';
      search.classList.remove('has');
      renderRail(); renderFreq(); renderList();
      input.focus();
    };

    root.querySelector('#cart-open').onclick = openCart;
    root.querySelector('#cart-go').onclick = function () {
      if (!totals().qty) { UI.toast('请先选择商品', 'error'); return; }
      App.go('/checkout');
    };

    renderCtx();
    renderRail();
    renderFreq();
    renderList();
    renderCart();
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/checkout.js ==== */
/* 结算页：收货信息 + 后台试算 + 提交（门店单 / 部门单） */
(function (Views) {
  Views.checkout = function (root, r, ctx) {
    const domain = BIZ.domain;
    const perm = BIZ.perm;
    const me = ctx.me;
    const state = ctx.state;
    const isDept = perm.isDepartmentFlow(me);

    const cart = Store.loadCart(me.id);
    const items = Object.keys(cart.lines || {}).filter(function (id) {
      return cart.lines[id] > 0 && BIZ.domain.CATALOG_BY_ID[id];
    }).map(function (id) {
      return { id: id, qty: cart.lines[id] };
    });

    if (!items.length) {
      root.innerHTML = UI.empty('🛒', '清单是空的', '先到「采购下单」选择商品') +
        '<div style="text-align:center;margin-top:4px"><a class="btn primary" href="#/catalog" style="width:180px">去选商品</a></div>';
      return;
    }

    const zoneStores = Object.keys(BIZ.catalog.STORE_ZONES || {});
    const deptStores = zoneStores.length ? zoneStores : (me.stores || []);

    let destType = 'store';
    let destStore = isDept
      ? ((me.role === 'central' ? deptStores[0] : (me.stores || [])[0]) || deptStores[0] || '公司总部')
      : (cart.store || (me.stores || [])[0]);
    if (!isDept && (me.stores || []).indexOf(destStore) < 0) destStore = me.stores[0];

    const dftDate = (function () {
      const d = new Date();
      d.setDate(d.getDate() + 2);
      const p = function (n) { return n < 10 ? '0' + n : n; };
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    })();

    const form = {
      receiver: me.name,
      address: isDept ? '公司总部收货区（演示地址）' : destStore + ' 收货区（演示地址）',
      purpose: isDept ? '部门日常采购' : '门店日常运营',
      due: dftDate,
      note: ''
    };

    function quoteOf() {
      if (isDept) {
        const total = items.reduce(function (s, x) {
          return s + BIZ.domain.CATALOG_BY_ID[x.id].price * x.qty;
        }, 0);
        return {
          total: Math.round(total * 100) / 100,
          overBudget: false,
          tierLabel: '部门采购',
          pathText: me.role === 'central' ? '运营管理部自采，提交后直接发送供应商' : '部门采购，提交后由运营管理部统一确认',
          maxSupport: null
        };
      }
      try {
        return domain.computeQuote(state, { store: destStore, items: items });
      } catch (e) {
        return { error: e.message };
      }
    }

    function renderQuote() {
      const q = quoteOf();
      const host = root.querySelector('#quote');
      if (!q || q.error) {
        host.innerHTML = '<div class="small" style="color:var(--bad)">' + UI.esc(q ? q.error : '试算失败') + '</div>';
        return;
      }
      const lines = items.map(function (x) {
        const p = BIZ.domain.CATALOG_BY_ID[x.id];
        return '<div class="item-line"><span class="nm">' + UI.esc(p.name) +
          '<small>' + UI.esc(p.spec || '') + '</small></span>' +
          '<span class="qty">×' + x.qty + '</span>' +
          '<span class="amt">¥' + UI.money(p.price * x.qty) + '</span></div>';
      }).join('');

      const catRows = (!isDept && q.budgetItems && q.budgetItems.length)
        ? '<div class="cat-split">' + q.budgetItems.map(function (r) {
            const pct = r.budget > 0 ? Math.min(100, Math.round(r.total / r.budget * 100)) : 0;
            return '<div class="cat-line">' +
              '<div class="between"><span class="cat-name">' + UI.esc(r.name) + '</span>' +
                '<span class="cat-amt' + (r.overBudget ? ' red' : '') + '">¥' + UI.money(r.total) + '</span></div>' +
              '<div class="bar" style="height:4px"><i class="' + (r.overBudget ? 'bad' : '') + '" style="width:' + Math.min(100, pct) + '%"></i></div>' +
              '<div class="tiny muted mt4">该科目可用 ¥' + UI.money(r.usable) +
                (r.overBudget ? ' · 超 ¥' + UI.money(r.over) : '') + '</div>' +
            '</div>';
          }).join('') + '</div>'
        : '';

      host.innerHTML =
        '<div class="between" style="margin-bottom:4px"><span class="section-title">商品明细</span>' +
          '<span class="tiny muted">' + items.length + ' 种 / ' + items.reduce(function (s, x) { return s + x.qty; }, 0) + ' 件</span></div>' +
        lines +
        catRows +
        '<div class="divider"></div>' +
        '<div class="kv"><span class="k">订单金额</span><span class="v num money" style="font-size:18px">¥' + UI.money(q.total) + '</span></div>' +
        (!isDept
          ? '<div class="kv"><span class="k">科目可用额度</span><span class="v num">¥' + UI.money(q.available) + '</span></div>' +
            '<div class="kv"><span class="k">可核定上限</span><span class="v num">¥' + UI.money(q.maxSupport) + '<span class="tiny muted">（门店额度 + 机动池）</span></span></div>' +
            (q.overBudget
              ? '<div class="kv"><span class="k" style="color:var(--bad)">超出可用</span><span class="v num money red">¥' + UI.money(q.overAmount) + '</span></div>'
              : '')
          : '') +
        '<div class="kv"><span class="k">审批路径</span><span class="v">' +
          '<span class="pill ' + (q.overBudget && q.hardOver ? 'bad' : q.overBudget ? 'warn' : 'info') + '">' + UI.esc(q.tierLabel) + '</span>' +
          '<div class="tiny muted mt4">' + UI.esc(q.pathText) + '</div></span></div>' +
        (q.hardOver
          ? '<div class="alert mt8">' + UI.icon('alert', 'sm') + '<span>超过单笔可核定上限，建议拆分下单或转专项采购</span></div>'
          : '');
    }

    const destOptions = isDept
      ? ['公司总部'].concat(deptStores)
      : (me.stores || []);

    root.innerHTML =
      '<div class="card card-pad">' +
        '<div class="section-title mb12">收货信息</div>' +
        (isDept
          ? '<div class="field"><div class="label">配送地点</div>' +
              '<div class="radio-cards">' +
                '<label class="radio-card' + (destType === 'store' ? ' on' : '') + '" data-dtype="store">' +
                  '<span class="rd"></span><span class="grow"><span>配送到门店</span><span class="d">门店收货并验收</span></span></label>' +
                '<label class="radio-card' + (destType === 'office' ? ' on' : '') + '" data-dtype="office">' +
                  '<span class="rd"></span><span class="grow"><span>配送到公司总部</span><span class="d">由采购部门验收</span></span></label>' +
              '</div></div>' +
            '<div class="field" id="dest-field"></div>'
          : '<div class="field"><div class="label">收货门店</div>' +
              '<select class="select" id="f-store">' + (me.stores || []).map(function (s) {
                return '<option' + (s === destStore ? ' selected' : '') + '>' + UI.esc(s) + '</option>';
              }).join('') + '</select></div>') +
        '<div class="field-row">' +
          '<div class="field"><div class="label">收货人<span class="req">*</span></div>' +
            '<input class="input" id="f-receiver" value="' + UI.esc(form.receiver) + '" maxlength="20"></div>' +
          '<div class="field"><div class="label">期望到货</div>' +
            '<input class="input" id="f-due" type="date" min="' + UI.todayStr() + '" value="' + form.due + '"></div>' +
        '</div>' +
        '<div class="field"><div class="label">收货地址<span class="req">*</span></div>' +
          '<input class="input" id="f-address" value="' + UI.esc(form.address) + '" maxlength="80" placeholder="楼栋 / 门牌 / 收货点"></div>' +
        '<div class="field"><div class="label">采购用途</div>' +
          '<input class="input" id="f-purpose" value="' + UI.esc(form.purpose) + '" maxlength="40"></div>' +
        '<div class="field"><div class="label">备注</div>' +
          '<textarea class="textarea" id="f-note" maxlength="200" placeholder="选填，例如活动时间、摆放要求"></textarea></div>' +
      '</div>' +

      '<div class="card card-pad mt12" id="quote"></div>' +

      '<div class="actionbar">' +
        '<button class="btn ghost" id="btn-draft">存草稿</button>' +
        '<button class="btn primary" id="btn-submit" style="flex:1.6">提交订单</button>' +
      '</div>' +
      '<div class="action-spacer"></div>' +

      '<div class="tiny muted" style="text-align:center;padding:4px 0 12px">提交即按规则进入审批或直接发送供应商；演示数据仅保存在本机</div>';

    if (isDept) {
      const field = root.querySelector('#dest-field');
      function renderDest() {
        const opts = destType === 'office' ? ['公司总部'] : deptStores;
        if (destType === 'office') destStore = '公司总部';
        else if (opts.indexOf(destStore) < 0) destStore = opts[0];
        field.innerHTML = '<div class="label">' + (destType === 'office' ? '收货地点' : '收货门店') + '</div>' +
          '<select class="select" id="f-dest">' + opts.map(function (s) {
            return '<option' + (s === destStore ? ' selected' : '') + '>' + UI.esc(s) + '</option>';
          }).join('') + '</select>';
        field.querySelector('#f-dest').onchange = function (e) {
          destStore = e.target.value;
          form.address = destType === 'office' ? '公司总部收货区（演示地址）' : destStore + ' 收货区（演示地址）';
          root.querySelector('#f-address').value = form.address;
          renderQuote();
        };
      }
      renderDest();

      root.querySelectorAll('[data-dtype]').forEach(function (el) {
        el.addEventListener('click', function () {
          destType = el.dataset.dtype;
          root.querySelectorAll('[data-dtype]').forEach(function (x) {
            x.classList.toggle('on', x.dataset.dtype === destType);
          });
          renderDest();
          renderQuote();
        });
      });
    } else {
      const sel = root.querySelector('#f-store');
      sel.onchange = function () {
        destStore = sel.value;
        form.address = destStore + ' 收货区（演示地址）';
        root.querySelector('#f-address').value = form.address;
        renderQuote();
      };
    }

    root.querySelector('#f-due').min = UI.todayStr();
    renderQuote();

    function readForm() {
      return {
        receiver: root.querySelector('#f-receiver').value.trim(),
        address: root.querySelector('#f-address').value.trim(),
        purpose: root.querySelector('#f-purpose').value.trim() || '门店日常运营',
        due: root.querySelector('#f-due').value || '',
        note: root.querySelector('#f-note').value.trim()
      };
    }

    function validate(f) {
      if (!f.receiver) return '请填写收货人';
      if (f.receiver.length > 20) return '收货人姓名过长';
      if (!f.address) return '请填写收货地址';
      if (f.address.length > 80) return '地址过长，请精简';
      if (f.due && f.due < UI.todayStr()) return '期望到货日期不能早于今天';
      return '';
    }

    root.querySelector('#btn-submit').onclick = function () {
      const f = readForm();
      const bad = validate(f);
      if (bad) { UI.toast(bad, 'error'); return; }

      const btn = root.querySelector('#btn-submit');
      btn.disabled = true;

      try {
        if (isDept) {
          const res = App.mutate(function (st, ses) {
            return BIZ.domain.createDepartmentOrders(st, ses, {
              purpose: f.purpose,
              note: f.note,
              destinations: [{
                type: destType,
                name: destType === 'office' ? '公司总部' : destStore,
                address: f.address,
                receiver: f.receiver,
                items: items
              }]
            });
          });
          Store.clearCart(me.id);
          UI.toast('已提交 ' + res.orders.length + ' 个配送点，共 ¥' + UI.money(res.total), 'good');
          App.go('/order/' + res.orders[0].id);
        } else {
          const res = App.mutate(function (st, ses) {
            return BIZ.domain.createStoreOrder(st, ses, {
              store: destStore,
              details: f,
              items: items
            });
          });
          Store.clearCart(me.id);
          Store.appendAudit([{
            orderId: res.order.id, kind: 'submit', stage: 'submit', decision: '提交订单',
            role: me.name, from: '', to: res.order.status,
            note: '门店采购 ' + items.length + ' 项，金额 ¥' + UI.money(res.order.total), at: new Date().toISOString()
          }]);
          UI.toast('已提交，金额 ¥' + UI.money(res.order.total), 'good');
          App.go('/order/' + res.order.id);
        }
      } catch (e) {
        btn.disabled = false;
        UI.toast(e.message, 'error', 2800);
      }
    };

    root.querySelector('#btn-draft').onclick = function () {
      const f = readForm();
      const now = new Date().toISOString();
      const draft = {
        id: 'DR-' + Date.now().toString(36),
        actorId: me.id,
        actorName: me.name,
        lines: Object.assign({}, cart.lines),
        store: destStore,
        destType: destType,
        details: f,
        amount: items.reduce(function (s, x) {
          return s + BIZ.domain.CATALOG_BY_ID[x.id].price * x.qty;
        }, 0),
        count: items.length,
        updatedAt: now
      };
      Store.saveDraft(draft);
      UI.toast('已存入草稿箱', 'good');
    };
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/orders.js ==== */
/* 订单列表：按状态分组筛选 + 搜索 */
(function (Views) {
  const GROUPS = [
    { key: 'all', label: '全部', test: function () { return true; } },
    { key: 'todo', label: '待处理', test: function (s) { return ['order-review', 'budget-region', 'budget-central', 'amount-approval', 'dept-approval', 'supplier', 'preparing'].indexOf(s) >= 0; } },
    { key: 'ship', label: '配送中', test: function (s) { return ['delivering', 'delivered', 'partial'].indexOf(s) >= 0; } },
    { key: 'settle', label: '结算中', test: function (s) { return ['settle-pending', 'settle-supplier', 'settle-disputed'].indexOf(s) >= 0; } },
    { key: 'accept', label: '待对账', test: function (s) { return s === 'accepted'; } },
    { key: 'done', label: '已完成', test: function (s) { return s === 'done'; } },
    { key: 'closed', label: '已关闭', test: function (s) { return ['rejected', 'cancelled'].indexOf(s) >= 0; } }
  ];

  Views.orders = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;
    const orders = domain.visibleOrders(state, me);

    let filter = r.query.tab && GROUPS.some(function (g) { return g.key === r.query.tab; }) ? r.query.tab : 'all';
    let keyword = '';

    const slaRows = domain.slaEntries(state);
    const slaByOrder = {};
    slaRows.forEach(function (x) {
      if (me.role === 'supplier' && x.owner !== me.supplier) return;
      const cur = slaByOrder[x.orderId];
      if (!cur || (cur.level !== 'overdue' && x.level === 'overdue')) slaByOrder[x.orderId] = x;
    });

    function matches(o, g) {
      if (!GROUPS.filter(function (x) { return x.key === g; })[0].test(o.status)) return false;
      if (!keyword) return true;
      const kw = keyword.toLowerCase();
      const hay = [o.id, o.store, o.manager, o.department, o.supplier, (o.items || []).map(function (x) { return x.name; }).join(' ')]
        .join(' ').toLowerCase();
      return hay.indexOf(kw) >= 0;
    }

    function counts() {
      const map = {};
      GROUPS.forEach(function (g) {
        map[g.key] = orders.filter(function (o) { return matches(o, g.key); }).length;
      });
      return map;
    }

    function card(o) {
      // 结算/待对账阶段以订单状态为准：供应商分项此时已 accepted，
      // 若仍显示「已完成」会误导供应商不去确认结算金额；这些阶段也不该报审批/接单超时
      const inSettle = me.role === 'supplier' &&
        ['settle-pending', 'settle-supplier', 'settle-disputed', 'accepted'].indexOf(o.status) >= 0;
      const sla = inSettle ? null : slaByOrder[o.id];
      const myRec = inSettle ? null : (me.role === 'supplier' ? (o.supplierRecords || {})[me.supplier] : null);
      const itemNames = (o.items || []).slice(0, 3).map(function (x) { return x.name + '×' + x.qty; }).join('、');
      const more = (o.items || []).length > 3 ? ' 等 ' + o.items.length + ' 项' : '';
      const statusHtml = myRec
        ? UI.supplierPill(myRec.status)
        : UI.statusPill(o.status);
      return '<a class="order-card" href="#/order/' + UI.esc(o.id) + '">' +
        '<div class="order-top"><span class="order-id">' + UI.esc(o.id) + '</span>' + statusHtml +
          (sla ? '<span class="sla ' + (sla.level === 'overdue' ? 'bad' : 'warn') + '" style="margin-left:auto">' + UI.icon('clock', 'xs') + BIZ.fmt.hoursText(sla.hours) + (sla.level === 'overdue' ? '超时' : '') + '</span>' : '') +
        '</div>' +
        '<div class="order-meta">' + UI.esc(o.purchaseType === 'department' ? ('部门采购 · ' + (o.department || '')) : o.store) +
          ' · ' + UI.esc(BIZ.fmt.shortTime(o.createdAt || o.created)) + '</div>' +
        '<div class="order-items">' + UI.esc(itemNames + more) + '</div>' +
        '<div class="order-foot">' +
          '<span class="pill line">' + UI.esc(BIZ.fmt.TIER_LABEL[o.tier] || '') + '</span>' +
          '<span class="tiny muted">' + (o.items || []).length + ' 种商品</span>' +
          '<span class="order-amt" style="margin-left:auto">¥' + UI.money(o.total) + '<small>' + (o.store || '') + '</small></span>' +
        '</div>' +
      '</a>';
    }

    function renderList() {
      const list = orders.filter(function (o) { return matches(o, filter); })
        .sort(function (a, b) { return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });
      const c = counts();

      root.querySelector('#chips').innerHTML = GROUPS.map(function (g) {
        return '<button class="chip' + (filter === g.key ? ' on' : '') + '" data-f="' + g.key + '">' +
          g.label + (c[g.key] ? '<span class="n">' + c[g.key] + '</span>' : '') + '</button>';
      }).join('');

      const host = root.querySelector('#order-list');
      if (!list.length) {
        host.innerHTML = UI.empty('📋', keyword ? '没有匹配的订单' : '该分类暂无订单', keyword ? '换个关键词试试' : '');
      } else {
        host.innerHTML = list.map(card).join('');
      }
      root.querySelector('#list-count').textContent = '共 ' + list.length + ' 笔';
    }

    root.innerHTML =
      '<div class="between" style="margin-bottom:8px">' +
        '<div class="search" style="margin:0;flex:1;max-width:420px">' +
          UI.icon('search') +
          '<input id="q" type="search" placeholder="搜索订单号 / 门店 / 商品" autocomplete="off">' +
        '</div>' +
        '<span class="tiny muted nowrap" id="list-count"></span>' +
      '</div>' +
      '<div class="chips" id="chips"></div>' +
      '<div id="order-list"></div>';

    root.querySelector('#chips').addEventListener('click', function (e) {
      const chip = e.target.closest('[data-f]');
      if (!chip) return;
      filter = chip.dataset.f;
      renderList();
      window.scrollTo({ top: 0 });
    });

    root.querySelector('#q').addEventListener('input', UI.debounce(function (e) {
      keyword = e.target.value.trim();
      renderList();
    }, 160));

    renderList();
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/order-detail.js ==== */
/* 订单详情：进度、商品、供应商履约、验收记录、审批留痕与可执行动作 */
(function (Views) {
  const SHIP = BIZ.domain.SHIPPING_METHODS;

  function findOrder(state, me, id) {
    return BIZ.domain.visibleOrders(state, me).filter(function (o) { return o.id === id; })[0];
  }

  function supplierStatus(status) {
    return UI.supplierStatusText(status);
  }

  Views.order = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;
    const id = r.params[0];
    const order = findOrder(state, me, id);

    if (!order) {
      root.innerHTML = UI.empty('🔒', '订单不存在或无权查看', '请确认订单号，或切换为对应门店/部门身份');
      return;
    }

    const pendingApprovals = domain.pendingApprovals(state, me).some(function (o) { return o.id === order.id; });
    const canAccept = domain.canAcceptOrder(order, me) &&
      ['delivering', 'delivered', 'partial'].indexOf(order.status) >= 0 &&
      (order.items || []).some(function (x) { return Number(x.deliveredQty || 0) > Number(x.accepted || 0); });
    // 门店单先经战区审核，该阶段也应允许提交人撤销（与小程序一致）
    const canCancel = (me.role === 'store' || me.role === 'department') &&
      order.submittedBy === me.id &&
      ['order-review', 'budget-region', 'budget-central', 'amount-approval', 'supplier', 'dept-approval'].indexOf(order.status) >= 0;
    const canClose = me.role === 'central' && ['supplier', 'preparing'].indexOf(order.status) >= 0;
    const canSupply = me.role === 'supplier' && !!(order.supplierRecords || {})[me.supplier];
    const canReorder = BIZ.perm.can(me, 'order.create');
    const mySub = me.role === 'supplier' && (order.items || []).some(function (x) { return x.supplier === me.supplier; });
    // 结算共同确认入口：门店填金额、供应商确认/异议
    const canSettle = !!domain.settleActorOf(order, me) &&
      ['settle-pending', 'settle-disputed'].indexOf(order.status) >= 0;
    const canSettleConfirm = me.role === 'supplier' && order.status === 'settle-supplier' && mySub;
    const settleText = order.status === 'settle-pending' ? '待门店确认结算金额'
      : order.status === 'settle-supplier' ? '待供应商确认结算金额'
        : order.status === 'settle-disputed' ? '供应商提出异议，待门店重提'
          : order.status === 'accepted' ? '结算金额已双方确认，待统一对账' : '';
    const S = order.settlement || null;
    const settleStatusText = S ? ({
      'pending-store': '待门店提交', 'pending-supplier': '待供应商确认',
      confirmed: '双方已确认', disputed: '供应商已提异议'
    }[S.status] || '待门店提交') : '';

    const steps = UI.stepsOf(order);
    const sla = domain.slaForOrder(state, order.id);
    const audits = Store.listAudit(order.id).slice().sort(function (a, b) {
      return String(a.at || '').localeCompare(String(b.at || ''));
    });

    const records = Object.keys(order.supplierRecords || {}).map(function (name) {
      return { name: name, rec: order.supplierRecords[name] };
    });

    const acceptances = (order.acceptances || []).slice().reverse();
    const issues = (order.acceptanceIssues || []).slice().reverse();

    function itemTags(x) {
      let html = '';
      if (Number(x.accepted || 0) > 0) html += '<span class="item-tag">已验收 ' + x.accepted + '</span>';
      if (Number(x.reconciled || 0) > 0) html += '<span class="item-tag">已对账 ' + x.reconciled + '</span>';
      if (Number(x.deliveredQty || 0) > 0 && Number(x.deliveredQty) < x.qty) html += '<span class="item-tag">已发 ' + x.deliveredQty + '</span>';
      return html;
    }

    const heroMeta = [
      order.purchaseType === 'department' ? ('部门 · ' + (order.department || '')) : order.store,
      '提交人 ' + (order.manager || ''),
      BIZ.fmt.fullTime(order.createdAt) || order.created,
      '档位 ' + (BIZ.fmt.TIER_LABEL[order.tier] || '')
    ];

    root.innerHTML =
      '<div class="detail-hero">' +
        '<div class="st">' + UI.icon('box', 'sm') + UI.statusPill(order.status) +
          (sla ? '<span style="color:rgba(255,255,255,.8);font-size:11px">' + BIZ.fmt.hoursText(sla.hours) + (sla.level === 'overdue' ? ' 已超时' : ' 未处理') + '</span>' : '') +
        '</div>' +
        '<div class="id">' + UI.esc(order.id) +
          '<button class="icon-btn plain" id="copy-id" style="color:#fff;width:26px;height:26px;vertical-align:2px" title="复制单号">' + UI.icon('copy', 'xs') + '</button>' +
        '</div>' +
        '<div class="amt">¥' + UI.money(order.total) + '<small>含 ' + (order.items || []).length + ' 种商品</small></div>' +
        '<div class="meta">' + heroMeta.map(function (t) { return '<span>' + UI.esc(t) + '</span>'; }).join('') + '</div>' +
        '<div class="steps">' + steps.map(function (s) {
          return '<div class="step' + (s.done ? ' done' : '') + (s.active ? ' active' : '') + '"><i></i><span>' + s.label + '</span></div>';
        }).join('') + '</div>' +
      '</div>' +

      (order.status === 'cancelled' && order.closeReason
        ? '<div class="alert mt12">' + UI.icon('alert', 'sm') + '<span>' + UI.esc(order.closeReason) + '</span></div>'
        : '') +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">单据信息</div>' +
        '<div class="kv"><span class="k">收货地点</span><span class="v">' + UI.esc(order.store || '') + '</span></div>' +
        '<div class="kv"><span class="k">收货人</span><span class="v">' + UI.esc(order.receiver || '') + '</span></div>' +
        '<div class="kv"><span class="k">地址</span><span class="v">' + UI.esc(order.address || '') + '</span></div>' +
        '<div class="kv"><span class="k">用途</span><span class="v">' + UI.esc(order.purpose || '') + '</span></div>' +
        '<div class="kv"><span class="k">期望到货</span><span class="v">' + UI.esc(order.due || '待供应商确认') + '</span></div>' +
        (order.note ? '<div class="kv"><span class="k">备注</span><span class="v">' + UI.esc(order.note) + '</span></div>' : '') +
        (order.budgetApplied && order.budgetTransfer
          ? '<div class="kv"><span class="k">追加预算</span><span class="v">¥' + UI.money(order.budgetTransfer) + '（从机动池核定）</span></div>'
          : '') +
        (order.groupId
          ? '<div class="kv"><span class="k">采购批次</span><span class="v mono">' + UI.esc(order.groupId) + '</span></div>'
          : '') +
      '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="between mb8"><span class="section-title">商品明细</span>' +
          '<span class="tiny muted">' + (order.items || []).length + ' 种</span></div>' +
        (order.items || []).map(function (x) {
          return '<div class="item-line"><span class="nm">' + UI.esc(x.name) + itemTags(x) +
            '<small>' + UI.esc(x.spec || '') + ' · ' + UI.esc(x.supplier || '') + '</small></span>' +
            '<span class="qty">×' + x.qty + '</span>' +
            '<span class="amt">¥' + UI.money(Number(x.price || 0) * Number(x.qty || 0)) + '</span></div>';
        }).join('') +
        '<div class="divider"></div>' +
        '<div class="between"><span class="small muted">合计</span><span class="money" style="font-size:17px">¥' + UI.money(order.total) + '</span></div>' +
      '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">供应商履约</div>' +
        records.map(function (x) {
          const rec = x.rec;
          const deliveries = rec.deliveries || [];
          return '<div class="rec-block">' +
            '<div class="rec-head">' + UI.icon('truck', 'sm') + '<span class="rec-name">' + UI.esc(x.name) + '</span>' +
              UI.supplierPill(rec.status) + '</div>' +
            (rec.issue ? '<div class="tiny" style="color:var(--bad);margin-top:6px">拒单原因：' + UI.esc(rec.issue) + '</div>' : '') +
            (deliveries.length
              ? deliveries.map(function (d) {
                  const sp = d.shipping || {};
                  return '<div class="rec-del">' +
                    '<div class="between"><span class="strong">第 ' + d.batchNo + ' 批</span>' +
                      '<span class="tiny muted">' + UI.esc(BIZ.fmt.fullTime(d.at)) + '</span></div>' +
                    '<div class="tiny muted mt4">' + UI.esc(SHIP[sp.method] || sp.method || '') +
                      (sp.carrier ? ' · ' + UI.esc(sp.carrier) : '') +
                      (sp.trackingNo ? ' · 单号 ' + UI.esc(sp.trackingNo) : '') + '</div>' +
                    '<div class="tiny muted">' + (sp.contact ? '联系人 ' + UI.esc(sp.contact) + ' · ' : '') +
                      (sp.estimatedAt ? '预计 ' + UI.esc(UI.dateTimeText(sp.estimatedAt)) : '') + '</div>' +
                    '<div class="tiny" style="margin-top:4px">' + d.lines.map(function (l) {
                      return UI.esc(l.name) + ' ×' + l.qty;
                    }).join('、') + '</div>' +
                  '</div>';
                }).join('')
              : '<div class="tiny muted" style="margin-top:6px">' + (rec.status === 'pending' ? '等待供应商接单' : rec.status === 'issue' ? '供应商反馈无法接单' : '尚未登记配送') + '</div>') +
          '</div>';
        }).join('') +
      '</div>' +

      (acceptances.length || issues.length
        ? '<div class="card card-pad mt12">' +
            '<div class="section-title mb8">验收记录</div>' +
            acceptances.map(function (a) {
              return '<div class="rec-block"><div class="between"><span class="strong">第 ' + a.batchNo + ' 批 · 验收合格</span>' +
                '<span class="tiny muted">' + UI.esc(BIZ.fmt.fullTime(a.at)) + '</span></div>' +
                '<div class="tiny muted mt4">' + UI.esc(a.byName || a.by || '') + (a.note ? ' · ' + UI.esc(a.note) : '') + '</div>' +
                '<div class="tiny mt4">' + (a.lines || []).map(function (l) { return UI.esc(l.name) + ' ×' + l.qty; }).join('、') + '</div>' +
                (a.noPhoto ? '<div class="tiny" style="color:var(--warn);margin-top:4px">演示环境无照片留证</div>' : '') +
              '</div>';
            }).join('') +
            issues.map(function (a) {
              return '<div class="rec-block" style="border-color:#f6d9d4;background:#fffaf9">' +
                '<div class="between"><span class="strong" style="color:var(--bad)">第 ' + a.batchNo + ' 批 · 异常反馈</span>' +
                '<span class="tiny muted">' + UI.esc(BIZ.fmt.fullTime(a.at)) + '</span></div>' +
                '<div class="tiny mt4">' + UI.esc(a.note || '') + '</div></div>';
            }).join('') +
          '</div>'
        : '') +

      // 结算金额共同确认：验收完成后由门店填报、供应商确认，双方一致才进入对账
      ((S || settleText)
        ? '<div class="card card-pad mt12">' +
            '<div class="between mb8"><span class="section-title">结算金额</span>' +
              '<span class="pill ' + (S && S.status === 'confirmed' ? 'good' : 'warn') + '">' + UI.esc(S ? settleStatusText : settleText) + '</span></div>' +
            (S
              ? '<div class="kv"><span class="k">结算金额</span><span class="v money">¥' + UI.money(S.amount) + '</span></div>' +
                '<div class="kv"><span class="k">实收核算</span><span class="v num">¥' + UI.money(S.itemsAmount) + '</span></div>' +
                (Math.abs(Number(S.diff || 0)) > 0.004
                  ? '<div class="kv"><span class="k">差异</span><span class="v">' + (Number(S.diff) < 0 ? '少结' : '多结') + ' ¥' + UI.money(Math.abs(Number(S.diff))) + '</span></div>' : '') +
                (S.reason ? '<div class="kv"><span class="k">差异原因</span><span class="v">' + UI.esc(S.reason) + '</span></div>' : '') +
                '<div class="kv"><span class="k">提交人</span><span class="v">' + UI.esc(S.byName || '') +
                  (S.submittedAt ? ' · ' + UI.esc(BIZ.fmt.fullTime(S.submittedAt)) : '') + '</span></div>' +
                (S.confirmedAt ? '<div class="kv"><span class="k">供应商确认</span><span class="v">' + UI.esc(BIZ.fmt.fullTime(S.confirmedAt)) + '</span></div>' : '') +
                (S.disputes || []).map(function (d) {
                  return '<div class="rec-block" style="border-color:#f6d9d4;background:#fffaf9">' +
                    '<div class="between"><span class="strong" style="color:var(--bad)">供应商异议 · ' + UI.esc(d.supplier || d.by || '') + '</span>' +
                    '<span class="tiny muted">' + UI.esc(BIZ.fmt.fullTime(d.at)) + '</span></div>' +
                    '<div class="tiny mt4">' + UI.esc(d.reason || '') + '</div></div>';
                }).join('')
              : '<div class="tiny muted">验收完成后由门店填写实际结算金额，供应商在自己的账号确认，双方一致后进入统一对账。</div>') +
          '</div>'
        : '') +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb12">流转记录</div>' +
        (audits.length
          ? '<div class="timeline">' + audits.map(function (a) {
              const bad = /驳回|撤销|关闭|无法接单|异常/.test(a.decision || '');
              return '<div class="tl-item' + (bad ? ' bad' : ' on') + '">' +
                '<div class="tl-t">' + UI.esc(a.decision || '') + '</div>' +
                '<div class="tl-d">' + UI.esc(a.role || '') + (a.note ? ' · ' + UI.esc(a.note) : '') + '</div>' +
                '<div class="tl-time">' + UI.esc(BIZ.fmt.fullTime(a.at)) + '</div></div>';
            }).join('') + '</div>'
          : '<div class="timeline">' +
              '<div class="tl-item on"><div class="tl-t">提交订单</div>' +
                '<div class="tl-d">' + UI.esc(order.manager || '') + ' · ' + UI.esc(order.purpose || '') + '</div>' +
                '<div class="tl-time">' + UI.esc(BIZ.fmt.fullTime(order.createdAt)) + '</div></div>' +
              (order.supplierSentAt
                ? '<div class="tl-item on"><div class="tl-t">已发送供应商</div>' +
                    '<div class="tl-time">' + UI.esc(BIZ.fmt.fullTime(order.supplierSentAt)) + '</div></div>'
                : '') +
            '</div>') +
      '</div>' +

      '<div class="actionbar">' +
        (canReorder ? '<button class="btn ghost" id="btn-reorder">再次下单</button>' : '') +
        (canCancel ? '<button class="btn danger" id="btn-cancel">撤销</button>' : '') +
        (canClose ? '<button class="btn danger" id="btn-close">关闭订单</button>' : '') +
        (pendingApprovals ? '<button class="btn primary" id="btn-approve">去审批</button>' : '') +
        (canAccept ? '<button class="btn primary" id="btn-accept">去验收</button>' : '') +
        (canSettle || canSettleConfirm ? '<button class="btn primary" id="btn-settle">' + (canSettleConfirm ? '确认结算金额' : '填写结算金额') + '</button>' : '') +
        (canSupply && ['supplier', 'preparing'].indexOf(order.status) >= 0 ? '<button class="btn primary" id="btn-supply">去处理</button>' : '') +
        (!canReorder && !canCancel && !canClose && !pendingApprovals && !canAccept && !canSupply && !canSettle && !canSettleConfirm
          ? '<button class="btn ghost" style="flex:1" onclick="history.back()">返回</button>'
          : '') +
      '</div>' +
      '<div class="action-spacer"></div>';

    const copyBtn = root.querySelector('#copy-id');
    if (copyBtn) copyBtn.onclick = function () { UI.copy(order.id); };

    const reorder = root.querySelector('#btn-reorder');
    if (reorder) reorder.onclick = function () {
      const cart = Store.loadCart(me.id);
      cart.lines = cart.lines || {};
      (order.items || []).forEach(function (x) {
        if (!BIZ.domain.CATALOG_BY_ID[x.id]) return;
        cart.lines[x.id] = Math.min(9999, (cart.lines[x.id] || 0) + Number(x.qty || 0));
      });
      if (order.purchaseType !== 'department') cart.store = order.store;
      Store.saveCart(me.id, cart);
      UI.toast('已加入清单，可调整数量后提交', 'good');
      App.go('/catalog');
    };

    const cancel = root.querySelector('#btn-cancel');
    if (cancel) cancel.onclick = function () {
      UI.confirm({
        title: '撤销这笔订单？',
        sub: '撤销后占用金额会释放，若已追加预算会退回机动池。',
        okText: '确认撤销',
        danger: true
      }).then(function (ok) {
        if (!ok) return;
        try {
          App.mutate(function (st, ses) { return BIZ.domain.cancelOrder(st, ses, order.id); });
          UI.toast('已撤销', 'good');
          App.reload();
        } catch (e) { UI.toast(e.message, 'error', 2600); }
      });
    };

    const close = root.querySelector('#btn-close');
    if (close) close.onclick = function () {
      const s = UI.sheet({
        title: '关闭停滞订单',
        sub: '适用于供应商长期未接单、或接单后一直未发货。关闭后释放预算占用并留痕。',
        body: '<div class="field"><div class="label">关闭原因</div>' +
          '<textarea class="textarea" id="close-reason" maxlength="120" placeholder="例如：供应商无法供货，已电话确认"></textarea></div>',
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: '确认关闭', cls: 'danger-solid', onClick: function (done, body) {
              const reason = body.querySelector('#close-reason').value.trim();
              try {
                App.mutate(function (st, ses) {
                  return BIZ.domain.closeOrder(st, ses, { orderId: order.id, reason: reason });
                });
                UI.toast('订单已关闭', 'good');
                App.reload();
              } catch (e) { UI.toast(e.message, 'error', 2600); return false; }
            } }
        ]
      });
    };

    const approve = root.querySelector('#btn-approve');
    if (approve) approve.onclick = function () { App.go('/approvals'); };

    const accept = root.querySelector('#btn-accept');
    if (accept) accept.onclick = function () { App.go('/accept/' + order.id); };

    const supply = root.querySelector('#btn-supply');
    if (supply) supply.onclick = function () { App.go('/supplier'); };

    const settle = root.querySelector('#btn-settle');
    if (settle) settle.onclick = function () { App.go('/settle/' + order.id); };
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/approvals.js ==== */
/* 待办审批：预算核定缺口处理、金额审批、部门批次统一确认 */
(function (Views) {
  function gapText(order, state) {
    if (order.status !== 'budget-central') return '';
    const g = BIZ.domain.budgetGap(state, order);
    if (g.needed <= 0) return '';
    if (g.ok) {
      return '<div class="ap-budget">需从机动池追加 <b>¥' + UI.money(g.needed) + '</b>，机动池余额 ¥' + UI.money(g.flex) + '，足够核定</div>';
    }
    return '<div class="ap-budget bad">需追加 <b>¥' + UI.money(g.needed) + '</b> · 机动池仅 ¥' + UI.money(g.flex) +
      ' · 还差 <b>¥' + UI.money(g.short) + '</b>（单笔可核定上限 ¥' + UI.money(g.maxSupport) + '）</div>';
  }

  Views.approvals = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;

    if (!BIZ.perm.can(me, 'approve')) {
      root.innerHTML = UI.empty('🔐', '当前身份无审批权限', '审批由战区负责人与运营管理部处理');
      return;
    }

    const list = domain.pendingApprovals(state, me);
    const single = list.filter(function (o) { return o.status !== 'dept-approval'; });
    const deptGroups = {};
    list.filter(function (o) { return o.status === 'dept-approval'; }).forEach(function (o) {
      const key = o.groupId || o.id;
      if (!deptGroups[key]) deptGroups[key] = [];
      deptGroups[key].push(o);
    });

    const gapByOrder = {};
    single.forEach(function (o) {
      if (o.status === 'budget-central') gapByOrder[o.id] = domain.budgetGap(state, o);
    });

    function orderCard(o) {
      const g = gapByOrder[o.id];
      return '<div class="card card-pad" style="margin-bottom:9px" data-order="' + UI.esc(o.id) + '">' +
        '<div class="between"><span class="order-id">' + UI.esc(o.id) + '</span>' + UI.statusPill(o.status) + '</div>' +
        '<div class="order-meta">' + UI.esc(o.purchaseType === 'department' ? ('部门采购 · ' + o.department) : o.store) +
          ' · ' + UI.esc(o.manager || '') + ' · ' + UI.esc(BIZ.fmt.shortTime(o.createdAt)) + '</div>' +
        '<div class="order-items">' + UI.esc((o.items || []).slice(0, 3).map(function (x) { return x.name + '×' + x.qty; }).join('、')) +
          ((o.items || []).length > 3 ? ' 等 ' + o.items.length + ' 项' : '') + '</div>' +
        '<div class="between mt8"><span class="pill line">' + UI.esc(BIZ.fmt.TIER_LABEL[o.tier] || '') + '</span>' +
          '<span class="order-amt">¥' + UI.money(o.total) + '</span></div>' +
        (g && g.needed > 0
          ? (g.ok
              ? '<div class="ap-budget">需从机动池追加 <b>¥' + UI.money(g.needed) + '</b>，余额 ¥' + UI.money(g.flex) + '</div>'
              : '<div class="ap-budget bad">需追加 <b>¥' + UI.money(g.needed) + '</b> · 机动池 ¥' + UI.money(g.flex) +
                ' · 还差 <b>¥' + UI.money(g.short) + '</b></div>')
          : '') +
        '<div class="btn-group" style="margin-top:12px">' +
          '<button class="btn ghost sm" data-reject="' + UI.esc(o.id) + '">驳回</button>' +
          '<button class="btn primary sm" data-pass="' + UI.esc(o.id) + '">通过</button>' +
        '</div>' +
      '</div>';
    }

    function groupCard(groupId, orders) {
      const total = orders.reduce(function (s, o) { return s + Number(o.total || 0); }, 0);
      return '<div class="card card-pad" style="margin-bottom:9px" data-group="' + UI.esc(groupId) + '">' +
        '<div class="between"><span class="order-id">' + UI.esc(groupId) + '</span>' +
          '<span class="pill warn">待统一确认</span></div>' +
