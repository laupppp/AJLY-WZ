                  '<span class="btn-group" style="flex:0 0 auto">' +
                    '<button class="btn ghost xs" data-del="' + UI.esc(d.id) + '">删除</button>' +
                    '<button class="btn primary xs" data-restore="' + UI.esc(d.id) + '">继续编辑</button>' +
                  '</span></div>' +
              '</div>';
            }).join('')
          : UI.empty('🗂', '还没有草稿', '在结算页点「存草稿」会保存到这里')) +
        '<div style="text-align:center;margin-top:8px"><a class="btn ghost" href="#/catalog" style="width:170px">去选商品</a></div>';

      root.querySelectorAll('[data-restore]').forEach(function (btn) {
        btn.onclick = function () {
          const d = Store.listDrafts(me.id).filter(function (x) { return x.id === btn.dataset.restore; })[0];
          if (!d) return;
          Store.saveCart(me.id, { lines: Object.assign({}, d.lines), store: d.store || '' });
          App.go('/checkout');
        };
      });

      root.querySelectorAll('[data-del]').forEach(function (btn) {
        btn.onclick = function () {
          UI.confirm({ title: '删除这份草稿？', okText: '删除', danger: true }).then(function (ok) {
            if (!ok) return;
            Store.deleteDraft(btn.dataset.del, me.id);
            UI.toast('已删除');
            render();
          });
        };
      });
    }

    render();
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/budget.js ==== */
/* 门店费用预算设置（中台）：房间数 × 科目系数，可为单店直接定额 */
(function (Views) {
  Views.budget = function (root, r, ctx) {
    const domain = BIZ.domain;
    const perm = BIZ.perm;
    const BUDGET = BIZ.budget;
    const me = ctx.me;

    if (!perm.can(me, 'budget.config')) {
      root.innerHTML = UI.empty('🔒', '当前身份无预算设置权限', '仅运营管理部（中台）可调整门店费用预算');
      return;
    }

    let state = ctx.state;
    const sync = function () { state = Store.loadState(); };

    let keyword = '';
    let limit = 12;
    let editing = '';
    let form = null;

    function rows() {
      const summary = domain.budgetSummary(state, me);
      const usedOf = {};
      summary.forEach(function (x) { usedOf[x.store] = x; });
      const kw = keyword.trim();
      return BIZ.catalog.STORES.filter(function (s) {
        return !kw || s.indexOf(kw) >= 0;
      }).map(function (s) {
        const cfg = domain.budgetConfigOf(state, s);
        const used = usedOf[s];
        return {
          store: s,
          rooms: cfg.rooms,
          total: cfg.total,
          used: used ? used.used : 0,
          pct: used ? used.usedPct : 0,
          items: cfg.items
        };
      });
    }

    function storeCard(row) {
      const isEdit = editing === row.store;
      const tone = row.pct >= 90 ? 'bad' : row.pct >= 70 ? 'warn' : '';
      const itemLines = row.items.map(function (it) {
        return '<div class="bitem">' +
          '<span class="bitem-name">' + UI.esc(it.name) + '</span>' +
          '<span class="bitem-basis">' + (it.basis === 'override' ? '直接定额' : it.coef + ' 元/间') + '</span>' +
          '<span class="bitem-amt num">¥' + UI.money(it.budget) + '</span>' +
        '</div>';
      }).join('');

      let editor = '';
      if (isEdit && form) {
        editor = '<div class="bedit">' +
          '<div class="field"><div class="label">管理房间数</div>' +
            '<input class="input" type="number" min="1" id="f-rooms" value="' + form.rooms + '"></div>' +
          form.items.map(function (fi, i) {
            return '<div class="bedit-item">' +
              '<div class="between"><span class="strong small">' + UI.esc(fi.name) + '</span>' +
                '<span class="tiny muted">当前 ¥' + UI.money(fi.budget) + (fi.adjust ? '（含追加 ' + UI.money(fi.adjust) + '）' : '') + '</span></div>' +
              '<div class="field-row mt8">' +
                '<div class="field" style="margin:0"><div class="label">系数（元/间）</div>' +
                  '<input class="input" type="number" min="0" step="0.01" data-coef="' + i + '" value="' + fi.coef + '"></div>' +
                '<div class="field" style="margin:0"><div class="label">直接定额（留空按公式）</div>' +
                  '<input class="input" type="number" min="0" step="1" data-ov="' + i + '" value="' + (fi.override === null ? '' : fi.override) + '"></div>' +
              '</div>' +
            '</div>';
          }).join('') +
          '<div class="btn-group mt12">' +
            '<button class="btn ghost sm" data-reset="' + UI.esc(row.store) + '">恢复默认</button>' +
            '<button class="btn primary sm" data-save="' + UI.esc(row.store) + '">保存</button>' +
          '</div>' +
          '<div class="tiny muted mt8">保存后立即生效：下单试算、预算核定缺口、看板统计都按新额度计算，历史订单不追溯。</div>' +
        '</div>';
      }

      return '<div class="card card-pad store-card" data-store="' + UI.esc(row.store) + '">' +
        '<div class="between">' +
          '<div class="grow"><div class="strong">' + UI.esc(row.store) + '</div>' +
            '<div class="tiny muted mt4">' + row.rooms + ' 间房 · 已用 ¥' + UI.money(row.used) + '（' + row.pct + '%）</div></div>' +
          '<div style="text-align:right;flex:0 0 auto">' +
            '<div class="num strong">¥' + UI.money(row.total) + '</div>' +
            '<button class="btn ghost xs mt4" data-edit="' + UI.esc(row.store) + '">' + (isEdit ? '收起' : '调整') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="bar mt8" style="height:4px"><i class="' + tone + '" style="width:' + Math.min(100, row.pct) + '%"></i></div>' +
        '<div class="bitems">' + itemLines + '</div>' +
        editor +
      '</div>';
    }

    function render() {
      const list = rows();
      const shown = list.slice(0, limit);
      root.innerHTML =
        '<div class="between" style="margin-bottom:10px">' +
          '<div><div class="section-title">门店费用预算</div>' +
            '<div class="tiny muted mt4">额度 = 管理房间数 × 科目系数，可对单店直接定额；机动池余额 ¥' + UI.money(state.flex) + '</div></div>' +
          '<span class="pill line">' + list.length + ' 家门店</span>' +
        '</div>' +
        '<div class="card card-pad" style="padding:12px 14px">' +
          '<div class="field" style="margin:0"><div class="label">搜索门店</div>' +
            '<input class="input" id="b-kw" placeholder="输入门店名称，如 福海和平店" value="' + UI.esc(keyword) + '"></div>' +
        '</div>' +
        '<div class="bstore-list">' + shown.map(storeCard).join('') + '</div>' +
        (shown.length < list.length
          ? '<div style="text-align:center;margin-top:10px"><button class="btn ghost" id="b-more" style="width:210px">显示更多（' + shown.length + '/' + list.length + '）</button></div>'
          : '') +
        '<div class="note-box mt12">三项费用均按「管理房间数 × 系数」计提，默认 1000 间房 × 10 元/间 = 每科目 ¥10,000。' +
          '机动池追加与门店间调剂不计入基数，在「统一对账 → 预算占用」中查看明细。</div>';

      const kwInput = root.querySelector('#b-kw');
      kwInput.addEventListener('input', UI.debounce(function () {
        keyword = kwInput.value;
        limit = 12;
        render();
        const again = root.querySelector('#b-kw');
        again.focus();
        again.setSelectionRange(keyword.length, keyword.length);
      }, 220));

      const more = root.querySelector('#b-more');
      if (more) more.onclick = function () { limit += 20; render(); };

      root.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.onclick = function () {
          const name = btn.dataset.edit;
          if (editing === name) { editing = ''; form = null; render(); return; }
          const cfg = domain.budgetConfigOf(state, name);
          editing = name;
          form = {
            rooms: String(cfg.rooms),
            items: cfg.items.map(function (it) {
              return {
                key: it.key, name: it.name, coef: it.coef,
                override: it.override === null ? '' : it.override,
                budget: it.budget, adjust: it.adjust
              };
            })
          };
          render();
          const card = root.querySelector('[data-store="' + name + '"]');
          if (card && card.scrollIntoView) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        };
      });

      root.querySelectorAll('[data-coef],[data-ov]').forEach(function (input) {
        input.addEventListener('input', function () {
          if (!form) return;
          const idx = Number(input.dataset.coef !== undefined ? input.dataset.coef : input.dataset.ov);
          const item = form.items[idx];
          if (!item) return;
          if (input.dataset.coef !== undefined) item.coef = input.value;
          else item.override = input.value;
        });
      });

      const roomsInput = root.querySelector('#f-rooms');
      if (roomsInput) roomsInput.addEventListener('input', function () { if (form) form.rooms = roomsInput.value; });

      root.querySelectorAll('[data-save]').forEach(function (btn) {
        btn.onclick = function () {
          const name = btn.dataset.save;
          if (!form) return;
          const payload = { store: name, rooms: Number(form.rooms), coef: {}, override: {} };
          form.items.forEach(function (it) {
            const c = String(it.coef).trim();
            const o = String(it.override).trim();
            payload.coef[it.key] = c === '' ? null : Number(c);
            payload.override[it.key] = o === '' ? null : Number(o);
          });
          try {
            let changed = [];
            App.mutate(function (st, ses) {
              const res = BIZ.domain.saveBudgetConfig(st, ses, payload);
              changed = res.changed;
              Store.appendAudit([{
                orderId: '', kind: 'budget', stage: 'budget-config', decision: '调整门店预算',
                role: '运营管理部（' + ses.id + '）', from: '', to: '',
                note: name + '：' + changed.join('，'), at: new Date().toISOString()
              }]);
            });
            sync();
            UI.toast('已保存：' + changed.join('，'), 'good', 2600);
            const cfg = domain.budgetConfigOf(state, name);
            form = {
              rooms: String(cfg.rooms),
              items: cfg.items.map(function (it) {
                return {
                  key: it.key, name: it.name, coef: it.coef,
                  override: it.override === null ? '' : it.override,
                  budget: it.budget, adjust: it.adjust
                };
              })
            };
            render();
          } catch (err) {
            UI.toast(err.message, 'error', 3000);
          }
        };
      });

      root.querySelectorAll('[data-reset]').forEach(function (btn) {
        btn.onclick = function () {
          const name = btn.dataset.reset;
          UI.confirm({
            title: '恢复默认预算？',
            sub: '清除「' + name + '」的科目系数覆盖与直接定额，改回房间数 × 默认系数（机动池追加/调剂不受影响）。',
            okText: '恢复默认'
          }).then(function (ok) {
            if (!ok) return;
            const payload = { store: name, coef: {}, override: {} };
            BIZ.budget.KEYS.forEach(function (k) {
              payload.coef[k] = null;
              payload.override[k] = null;
            });
            try {
              App.mutate(function (st, ses) { BIZ.domain.saveBudgetConfig(st, ses, payload); });
              sync();
              UI.toast('已恢复默认');
              const cfg = domain.budgetConfigOf(state, name);
              form = {
                rooms: String(cfg.rooms),
                items: cfg.items.map(function (it) {
                  return {
                    key: it.key, name: it.name, coef: it.coef,
                    override: it.override === null ? '' : it.override,
                    budget: it.budget, adjust: it.adjust
                  };
                })
              };
              render();
            } catch (err) {
              UI.toast(err.message, 'error', 3000);
            }
          });
        };
      });
    }

    render();
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/console.js ==== */
/* 中台操作台（仅运营管理部）：物资增删改与上下架、供应商合同总额上限、门店审批规则配置 */
(function (Views) {
  Views.console = function (root, r, ctx) {
    const domain = BIZ.domain;
    const perm = BIZ.perm;
    const BUDGET = BIZ.budget;
    const me = ctx.me;

    if (!perm.can(me, 'catalog.manage')) {
      root.innerHTML = UI.empty('🔒', '仅运营管理部（中台）可进入操作台', '物资维护、合同上限与审批规则仅对运营管理部开放');
      return;
    }

    let state = ctx.state;
    const sync = function () { state = Store.loadState(); };

    let tab = ['catalog', 'contracts', 'rules'].indexOf(r.query.tab) >= 0 ? r.query.tab : 'catalog';
    let filter = 'all';
    let keyword = '';
    let shown = 30;

    function render() {
      sync();
      const tabsHtml =
        '<div class="tab-seg" id="con-tabs">' +
          '<button data-tab="catalog"' + (tab === 'catalog' ? ' class="on"' : '') + '>物资目录管理</button>' +
          '<button data-tab="contracts"' + (tab === 'contracts' ? ' class="on"' : '') + '>供应商合同上限</button>' +
          '<button data-tab="rules"' + (tab === 'rules' ? ' class="on"' : '') + '>审批规则配置</button>' +
        '</div>';

      let bodyHtml = '';
      if (tab === 'catalog') bodyHtml = renderCatalog();
      else if (tab === 'contracts') bodyHtml = renderContracts();
      else bodyHtml = renderRules();

      root.innerHTML = tabsHtml + bodyHtml;

      if (tab === 'catalog') {
        const qEl = root.querySelector('#con-q');
        const boxEl = root.querySelector('#con-search');
        if (qEl) {
          qEl.value = keyword;
          if (keyword && boxEl) boxEl.classList.add('has');
          qEl.addEventListener('input', UI.debounce(function () {
            keyword = qEl.value;
            shown = 30;
            renderCatalogListOnly();
          }, 180));
        }
      }
    }

    function catalogStats() {
      const all = domain.catalogOf(state, { includeDeleted: true });
      const live = all.filter(function (p) { return !p.deleted; });
      const active = live.filter(function (p) { return p.enabled !== false; });
      const off = live.filter(function (p) { return p.enabled === false; });
      const centralOnly = live.filter(function (p) { return p.purchaseScope === 'central'; });
      const deleted = all.filter(function (p) { return !!p.deleted; });
      const custom = live.filter(function (p) { return p.isCustom || p.isModified; });
      return { all: all, live: live, active: active, off: off, centralOnly: centralOnly, deleted: deleted, custom: custom };
    }

    function filterCatalog(stInfo) {
      let base;
      if (filter === 'deleted') base = stInfo.deleted;
      else if (filter === 'off') base = stInfo.off;
      else if (filter === 'central') base = stInfo.centralOnly;
      else if (filter === 'all') base = stInfo.live;
      else base = stInfo.live.filter(function (p) { return p.category === filter; });

      const kw = keyword.trim().toLowerCase();
      if (kw) {
        base = base.filter(function (p) {
          const hay = (p.id + ' ' + p.name + ' ' + (p.spec || '') + ' ' + (p.supplier || '')).toLowerCase();
          return hay.indexOf(kw) >= 0;
        });
      }
      return base;
    }

    function catalogItemHtml(p) {
      const bKey = UI.budgetKeyOf(p);
      const isCentralOnly = p.purchaseScope === 'central';
      const statusPill = p.deleted
        ? '<span class="pill bad">已删除</span>'
        : (p.enabled === false ? '<span class="pill warn">已下架</span>' : '<span class="pill good">在售</span>');
      const scopePill = !p.deleted
        ? (isCentralOnly ? '<span class="pill violet">仅中台采</span>' : '<span class="pill line">全员可采</span>')
        : '';
      const sourcePill = p.isCustom
        ? '<span class="pill info">新增</span>'
        : (p.isModified ? '<span class="pill dark">已修改</span>' : '');

      return '<div class="card card-pad con-item">' +
        '<div class="con-head">' +
          '<div class="prod-ico tone-' + bKey + '" style="width:36px;height:36px">' + UI.catIcon(bKey) + '</div>' +
          '<div class="grow" style="min-width:0">' +
            '<div class="row" style="gap:6px;flex-wrap:wrap">' +
              '<span class="strong">' + UI.esc(p.name) + '</span>' +
              '<span class="tiny muted mono">' + UI.esc(p.id) + '</span>' +
            '</div>' +
            '<div class="tiny muted mt4">' + UI.esc(p.category) + '</div>' +
          '</div>' +
          '<div class="con-tags">' + statusPill + scopePill + sourcePill + '</div>' +
        '</div>' +
        (p.spec ? '<div class="tiny muted mt8">规格：' + UI.esc(p.spec) + '</div>' : '') +
        '<div class="tiny muted mt4">供应商：' + UI.esc(p.supplier || '未指定') +
          (p.note ? ' · ' + UI.esc(p.note) : '') + '</div>' +
        '<div class="con-foot">' +
          '<div><span class="money" style="font-size:16px">¥' + UI.money2(p.price) + '</span>' +
            '<span class="tiny muted"> / ' + UI.esc(p.unit || '个') + '</span></div>' +
          '<div class="row" style="gap:6px;flex-wrap:wrap">' +
            (p.deleted
              ? '<button class="btn soft xs" data-cat-restore="' + UI.esc(p.id) + '">恢复上架</button>'
              : '<button class="btn ' + (isCentralOnly ? 'soft' : 'ghost') + ' xs" data-cat-scope="' + UI.esc(p.id) + '">' +
                  (isCentralOnly ? '开放全员采' : '设为仅中台采') + '</button>' +
                '<button class="btn ghost xs" data-cat-edit="' + UI.esc(p.id) + '">编辑</button>' +
                '<button class="btn ' + (p.enabled === false ? 'soft' : 'ghost') + ' xs" data-cat-toggle="' + UI.esc(p.id) + '">' +
                  (p.enabled === false ? '上架' : '下架') + '</button>' +
                '<button class="btn danger xs" data-cat-del="' + UI.esc(p.id) + '">删除</button>') +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function renderCatalogListOnly() {
      const stInfo = catalogStats();
      const list = filterCatalog(stInfo);
      const slice = list.slice(0, shown);
      const host = root.querySelector('#con-list');
      const moreHost = root.querySelector('#con-more');
      const boxEl = root.querySelector('#con-search');
      if (boxEl) boxEl.classList.toggle('has', !!keyword);
      if (!host) return;
      host.innerHTML = slice.length
        ? slice.map(catalogItemHtml).join('')
        : UI.empty('📦', '没有匹配的物资', '可修改关键词或点右上角「＋ 新增物资」');
      if (moreHost) {
        moreHost.innerHTML = list.length > shown
          ? '<button class="more" id="con-btn-more">加载更多（还有 ' + (list.length - shown) + ' 项）</button>'
          : (list.length ? '<div class="tiny muted" style="text-align:center;padding:8px 0">共 ' + list.length + ' 项物资</div>' : '');
      }
    }

    function renderCatalog() {
      const stInfo = catalogStats();
      const list = filterCatalog(stInfo);
      const slice = list.slice(0, shown);

      const catChips = BIZ.catalog.CATEGORY_ORDER.map(function (cat) {
        const cnt = stInfo.live.filter(function (p) { return p.category === cat; }).length;
        return '<button class="chip' + (filter === cat ? ' on' : '') + '" data-cat-filter="' + UI.esc(cat) + '">' +
          UI.esc(cat) + '<span class="n">' + cnt + '</span></button>';
      }).join('');

      return '<div class="stat-grid">' +
          '<div class="stat"><div class="k">当前在售</div><div class="v num">' + stInfo.active.length + '</div><div class="d">共 ' + stInfo.live.length + ' 项（含下架）</div></div>' +
          '<div class="stat"><div class="k">仅中台采</div><div class="v num">' + stInfo.centralOnly.length + '</div><div class="d">门店与部门不可自采</div></div>' +
          '<div class="stat"><div class="k">已下架</div><div class="v num">' + stInfo.off.length + '</div><div class="d">暂不可新下单</div></div>' +
          '<div class="stat"><div class="k">中台维护</div><div class="v num">' + stInfo.custom.length + '</div><div class="d">已新增/修改</div></div>' +
        '</div>' +

        '<div class="between wrap mt12" style="gap:8px">' +
          '<div class="search grow" id="con-search" style="margin-top:0;min-width:200px">' + UI.icon('search') +
            '<input id="con-q" type="search" placeholder="搜索物资名称 / 编号 / 规格 / 供应商" autocomplete="off">' +
            '<button class="clear" id="con-q-clear" type="button">' + UI.icon('close', 'sm') + '</button>' +
          '</div>' +
          '<div class="row" style="gap:6px">' +
            '<button class="btn ghost sm" id="con-export">导出目录</button>' +
            '<button class="btn primary sm" id="con-add">＋ 新增物资</button>' +
          '</div>' +
        '</div>' +

        '<div class="chips mt8">' +
          '<button class="chip' + (filter === 'all' ? ' on' : '') + '" data-cat-filter="all">全部<span class="n">' + stInfo.live.length + '</span></button>' +
          catChips +
          '<button class="chip' + (filter === 'central' ? ' on' : '') + '" data-cat-filter="central">仅中台采<span class="n">' + stInfo.centralOnly.length + '</span></button>' +
          '<button class="chip' + (filter === 'off' ? ' on' : '') + '" data-cat-filter="off">已下架<span class="n">' + stInfo.off.length + '</span></button>' +
          '<button class="chip' + (filter === 'deleted' ? ' on' : '') + '" data-cat-filter="deleted">已删除<span class="n">' + stInfo.deleted.length + '</span></button>' +
        '</div>' +

        '<div class="con-list" id="con-list">' +
          (slice.length
            ? slice.map(catalogItemHtml).join('')
            : UI.empty('📦', '没有匹配的物资', '可修改关键词或点「＋ 新增物资」')) +
        '</div>' +
        '<div id="con-more">' +
          (list.length > shown
            ? '<button class="more" id="con-btn-more">加载更多（还有 ' + (list.length - shown) + ' 项）</button>'
            : (list.length ? '<div class="tiny muted" style="text-align:center;padding:8px 0">共 ' + list.length + ' 项物资</div>' : '')) +
        '</div>' +
        '<div class="note-box mt12">说明：中台新增、编辑、下架或删除物资后，采购下单页实时生效；已被在途订单引用的物资不可直接删除，请先「下架」避免影响履约与对账。</div>';
    }

    function openItemModal(existing) {
      const isEdit = !!existing;
      const sups = domain.suppliersOf(state);
      const curSup = existing ? (existing.supplier || '') : (sups[0] || '');
      const hasSup = sups.indexOf(curSup) >= 0;
      let curScope = existing && existing.purchaseScope === 'central' ? 'central' : 'all';

      const body =
        '<div class="field-row">' +
          '<div class="field"><div class="label">物资编号' + (isEdit ? '' : '（选填）') + '</div>' +
            '<input class="input mono" id="m-id" maxlength="24" value="' + UI.esc(existing ? existing.id : '') + '"' +
              (isEdit ? ' readonly style="background:#f5f8fc;color:var(--muted)"' : ' placeholder="留空自动生成 WZ-xxx"') + '></div>' +
          '<div class="field"><div class="label">计量单位<span class="req">*</span></div>' +
            '<input class="input" id="m-unit" maxlength="16" value="' + UI.esc(existing ? (existing.unit || '个') : '个') + '" placeholder="个 / 箱 / 张"></div>' +
        '</div>' +
        '<div class="field"><div class="label">物资名称<span class="req">*</span></div>' +
          '<input class="input" id="m-name" maxlength="60" value="' + UI.esc(existing ? existing.name : '') + '" placeholder="例如：A4 打印纸 80g"></div>' +
        '<div class="field-row">' +
          '<div class="field"><div class="label">所属大类（决定合同与预算项）<span class="req">*</span></div>' +
            '<select class="select" id="m-cat">' +
              BIZ.catalog.CATEGORY_ORDER.map(function (c) {
                const meta = BIZ.catalog.CATEGORY_META[c] || {};
                return '<option value="' + UI.esc(c) + '"' + (existing && existing.category === c ? ' selected' : '') + '>' +
                  UI.esc(c) + (meta.budgetName ? '（' + UI.esc(meta.budgetName) + '）' : '') + '</option>';
              }).join('') +
            '</select></div>' +
          '<div class="field"><div class="label">单价（元）<span class="req">*</span></div>' +
            '<input class="input" id="m-price" type="number" min="0.01" step="0.01" value="' + (existing ? existing.price : '') + '" placeholder="0.00"></div>' +
        '</div>' +
        '<div class="field"><div class="label">采购权限范围<span class="req">*</span></div>' +
          '<div class="radio-cards" id="m-scope-cards">' +
            '<label class="radio-card' + (curScope === 'all' ? ' on' : '') + '" data-scope="all">' +
              '<span class="rd"></span><span class="grow"><span>门店与部门均可自行下单（默认）</span>' +
              '<span class="d">门店店长、各职能部门及运营管理部均可选购</span></span></label>' +
            '<label class="radio-card' + (curScope === 'central' ? ' on' : '') + '" data-scope="central">' +
              '<span class="rd"></span><span class="grow"><span>仅运营管理部（中台）集中采购</span>' +
              '<span class="d">隐藏对门店与普通职能部门的下单入口，仅中台自采可用</span></span></label>' +
          '</div>' +
        '</div>' +
        '<div class="field"><div class="label">对应费用科目（默认跟随大类）</div>' +
          '<select class="select" id="m-budget">' +
            '<option value="">按大类自动归属（推荐）</option>' +
            BUDGET.ITEMS.map(function (it) {
              return '<option value="' + UI.esc(it.key) + '"' + (existing && existing.budgetItem === it.key ? ' selected' : '') + '>' + UI.esc(it.name) + ' · ' + UI.esc(it.desc) + '</option>';
            }).join('') +
          '</select></div>' +
        '<div class="field"><div class="label">规格型号</div>' +
          '<input class="input" id="m-spec" maxlength="120" value="' + UI.esc(existing ? (existing.spec || '') : '') + '" placeholder="材质 / 尺寸 / 包装规格"></div>' +
        '<div class="field"><div class="label">供应商<span class="req">*</span></div>' +
          '<select class="select" id="m-sup">' +
            sups.map(function (s) {
              return '<option value="' + UI.esc(s) + '"' + (hasSup && curSup === s ? ' selected' : '') + '>' + UI.esc(s) + '</option>';
            }).join('') +
            '<option value="__custom__"' + (!hasSup && curSup ? ' selected' : '') + '>＋ 自定义新供应商</option>' +
          '</select>' +
          '<input class="input mt8" id="m-sup-custom" maxlength="60" value="' + UI.esc(!hasSup ? curSup : '') + '" placeholder="输入新供应商全称" style="display:' + (!hasSup && curSup ? 'block' : 'none') + '">' +
        '</div>' +
        '<div class="field"><div class="label">备注说明</div>' +
          '<input class="input" id="m-note" maxlength="200" value="' + UI.esc(existing ? (existing.note || '') : '') + '" placeholder="适用场景、最小起订或安装说明"></div>' +
        '<label class="check"><input type="checkbox" id="m-enabled"' + (!existing || existing.enabled !== false ? ' checked' : '') + '><span>立即上架（允许对应权限角色下单）</span></label>';

      UI.sheet({
        title: isEdit ? ('编辑物资 · ' + existing.id) : '新增物资',
        sub: isEdit ? '修改后将立即同步至采购下单页，已下单历史单据保留原快照。' : '新增后符合权限的采购人员即可在目录中搜索并下单。',
        body: body,
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: isEdit ? '保存修改' : '确认新增', cls: 'primary', onClick: function (_close, bodyEl) {
              const supSel = bodyEl.querySelector('#m-sup').value;
              const supplier = supSel === '__custom__' ? bodyEl.querySelector('#m-sup-custom').value.trim() : supSel;
              try {
                App.mutate(function (st, ses) {
                  return domain.saveCatalogItem(st, ses, {
                    isEdit: isEdit,
                    id: bodyEl.querySelector('#m-id').value.trim(),
                    name: bodyEl.querySelector('#m-name').value.trim(),
                    category: bodyEl.querySelector('#m-cat').value,
                    purchaseScope: curScope,
                    budgetItem: bodyEl.querySelector('#m-budget').value,
                    unit: bodyEl.querySelector('#m-unit').value.trim(),
                    price: Number(bodyEl.querySelector('#m-price').value),
                    spec: bodyEl.querySelector('#m-spec').value.trim(),
                    supplier: supplier,
                    note: bodyEl.querySelector('#m-note').value.trim(),
                    enabled: bodyEl.querySelector('#m-enabled').checked
                  });
                });
                UI.toast(isEdit ? '物资信息已更新' : '已新增物资', 'good');
                render();
              } catch (err) {
                UI.toast(err.message, 'error', 2800);
                return false;
              }
            } }
        ],
        mount: function (bodyEl) {
          const scopeWrap = bodyEl.querySelector('#m-scope-cards');
          if (scopeWrap) {
            scopeWrap.addEventListener('click', function (ev) {
              const cardEl = ev.target.closest('[data-scope]');
              if (!cardEl) return;
              curScope = cardEl.dataset.scope;
              scopeWrap.querySelectorAll('[data-scope]').forEach(function (x) {
                x.classList.toggle('on', x.dataset.scope === curScope);
              });
            });
          }
          const catSel = bodyEl.querySelector('#m-cat');
          const supSel = bodyEl.querySelector('#m-sup');
          const customInp = bodyEl.querySelector('#m-sup-custom');
          if (!isEdit && catSel) {
            catSel.addEventListener('change', function () {
              const wantedSup = catSel.value === '印刷品物料' ? '广告印刷供应商（待确认）' : '运营物资供应商（演示）';
              if (sups.indexOf(wantedSup) >= 0) {
                supSel.value = wantedSup;
                customInp.style.display = 'none';
              }
            });
          }
          supSel.addEventListener('change', function () {
            customInp.style.display = supSel.value === '__custom__' ? 'block' : 'none';
            if (supSel.value === '__custom__') customInp.focus();
          });
        }
      });
    }

    function openExportModal() {
      const custom = state.catalogCustom || { added: [], updated: {}, deleted: {} };
      const activeList = domain.catalogOf(state, { activeOnly: true });
      const customText = JSON.stringify(custom, null, 2);
      const fullText = JSON.stringify(activeList, null, 2);

      UI.sheet({
        title: '导出物资目录',
        sub: '演示态改动保存在本机浏览器中；上线前可复制 JSON 导入后端数据库或同步到 miniprogram/data/catalog.js。',
        body:
          '<div class="kv"><span class="k">在售物资</span><span class="v num">' + activeList.length + ' 项</span></div>' +
          '<div class="kv"><span class="k">中台改动</span><span class="v num">新增 ' + (custom.added || []).length + ' · 修改 ' + Object.keys(custom.updated || {}).length + ' · 删除 ' + Object.keys(custom.deleted || {}).length + '</span></div>' +
          '<div class="label mt8">中台增量改动预览</div>' +
          '<pre class="json-box">' + UI.esc(customText) + '</pre>',
        actions: [
          { label: '关闭', cls: 'ghost' },
          { label: '复制改动', cls: 'soft', onClick: function () { UI.copy(customText); return false; } },
          { label: '复制全量', cls: 'primary', onClick: function () { UI.copy(fullText); return false; } }
        ]
      });
    }

    function renderContracts() {
      const list = domain.contractSummary(state);
      return '<div class="note-box mb12">职能部门采购不设部门预算，但所有有效订单累计金额不得超过对应供应商框架合同总额（已双方确认结算的单据按结算金额入账）。</div>' +
        '<div class="between mb12"><div class="section-title">供应商框架合同（' + list.length + ' 份）</div>' +
          '<button class="btn primary sm" id="con-add-contract">＋ 新增合同</button></div>' +
        list.map(function (c) {
          const tone = c.usedPct >= 90 ? 'bad' : c.usedPct >= 70 ? 'warn' : '';
          return '<div class="card card-pad" style="margin-bottom:10px">' +
            '<div class="between"><span class="strong">' + UI.esc(c.name) + '</span>' +
              '<span class="pill line mono">' + UI.esc(c.id) + '</span></div>' +
            '<div class="tiny muted mt4">供应商：' + UI.esc(c.supplier) +
              (c.start || c.end ? ' · 有效期 ' + UI.esc(c.start || '不限') + ' ~ ' + UI.esc(c.end || '不限') : '') + '</div>' +
            '<div class="bar mt8"><i class="' + tone + '" style="width:' + c.usedPct + '%"></i></div>' +
            '<div class="between mt8 tiny muted">' +
              '<span>已占用 ¥' + UI.money(c.used) + '（门店 ¥' + UI.money(c.storeUsed) + ' + 部门 ¥' + UI.money(c.deptUsed) + '）</span>' +
              '<span>' + c.usedPct + '%</span>' +
            '</div>' +
            '<div class="between mt8" style="padding-top:8px;border-top:1px dashed var(--line-2)">' +
              '<div class="tiny">合同总额 <b class="money">¥' + UI.money(c.total) + '</b> · 剩余 <b class="money ' + (c.remaining <= 0 ? 'red' : 'green') + '">¥' + UI.money(c.remaining) + '</b></div>' +
              '<button class="btn ghost xs" data-contract-edit="' + UI.esc(c.id) + '">调整合同</button>' +
            '</div>' +
          '</div>';
        }).join('');
    }

    function openContractModal(existing) {
      const sups = domain.suppliersOf(state);
      const curSup = existing ? existing.supplier : (sups[0] || '');
      const hasSup = sups.indexOf(curSup) >= 0;

      const body =
        '<div class="field"><div class="label">供应商<span class="req">*</span></div>' +
          '<select class="select" id="ct-sup"' + (existing ? ' disabled' : '') + '>' +
            sups.map(function (s) {
              return '<option value="' + UI.esc(s) + '"' + (hasSup && curSup === s ? ' selected' : '') + '>' + UI.esc(s) + '</option>';
            }).join('') +
            '<option value="__custom__"' + (!hasSup && curSup ? ' selected' : '') + '>＋ 自定义新供应商</option>' +
          '</select>' +
          '<input class="input mt8" id="ct-sup-custom" maxlength="60" value="' + UI.esc(!hasSup ? curSup : '') + '" placeholder="输入新供应商名称" style="display:' + (!hasSup && curSup ? 'block' : 'none') + '">' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><div class="label">合同编号</div>' +
            '<input class="input mono" id="ct-id" maxlength="30" value="' + UI.esc(existing ? existing.id : '') + '" placeholder="留空自动生成"></div>' +
          '<div class="field"><div class="label">合同总额（元）<span class="req">*</span></div>' +
            '<input class="input" id="ct-total" type="number" min="0.01" step="0.01" value="' + (existing ? existing.total : '') + '" placeholder="例如：300000"></div>' +
        '</div>' +
        '<div class="field"><div class="label">合同名称</div>' +
          '<input class="input" id="ct-name" maxlength="60" value="' + UI.esc(existing ? existing.name : '') + '" placeholder="例如：2026 年度框架采购合同"></div>' +
        '<div class="field-row">' +
          '<div class="field"><div class="label">生效日期</div>' +
            '<input class="input" id="ct-start" type="date" value="' + UI.esc(existing ? existing.start : '') + '"></div>' +
          '<div class="field"><div class="label">到期日期</div>' +
            '<input class="input" id="ct-end" type="date" value="' + UI.esc(existing ? existing.end : '') + '"></div>' +
        '</div>' +
        '<div class="field"><div class="label">备注</div>' +
          '<input class="input" id="ct-note" maxlength="120" value="' + UI.esc(existing ? existing.note : '') + '" placeholder="选填"></div>';

      UI.sheet({
        title: existing ? ('调整合同 · ' + existing.supplier) : '新增供应商合同',
        sub: '职能部门下单时将实时校验累计占用是否超过该合同总额。',
        body: body,
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: '保存合同', cls: 'primary', onClick: function (_close, bodyEl) {
              const supSel = bodyEl.querySelector('#ct-sup').value;
              const supplier = existing ? existing.supplier : (supSel === '__custom__' ? bodyEl.querySelector('#ct-sup-custom').value.trim() : supSel);
              try {
                App.mutate(function (st, ses) {
                  return domain.saveContract(st, ses, {
                    id: bodyEl.querySelector('#ct-id').value.trim(),
                    supplier: supplier,
                    name: bodyEl.querySelector('#ct-name').value.trim(),
                    total: Number(bodyEl.querySelector('#ct-total').value),
                    start: bodyEl.querySelector('#ct-start').value,
                    end: bodyEl.querySelector('#ct-end').value,
                    note: bodyEl.querySelector('#ct-note').value.trim()
                  });
                });
                UI.toast('合同上限已保存', 'good');
                render();
              } catch (err) {
                UI.toast(err.message, 'error', 2800);
                return false;
              }
            } }
        ],
        mount: function (bodyEl) {
          const supSel = bodyEl.querySelector('#ct-sup');
          const customInp = bodyEl.querySelector('#ct-sup-custom');
          supSel.addEventListener('change', function () {
            customInp.style.display = supSel.value === '__custom__' ? 'block' : 'none';
          });
        }
      });
    }

    function renderRules() {
      const ac = domain.approvalConfigOf(state);
      return '<div class="card card-pad">' +
          '<div class="section-title mb8">门店下单审批阈值</div>' +
          '<div class="small muted mb12">调整后对后续新提交的门店订单立即生效，审批去重（战区一步终审、中台核定一步完成）始终启用。</div>' +
          '<div class="field-row">' +
            '<div class="field"><div class="label">小额免金额审批上限（元）</div>' +
              '<input class="input" id="r-auto" type="number" min="0" step="1" value="' + ac.autoMax + '"></div>' +
            '<div class="field"><div class="label">战区一步终审上限（元）</div>' +
              '<input class="input" id="r-region" type="number" min="1" step="1" value="' + ac.regionMax + '"></div>' +
          '</div>' +
          '<div class="switch-row">' +
            '<div><div class="strong small">近 N 天同门店同科目累计防拆单</div>' +
              '<div class="tiny muted">防止门店连续拆成多笔小额单绕过上级审批</div></div>' +
            '<input type="checkbox" id="r-split-guard"' + (ac.splitGuard ? ' checked' : '') + ' style="width:18px;height:18px;accent-color:var(--brand-2)">' +
          '</div>' +
          '<div class="field mt8"><div class="label">防拆单累计统计窗口（天，1–31）</div>' +
            '<input class="input" id="r-split-days" type="number" min="1" max="31" step="1" value="' + ac.splitDays + '"></div>' +
          '<div class="switch-row">' +
            '<div><div class="strong small">小额预算内免战区审核直发供应商</div>' +
              '<div class="tiny muted">开启后，预算内且 ≤ 小额上限的订单提交即直发供应商（战区仅事后抽查，谨慎开启）</div></div>' +
            '<input type="checkbox" id="r-auto-skip"' + (ac.autoSkipReview ? ' checked' : '') + ' style="width:18px;height:18px;accent-color:var(--brand-2)">' +
          '</div>' +
          '<button class="btn primary block mt12" id="r-save">保存审批规则</button>' +
        '</div>' +

        '<div class="card card-pad mt12">' +
          '<div class="section-title mb8">中台常用运维</div>' +
          '<div class="btn-group">' +
            '<a class="btn ghost sm" href="#/budget">门店预算设置（房间数×系数）</a>' +
            '<a class="btn ghost sm" href="#/reports?tab=recon">统一对账与锁定</a>' +
          '</div>' +
        '</div>';
    }

    root.addEventListener('click', function (e) {
      const tabBtn = e.target.closest('#con-tabs [data-tab]');
      if (tabBtn) {
        tab = tabBtn.dataset.tab;
        shown = 30;
        render();
        return;
      }

      if (e.target.closest('#con-q-clear')) {
        keyword = '';
        const qEl = root.querySelector('#con-q');
        if (qEl) { qEl.value = ''; qEl.focus(); }
        renderCatalogListOnly();
        return;
      }

      const fBtn = e.target.closest('[data-cat-filter]');
      if (fBtn) {
        filter = fBtn.dataset.catFilter;
        shown = 30;
        render();
        return;
      }

      if (e.target.closest('#con-btn-more')) {
        shown += 30;
        renderCatalogListOnly();
        return;
      }

      if (e.target.closest('#con-add')) { openItemModal(null); return; }
      if (e.target.closest('#con-export')) { openExportModal(); return; }

      const editBtn = e.target.closest('[data-cat-edit]');
      if (editBtn) {
        const item = domain.catalogMapOf(state)[editBtn.dataset.catEdit];
        if (item) openItemModal(item);
        return;
      }

      const scopeBtn = e.target.closest('[data-cat-scope]');
      if (scopeBtn) {
        try {
          const res = App.mutate(function (st, ses) {
            return domain.setCatalogItemScope(st, ses, { id: scopeBtn.dataset.catScope });
          });
          UI.toast(res.name + (res.centralOnly ? ' 已设为仅中台采购' : ' 已开放全员下单'), 'good');
          render();
        } catch (err) { UI.toast(err.message, 'error', 2800); }
        return;
      }

      const toggleBtn = e.target.closest('[data-cat-toggle]');
      if (toggleBtn) {
        try {
          const res = App.mutate(function (st, ses) {
            return domain.toggleCatalogItem(st, ses, { id: toggleBtn.dataset.catToggle });
          });
          UI.toast(res.name + (res.enabled ? ' 已上架' : ' 已下架'), 'good');
          render();
        } catch (err) { UI.toast(err.message, 'error', 2800); }
        return;
      }

      const delBtn = e.target.closest('[data-cat-del]');
      if (delBtn) {
        const id = delBtn.dataset.catDel;
        const item = domain.catalogMapOf(state)[id];
        if (!item) return;
        UI.confirm({
          title: '删除物资「' + item.name + '」？',
          sub: '删除后目录中不再显示；若有在途订单引用该物资，系统将阻止删除并提示先下架。',
          okText: '确认删除',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          try {
            App.mutate(function (st, ses) { return domain.deleteCatalogItem(st, ses, id); });
            UI.toast('已删除，可在「已删除」筛选中恢复', 'good');
            render();
          } catch (err) { UI.toast(err.message, 'error', 3200); }
        });
        return;
      }

      const restoreBtn = e.target.closest('[data-cat-restore]');
      if (restoreBtn) {
        try {
          const res = App.mutate(function (st, ses) {
            return domain.restoreCatalogItem(st, ses, restoreBtn.dataset.catRestore);
          });
          UI.toast('已恢复「' + res.name + '」', 'good');
          render();
        } catch (err) { UI.toast(err.message, 'error', 2800); }
        return;
      }

      if (e.target.closest('#con-add-contract')) { openContractModal(null); return; }

      const ctBtn = e.target.closest('[data-contract-edit]');
      if (ctBtn) {
        const c = domain.contractSummary(state).filter(function (x) { return x.id === ctBtn.dataset.contractEdit; })[0];
        if (c) openContractModal(c);
        return;
      }

      if (e.target.closest('#r-save')) {
        try {
          App.mutate(function (st, ses) {
            return domain.saveApprovalConfig(st, ses, {
              autoMax: Number(root.querySelector('#r-auto').value),
              regionMax: Number(root.querySelector('#r-region').value),
              splitGuard: root.querySelector('#r-split-guard').checked,
              splitDays: Number(root.querySelector('#r-split-days').value),
              autoSkipReview: root.querySelector('#r-auto-skip').checked
            });
          });
          UI.toast('审批规则已保存并即时生效', 'good');
          render();
        } catch (err) { UI.toast(err.message, 'error', 2800); }
      }
    });

    render();
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/guide.js ==== */
/* 采购说明：流程口径、审批分级、预算规则、结算与对账（与小程序 pages/guide 同步） */
(function (Views) {
  const STEPS = [
    { n: 1, title: '门店 / 部门下单', desc: '选物资、填收货信息；超门店科目额度且在机动池上限内需写超预算说明，超出上限直接拦截；部门采购受供应商合同总额上限管控。' },
    { n: 2, title: '战区审核 / 一步终审', desc: '所有门店单先经战区审核（必要性、合规性）。预算内 500-2000 元由战区一步终审合并金额审批，免二次点击。' },
    { n: 3, title: '预算核定（仅超额度时）', desc: '超出门店科目额度时，由运营管理部一步完成机动预算追加（或门店间调剂）与金额审批，直接发往供应商。' },
    { n: 4, title: '金额审批（>2000元）', desc: '预算内 2000 元以上报运营管理部金额审批；支持近 N 天同门店同科目防拆单累计定档，审批时可微调数量或批量通过预算内订单。' },
    { n: 5, title: '供应商接单与发货', desc: '供应商确认接单、选择配送方式并登记运单号，支持分批次发货。' },
    { n: 6, title: '收货验收（含短收结案）', desc: '逐品填写合格数量并拍照留证；若部分破损且不再补货，可办理短收结案，释放未到货预算并转入结算。' },
    { n: 7, title: '结算金额共同确认', desc: '验收完成后门店填写实际结算金额，涉及的全部供应商各自确认后方生效；有退款或折让须写明原因，确认后按实结调整预算占用。' },
    { n: 8, title: '统一对账', desc: '仅已确认结算的订单进入统一对账；按供应商汇总生成对账单，供应商确认后由运营管理部锁定。' }
  ];
  const TIERS = [
    { range: '≤ 500 元', path: '战区审核 → 直接发送供应商', note: '免金额审批（可在中台操作台配置免审直发）' },
    { range: '500-2000 元', path: '战区一步终审 → 发送供应商', note: '合规与金额合并审批，不再二次点审' },
    { range: '> 2000 元', path: '战区审核 → 运营管理部金额审批', note: '超预算时在中台核定节点一步完成，不重复审批' },
    { range: '部门采购', path: '运营管理部统一确认（中台自采直发）', note: '不设部门预算，但受供应商合同总额上限控制' }
  ];
  const BUDGETS = [
    { name: '社群活动预算', scope: '运营物资合同 · 社群活动物资', sample: '社区活动、茶歇互动、氛围布置' },
    { name: '客诉预算', scope: '运营物资合同 · 客诉维护物资', sample: '客诉礼品、日常耗材、维修安全' },
    { name: '营销预算', scope: '印刷品物料合同 · 印刷品物料', sample: '海报、折页、展架、定制印刷' }
  ];
  const ROLES = [
    { name: '门店店长', duty: '下单、验收、短收结案、确认结算金额', limit: '仅本门店' },
    { name: '战区负责人', duty: '战区审核、500-2000元一步终审、战区看板', limit: '仅本战区' },
    { name: '运营管理部', duty: '中台操作台（物资增删改/合同/规则）、预算核定、大额审批、部门确认、统一对账', limit: '全公司' },
    { name: '职能部门', duty: '部门采购下单、验收、确认结算（受合同上限控制）', limit: '仅本部门' },
    { name: '供应商', duty: '接单、发货、确认结算与对账', limit: '仅本供应商订单' }
  ];
  const SLAS = [
    { name: '审批处理', hours: '24 小时', note: '战区审核 / 金额审批' },
    { name: '供应商接单', hours: '12 小时', note: '超时进入预警' },
    { name: '验收及时率', hours: '48 小时', note: '到货后尽快验收' }
  ];

  Views.guide = function (root) {
    root.innerHTML =
      '<div class="guide-hero">' +
        '<div class="gh-title">物资采购流程说明</div>' +
        '<div class="gh-sub">从下单到对账一共 8 步，门店单先审核、验收后双方确认结算金额。</div>' +
      '</div>' +

      '<div class="card card-pad">' +
        '<div class="section-title mb8">全流程</div>' +
        '<div class="small muted" style="margin:-4px 0 12px">按顺序推进，任一步驳回即结束</div>' +
        STEPS.map(function (s) {
          return '<div class="gstep"><span class="gn">' + s.n + '</span>' +
            '<span class="gcol"><span class="gt">' + UI.esc(s.title) + '</span>' +
            '<span class="gd">' + UI.esc(s.desc) + '</span></span></div>';
        }).join('') +
      '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">审批分级</div>' +
        '<div class="small muted" style="margin:-4px 0 12px">按单笔金额自动判定</div>' +
        TIERS.map(function (t) {
          return '<div class="grow-row"><span class="gr">' + UI.esc(t.range) + '</span>' +
            '<span class="gcol"><span class="gt">' + UI.esc(t.path) + '</span>' +
            '<span class="gd">' + UI.esc(t.note) + '</span></span></div>';
        }).join('') +
      '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">费用预算</div>' +
        '<div class="small muted" style="margin:-4px 0 12px">额度 = 管理房间数 × 科目系数</div>' +
        '<div class="gformula"><b>每店额度 = 房间数 × 系数</b>' +
          '<span>示例：1000 间房 × 10 元/间 = 每个科目 ¥10,000</span></div>' +
        BUDGETS.map(function (b) {
          return '<div class="grow-row"><span class="gcol"><span class="gt">' + UI.esc(b.name) + '</span>' +
            '<span class="gd">' + UI.esc(b.scope) + '</span></span>' +
            '<span class="gs">' + UI.esc(b.sample) + '</span></div>';
        }).join('') +
        '<div class="note-box mt12">订单按商品大类自动归科目，一张单跨科目时分别占用各自额度；额度不足需运营管理部核定后才能继续。</div>' +
      '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">结算与对账</div>' +
        '<div class="small muted" style="margin:-4px 0 10px">金额以双方共同确认为准</div>' +
        '<p class="gp">验收完成后进入结算环节：<b>门店填写实际结算金额</b>，' +
          '<b>供应商在自己的账号确认</b>。因产品问题、少发或退款导致结算金额与申请金额不一致时，必须填写差异原因。</p>' +
        '<p class="gp">供应商提出异议的，退回门店重新核对并再次提交；双方确认一致后，该笔订单才进入统一对账。</p>' +
        '<p class="gp">对账按供应商汇总已确认的结算金额生成对账单，供应商确认后由运营管理部锁定，订单转为已完成。</p>' +
      '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">角色权限</div>' +
        '<div class="small muted" style="margin:-4px 0 12px">按最小必要授权</div>' +
        ROLES.map(function (r) {
          return '<div class="grow-row"><span class="gcol"><span class="gt">' + UI.esc(r.name) + '</span>' +
            '<span class="gd">' + UI.esc(r.duty) + '</span></span>' +
            '<span class="gs">' + UI.esc(r.limit) + '</span></div>';
        }).join('') +
      '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">时效要求</div>' +
        '<div class="small muted" style="margin:-4px 0 12px">超时会进入预警</div>' +
        SLAS.map(function (s) {
          return '<div class="grow-row"><span class="gcol"><span class="gt">' + UI.esc(s.name) + '</span>' +
            '<span class="gd">' + UI.esc(s.note) + '</span></span>' +
            '<span class="gs"><b>' + UI.esc(s.hours) + '</b></span></div>';
        }).join('') +
      '</div>' +

      '<div class="foot-note">演示版口径，实际执行以公司采购制度为准。</div>';
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/settle.js ==== */
/* 结算金额共同确认（与小程序 pages/settle 同步）
 * 门店/部门填实际结算金额，供应商确认或提出异议；确认后按结算金额进入统一对账。 */
(function (Views) {
  const SETTLE_TEXT = {
    'pending-store': '待门店提交',
    'pending-supplier': '待供应商确认',
    'confirmed': '双方已确认',
    'disputed': '供应商已提异议'
  };

  Views.settle = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const id = r.params[0];

    function load() {
      const state = Store.loadState();
      const order = domain.visibleOrders(state, me).filter(function (o) { return o.id === id; })[0];
      return { state: state, order: order };
    }

    function render() {
      const got = load();
      const state = got.state;
      const order = got.order;

      if (!order) {
        root.innerHTML = UI.empty('🧾', '订单不存在或无权查看', '结算由收货门店与供应商共同确认');
        return;
      }

      const bySupAccepted = domain.acceptedBySupplierOf(order);
      const supKeys = Object.keys(bySupAccepted);
      const isMultiSup = supKeys.length > 1;

      const itemsAmount = domain.acceptedAmountOf(order);
      const isStoreSide = !!domain.settleActorOf(order, me);
      const isSupplierSide = me.role === 'supplier' && (order.items || []).some(function (x) {
        return x.supplier === me.supplier;
      });
      const confirmedMap = (order.settlement && order.settlement.confirmedBySuppliers) || {};
      const myConfirmed = isSupplierSide && !!confirmedMap[me.supplier];
      const editable = isStoreSide && ['settle-pending', 'settle-disputed'].indexOf(order.status) >= 0;

      const raw = order.settlement || {};
      const initialAmount = editable
        ? (raw.status === 'disputed' || raw.status === 'pending-supplier'
          ? Number(raw.amount || itemsAmount) : itemsAmount)
        : Number(raw.amount || itemsAmount);

      const lines = (order.items || []).map(function (x) {
        const n = Number(x.accepted || 0);
        return {
          name: x.name, spec: x.spec || '', unit: x.unit || '', supplier: x.supplier || '',
          qty: n, orderQty: Number(x.qty || 0),
          priceText: BIZ.fmt.money(x.price),
          amountText: BIZ.fmt.money(Math.round(n * Number(x.price || 0) * 100) / 100),
          partial: n < Number(x.qty || 0)
        };
      });

      const settle = order.settlement ? {
        status: order.settlement.status,
        statusText: SETTLE_TEXT[order.settlement.status] || '待门店提交',
        amountText: BIZ.fmt.money(order.settlement.amount),
        itemsAmountText: BIZ.fmt.money(order.settlement.itemsAmount),
        diff: Number(order.settlement.diff || 0),
        reason: order.settlement.reason || '',
        byName: order.settlement.byName || '',
        submittedAt: order.settlement.submittedAt ? BIZ.fmt.fullTime(order.settlement.submittedAt) : '',
        confirmedAt: order.settlement.confirmedAt ? BIZ.fmt.fullTime(order.settlement.confirmedAt) : '',
        round: order.settlement.round || 1,
        suppliers: Array.isArray(order.settlement.suppliers) ? order.settlement.suppliers : [],
        confirmedMap: confirmedMap,
        disputes: (order.settlement.disputes || []).map(function (d) {
          return { by: d.supplier || d.by, reason: d.reason, at: BIZ.fmt.fullTime(d.at) };
        })
      } : null;

      const owner = order.purchaseType === 'department'
        ? ('部门采购 · ' + (order.department || '') + ' → ' + (order.store || ''))
        : (order.store || '');
      const finishedAt = (order.acceptances && order.acceptances.length)
        ? BIZ.fmt.fullTime(order.acceptances[order.acceptances.length - 1].at) : '';

      const evPhotos = Store.listEvidence(order.id).filter(function (ev) { return ev && ev.filePath; });
      const evStripHtml = evPhotos.length
        ? '<div class="divider"></div>' +
          '<div class="tiny muted mb4">现场验收照片（点击放大查看）</div>' +
          '<div class="ev-row">' + evPhotos.map(function (ev) {
            const label = '第 ' + (ev.batchNo || 1) + ' 批' + (ev.result === 'issue' ? '异常' : '验收') + '照片';
            return '<button class="ev-thumb-btn" type="button" data-preview-src="' + UI.esc(ev.filePath) + '" data-preview-title="' + UI.esc(label) + '">' +
              '<img class="ev-thumb" src="' + UI.esc(ev.filePath) + '" alt="验收照片">' +
              '<span class="ev-cap">' + UI.esc(label) + '</span>' +
            '</button>';
          }).join('') + '</div>'
        : '';

      root.innerHTML =
        '<div class="detail-hero">' +
          '<div class="st">' + UI.icon('bill', 'sm') + UI.statusPill(order.status) + '</div>' +
          '<div class="id">' + UI.esc(order.id) +
            '<button class="icon-btn plain" id="copy-id" style="color:#fff;width:26px;height:26px;vertical-align:2px" title="复制单号">' + UI.icon('copy', 'xs') + '</button></div>' +
          '<div class="amt">¥' + UI.money(order.total) + '<small>申请金额</small></div>' +
          '<div class="meta"><span>' + UI.esc(owner) + '</span>' +
            (order.purpose ? '<span>' + UI.esc(order.purpose) + '</span>' : '') +
            (finishedAt ? '<span>完成验收 ' + UI.esc(finishedAt) + '</span>' : '') + '</div>' +
        '</div>' +

        '<div class="note-box mt12">验收完成后需共同确认最终结算金额：门店按实际到货与折让填写，供应商在自己的账号确认。双方一致后该金额进入统一对账。</div>' +

        '<div class="card card-pad mt12">' +
          '<div class="section-title mb8">验收明细</div>' +
          '<div class="tiny muted" style="margin:-4px 0 10px">按实收数量核算</div>' +
          lines.map(function (l) {
            return '<div class="item-line"><span class="nm">' + UI.esc(l.name) +
              '<small>' + UI.esc(l.spec || '规格以合同为准') + ' · ' + UI.esc(l.supplier) + '</small></span>' +
              '<span class="qty">' + l.qty + ' / ' + l.orderQty + ' ' + UI.esc(l.unit) + '</span>' +
              '<span class="amt">¥' + UI.money(l.amountText) + '</span></div>' +
              '<div class="tiny muted" style="margin:-6px 0 8px">单价 ¥' + UI.money(l.priceText) + ' / ' + UI.esc(l.unit) + '</div>';
          }).join('') +
          '<div class="divider"></div>' +
          '<div class="between"><span class="small">实收核算金额</span>' +
            '<span class="money" style="font-size:17px">¥' + UI.money(itemsAmount) + '</span></div>' +
          evStripHtml +
        '</div>' +

        (isStoreSide && editable
          ? '<div class="card card-pad mt12">' +
              '<div class="section-title mb8">填写结算金额</div>' +
              '<div class="small muted" style="margin:-4px 0 12px">' + (isMultiSup ? '本单涉及多家供应商/合同，可分别填写各自实际结算金额' : '与实收核算不一致时需说明原因') + '</div>' +
              (isMultiSup
                ? supKeys.map(function (sup) {
                    const prevVal = (raw.bySupplier && isFinite(Number(raw.bySupplier[sup]))) ? Number(raw.bySupplier[sup]) : bySupAccepted[sup];
                    return '<div class="field"><div class="label">' + UI.esc(sup) + '（实收 ¥' + UI.money(bySupAccepted[sup]) + '）<span class="req">*</span></div>' +
                      '<div class="inline-input"><span class="c">¥</span>' +
                      '<input class="sup-amt-input" data-sup-amt="' + UI.esc(sup) + '" type="number" min="0.01" step="0.01" value="' + prevVal + '"></div></div>';
                  }).join('') +
                  '<div class="kv"><span class="k">合计结算</span><span class="v money" id="st-multi-total">¥' + UI.money(initialAmount) + '</span></div>' +
                  '<input id="st-amount" type="hidden" value="' + initialAmount + '">'
                : '<div class="inline-input big"><span class="c">¥</span>' +
                  '<input id="st-amount" type="number" min="0" step="0.01" value="' + initialAmount + '" placeholder="0.00"></div>') +
              '<div class="diff-line ok" id="st-diff">与实收核算一致</div>' +
              '<div class="field mt8" id="st-reason-wrap" style="display:none">' +
                '<div class="label">差异原因<span class="req">*</span></div>' +
                '<input class="input" id="st-reason" maxlength="200" placeholder="如：到货破损 2 件退款、少发 1 箱折让（至少 4 个字）">' +
              '</div>' +
              '<button class="btn primary block mt12" id="st-submit">提交结算金额</button>' +
              '<div class="tiny muted mt8" id="st-hint" style="display:none">请填写至少 4 个字的差异原因后再提交</div>' +
            '</div>'
          : '') +

        (isSupplierSide && order.status === 'settle-supplier'
          ? '<div class="card card-pad mt12">' +
              '<div class="section-title mb8">门店提交的结算金额</div>' +
              '<div class="tiny muted" style="margin:-4px 0 10px">' + UI.esc(settle ? settle.statusText : '') + '</div>' +
              '<div class="between" style="padding:10px 0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)">' +
                '<span class="small">结算金额</span><span class="money" style="font-size:19px">¥' + UI.money(settle ? settle.amountText : itemsAmount) + '</span></div>' +
              (settle && settle.reason ? '<div class="kv"><span class="k">差异原因</span><span class="v">' + UI.esc(settle.reason) + '</span></div>' : '') +
              '<div class="kv"><span class="k">门店</span><span class="v">' + UI.esc(settle ? settle.byName : '') + '</span></div>' +
              '<div class="kv"><span class="k">提交时间</span><span class="v">' + UI.esc(settle ? settle.submittedAt : '') + '</span></div>' +
              (myConfirmed
                ? '<div class="note-box mt12">您已确认本单结算金额，等待其他供应商确认。</div>'
                : '<div class="btn-group mt12">' +
                    '<button class="btn ghost" id="st-dispute-toggle">提出异议</button>' +
                    '<button class="btn primary" id="st-confirm">确认金额</button>' +
                  '</div>' +
                  '<div class="field mt12" id="st-dispute-wrap" style="display:none">' +
                    '<div class="label">异议说明<span class="req">*</span></div>' +
                    '<input class="input" id="st-dispute-reason" maxlength="200" placeholder="如：折让金额过低，应为 115 元（至少 4 个字）">' +
                    '<button class="btn ghost block mt8" id="st-dispute">提交异议，退回门店</button>' +
                  '</div>') +
            '</div>'
          : '') +

        (settle
          ? '<div class="card card-pad mt12">' +
              '<div class="section-title mb8">结算记录</div>' +
              '<div class="tiny muted" style="margin:-4px 0 10px">第 ' + settle.round + ' 次提交 · ' + UI.esc(settle.statusText) + '</div>' +
              '<div class="kv"><span class="k">结算金额</span><span class="v money">¥' + UI.money(settle.amountText) + '</span></div>' +
              '<div class="kv"><span class="k">实收核算</span><span class="v num">¥' + UI.money(settle.itemsAmountText) + '</span></div>' +
              (Math.abs(settle.diff) > 0.004
                ? '<div class="kv"><span class="k">差异</span><span class="v">' + (settle.diff < 0 ? '少结' : '多结') + ' ¥' + UI.money(Math.abs(settle.diff)) + '</span></div>' : '') +
              (settle.reason ? '<div class="kv"><span class="k">差异原因</span><span class="v">' + UI.esc(settle.reason) + '</span></div>' : '') +
              '<div class="kv"><span class="k">门店提交</span><span class="v">' + UI.esc(settle.byName) + (settle.submittedAt ? ' · ' + UI.esc(settle.submittedAt) : '') + '</span></div>' +
              (settle.confirmedAt ? '<div class="kv"><span class="k">供应商确认</span><span class="v">' + UI.esc(settle.confirmedAt) + '</span></div>' : '') +
              (settle.suppliers.length > 1
                ? '<div class="mt8" style="padding-top:8px;border-top:1px dashed var(--line-2)">' +
                    '<div class="tiny muted mb4">多供应商确认进度</div>' +
                    settle.suppliers.map(function (sup) {
                      const ok = !!settle.confirmedMap[sup];
                      return '<div class="kv"><span class="k">' + UI.esc(sup) + '</span>' +
                        '<span class="v"><span class="pill ' + (ok ? 'good' : 'warn') + '">' + (ok ? '已确认' : '待确认') + '</span></span></div>';
                    }).join('') +
                  '</div>'
                : '') +
              settle.disputes.map(function (d) {
                return '<div class="rec-block" style="border-color:#f6d9d4;background:#fffaf9">' +
                  '<div class="between"><span class="strong" style="color:var(--bad)">供应商异议 · ' + UI.esc(d.by || '') + '</span>' +
                  '<span class="tiny muted">' + UI.esc(d.at) + '</span></div>' +
                  '<div class="tiny mt4">' + UI.esc(d.reason || '') + '</div></div>';
              }).join('') +
            '</div>'
          : '') +

        (!isStoreSide && !isSupplierSide
          ? '<div class="card card-pad mt12"><div class="small muted" style="text-align:center;padding:8px 0">' +
              '当前身份不能处理这笔结算<br><span class="tiny">结算由收货门店与供应商共同确认</span></div></div>'
          : '') +

        '<div class="card card-pad mt12"><a class="tbl-link" href="#/order/' + UI.esc(order.id) + '">查看订单详情 ›</a></div>' +
        '<div class="action-spacer"></div>';

      const copy = root.querySelector('#copy-id');
      if (copy) copy.onclick = function () { UI.copy(order.id); };

      // ---- 门店：金额输入与差异校验 ----
      const amountInput = root.querySelector('#st-amount');
      const reasonWrap = root.querySelector('#st-reason-wrap');
      const reasonInput = root.querySelector('#st-reason');
      const diffLine = root.querySelector('#st-diff');
      const hint = root.querySelector('#st-hint');

      function readSupMap() {
        const supInputs = root.querySelectorAll('[data-sup-amt]');
        if (!supInputs.length) return null;
        const map = {};
        let sum = 0;
        supInputs.forEach(function (inp) {
          const val = Number(inp.value);
          map[inp.dataset.supAmt] = val;
          if (isFinite(val)) sum += Math.round(val * 100);
        });
        const total = Math.round(sum) / 100;
        if (amountInput) amountInput.value = total;
        const totalLabel = root.querySelector('#st-multi-total');
        if (totalLabel) totalLabel.textContent = '¥' + UI.money(total);
        return map;
      }

      function checkDiff() {
        const supMap = readSupMap();
        if (!amountInput) return;
        const amount = Number(amountInput.value);
        const diff = isFinite(amount) ? Math.round((amount - itemsAmount) * 100) / 100 : 0;
        const hasDiff = Math.abs(diff) > 0.004;
        diffLine.className = 'diff-line ' + (hasDiff ? (diff < 0 ? 'bad' : 'warn') : 'ok');
        diffLine.textContent = hasDiff
          ? '与实收核算相差 ' + (diff < 0 ? '少结' : '多结') + ' ¥' + UI.money(Math.abs(diff))
          : '与实收核算一致';
        if (reasonWrap) reasonWrap.style.display = hasDiff ? '' : 'none';
        if (hint) hint.style.display = hasDiff && (reasonInput.value.trim().length < 4) ? '' : 'none';
        return { amount: amount, bySupplier: supMap, diff: diff, hasDiff: hasDiff };
      }

      if (amountInput) {
        amountInput.addEventListener('input', checkDiff);
        root.querySelectorAll('[data-sup-amt]').forEach(function (inp) {
          inp.addEventListener('input', checkDiff);
        });
        if (reasonInput) reasonInput.addEventListener('input', checkDiff);
        checkDiff();
      }

      const submit = root.querySelector('#st-submit');
      if (submit) submit.onclick = function () {
        const d = checkDiff();
        if (!d.amount || d.amount <= 0) { UI.toast('请填写结算金额', 'error'); return; }
        if (d.hasDiff && reasonInput.value.trim().length < 4) {
          UI.toast('请填写至少 4 个字的差异原因', 'error'); return;
        }
        UI.confirm({
          title: '提交结算金额',
          sub: '结算金额 ¥' + UI.money(d.amount) +
            (d.hasDiff ? '，与实收核算差 ¥' + UI.money(Math.abs(d.diff)) + '。提交后由供应商确认。' : '。提交后由供应商确认。'),
          okText: '确认提交'
        }).then(function (ok) {
          if (!ok) return;
          try {
            App.mutate(function (st, ses) {
              const payload = { orderId: order.id, amount: d.amount, reason: reasonInput ? reasonInput.value.trim() : '' };
              if (d.bySupplier) payload.bySupplier = d.bySupplier;
              return domain.submitSettlement(st, ses, payload);
            });
            UI.toast('已提交，待供应商确认', 'good');
            render();
          } catch (e) { UI.toast(e.message, 'error', 2800); }
        });
      };

      // ---- 供应商：确认 / 异议 ----
      const confirmBtn = root.querySelector('#st-confirm');
      if (confirmBtn) confirmBtn.onclick = function () {
        UI.confirm({
          title: '确认结算金额',
          sub: '确认后该笔订单进入统一对账，金额不再修改。',
          okText: '确认金额'
        }).then(function (ok) {
          if (!ok) return;
          doAction('confirm', '');
        });
      };

      const disputeToggle = root.querySelector('#st-dispute-toggle');
      const disputeWrap = root.querySelector('#st-dispute-wrap');
      if (disputeToggle) disputeToggle.onclick = function () {
        disputeWrap.style.display = disputeWrap.style.display === 'none' ? '' : 'none';
      };

      const disputeBtn = root.querySelector('#st-dispute');
      if (disputeBtn) disputeBtn.onclick = function () {
        const reason = root.querySelector('#st-dispute-reason').value.trim();
        if (reason.length < 4) { UI.toast('请填写至少 4 个字的异议说明', 'error'); return; }
        doAction('dispute', reason);
      };

      function doAction(action, reason) {
        try {
          const res = App.mutate(function (st, ses) {
            return domain.settleAction(st, ses, { orderId: order.id, action: action, reason: reason });
          });
          UI.toast(
            action === 'confirm'
              ? (res && res.allConfirmed === false ? '您已确认，等待其他供应商确认' : '已确认，进入待对账')
              : '已提出异议，退回门店',
            'good'
          );
          render();
        } catch (e) { UI.toast(e.message, 'error', 2800); }
      }
    }

    root.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-preview-src]');
      if (!btn) return;
      UI.sheet({
        title: btn.dataset.previewTitle || '验收照片',
        body: '<img src="' + UI.esc(btn.dataset.previewSrc) + '" style="width:100%;border-radius:12px;display:block">',
        actions: [{ label: '关闭', cls: 'ghost' }]
      });
    });

    render();
  };
})(window.Views);

</script>
<script>
/* ==== js/app.js ==== */
/* 应用外壳：路由、导航、状态读写与页面生命周期 */
(function (global) {
  const domain = BIZ.domain;
  const perm = BIZ.perm;
  const Views = (global.Views = global.Views || {});

  const NAV = {
    home: { label: '首页', icon: 'home', hash: '/home' },
    catalog: { label: '采购下单', icon: 'cart', hash: '/catalog' },
    orders: { label: '我的订单', icon: 'orders', hash: '/orders' },
    approve: { label: '待办审批', icon: 'check', hash: '/approvals' },
    supplier: { label: '供应商工作台', icon: 'truck', hash: '/supplier' },
    accept: { label: '收货验收', icon: 'camera', hash: '/accept' },
    reports: { label: '统计看板', icon: 'chart', hash: '/reports' },
    recon: { label: '统一对账', icon: 'bill', hash: '/reports?tab=recon' },
    drafts: { label: '草稿箱', icon: 'box', hash: '/drafts' },
    budget: { label: '预算设置', icon: 'bill', hash: '/budget' },
    console: { label: '中台操作台', icon: 'shop', hash: '/console' },
    guide: { label: '采购说明', icon: 'box', hash: '/guide' },
    settle: { label: '结算确认', icon: 'bill', hash: '/settle' },
    me: { label: '我的', icon: 'user', hash: '/profile' }
  };

  const TAB_OF = {
    home: 'home', catalog: 'catalog', checkout: 'catalog',
    orders: 'orders', order: 'orders', settle: 'orders',
    approvals: 'approve', supplier: 'supplier',
    accept: 'accept', drafts: 'drafts',
    reports: 'reports', profile: 'me', guide: 'me', login: '', budget: 'budget', console: 'console'
  };

  const state = { me: null, route: null };

  function titleOf(r) {
    if (r.name === 'order') return '订单详情';
    if (r.name === 'checkout') return '确认订单';
    if (r.name === 'accept') return r.params[0] ? '批次验收' : '收货验收';
    if (r.name === 'reports' && r.query.tab === 'recon') return '统一对账';
    if (r.name === 'budget') return '门店费用预算';
    if (r.name === 'console') return '中台操作台';
    if (r.name === 'guide') return '采购流程说明';
    if (r.name === 'settle') return '结算金额确认';
    const key = TAB_OF[r.name];
    return NAV[key] ? NAV[key].label : APP_CONFIG.short;
  }

  function route() {
    const raw = (location.hash || '').replace(/^#/, '') || '/home';
    const parts = raw.split('?');
    const seg = parts[0].split('/').filter(Boolean);
    const query = {};
    new URLSearchParams(parts[1] || '').forEach(function (v, k) { query[k] = v; });
    return { name: seg[0] || 'home', params: seg.slice(1), query: query, hash: raw };
  }

  function go(hash, replace) {
    const target = '#' + (hash.charAt(0) === '/' ? hash : '/' + hash);
    if (location.hash === target) { render(); return; }
    if (replace) location.replace(target);
    else location.hash = target;
  }

  /* ---------------- 导航 ---------------- */
  function badgeCounts(me, st) {
    const counts = {};
    if (!me) return counts;
    // actionCount 已包含「战区审核 / 金额审批 / 结算共同确认」待办，与首页待办同源
    if (me.role === 'central' || me.role === 'region') {
      counts.approve = domain.actionCount(st, me);
    }
    if (me.role === 'supplier') {
      counts.supplier = domain.actionCount(st, me);
    }
    if (me.role === 'store' || me.role === 'department') {
      counts.accept = domain.actionCount(st, me);
    }
    return counts;
  }

  function renderChrome() {
    const me = Session.current();
    const st = Store.loadState();
    const counts = badgeCounts(me, st);

    const tabKeys = perm.tabs(me).map(function (t) { return t.key; });
    const extra = [];
    if (me.role === 'store' || me.role === 'department') {
      if (tabKeys.indexOf('accept') < 0) extra.push('accept');
    }
    if (me.role === 'central') { extra.push('console'); extra.push('recon'); extra.push('budget'); }
    const sideKeys = tabKeys.concat(extra);

    document.getElementById('side-nav').innerHTML = sideKeys.map(function (key) {
      const n = NAV[key];
      if (!n) return '';
      const b = counts[key] || 0;
      return '<a href="#' + n.hash + '" data-nav="' + key + '">' +
        UI.icon(n.icon) + '<span>' + n.label + '</span>' +
        (b ? '<span class="n">' + (b > 99 ? '99+' : b) + '</span>' : '') + '</a>';
    }).join('');

    document.getElementById('tabbar').innerHTML = tabKeys.map(function (key) {
      const n = NAV[key];
      if (!n) return '';
      const b = counts[key] || 0;
      return '<a href="#' + n.hash + '" data-nav="' + key + '">' + UI.icon(n.icon) +
        '<span>' + n.label + '</span>' +
        (b ? '<span class="dot' + (b > 1 ? ' num' : '') + '">' + (b > 9 ? '9+' : b) + '</span>' : '') + '</a>';
    }).join('');

    const sideUser = document.getElementById('side-user');
    if (me) {
      sideUser.innerHTML = '<span class="av">' + UI.esc(Session.avatarOf(me)) + '</span>' +
        '<span class="col grow"><span class="nm ellipsis">' + UI.esc(me.name) + '</span>' +
        '<span class="rl ellipsis">' + UI.esc(perm.roleMeta(me.role).label) + '</span></span>';
    } else {
      sideUser.innerHTML = '<span class="av">?</span><span class="col"><span class="nm">未登录</span></span>';
    }

    renderTopIdentityPill(me);
  }

  function idPillLabel(me) {
    if (!me) return '未登录';
    if (me.role === 'store') {
      const stName = (me.stores && me.stores[0]) ? me.stores[0] : '';
      return stName ? (stName + ' · ' + me.name.replace('测试', '')) : me.name;
    }
    if (me.role === 'region') return (me.zone || '战区') + ' · 负责人';
    if (me.role === 'central') return '运营管理部 · 中台';
    if (me.role === 'department') return me.department || me.name;
    if (me.role === 'supplier') return String(me.supplier || '').replace(/[（(].*[)）]/g, '');
    return me.name;
  }

  function openQuickIdentitySheet() {
    if (Session.isExternal()) { go('/profile'); return; }
    const groups = Session.grouped();
    const cur = Session.current();
    const body = '<div class="tiny muted mb8">切换当前测试账号，立即在当前页面以对应权限视角查看（正式企业微信环境按通讯录免登）。</div>' +
      groups.map(function (g) {
        if (!g.items.length) return '';
        return '<div class="login-group" style="margin-top:10px">' +
          '<h3>' + UI.esc(g.title) + '<span>' + UI.esc(g.note) + '</span></h3>' +
          g.items.map(function (p) {
            const on = cur && cur.id === p.id;
            return '<button class="id-card" type="button" data-quick-id="' + UI.esc(p.id) + '" style="' + (on ? 'border-color:var(--brand-2);background:#f3f8fe' : '') + '">' +
              '<span class="av">' + UI.esc(Session.avatarOf(p)) + '</span>' +
              '<span class="col grow"><span class="nm">' + UI.esc(p.name) + (on ? ' <span class="pill good">当前</span>' : '') + '</span>' +
              '<span class="ds">' + UI.esc(p.desc || p.zone || '') + '</span></span>' +
              UI.icon('right') + '</button>';
          }).join('') +
        '</div>';
      }).join('');
    UI.sheet({
      title: '切换体验身份',
      sub: '门店店长 · 战区负责人 · 运营管理部 · 职能部门 · 供应商',
      body: body,
      mount: function (bodyEl, close) {
        bodyEl.addEventListener('click', function (e) {
          const btn = e.target.closest('[data-quick-id]');
          if (!btn) return;
          try {
            const p = Session.switchTo(btn.dataset.quickId);
            close();
            UI.toast('已切换为 ' + p.name, 'good', 1400);
            render();
          } catch (err) { UI.toast(err.message, 'error'); }
        });
      }
    });
  }

  function renderTopIdentityPill(me) {
    const host = document.getElementById('topbar-act');
    if (!host) return;
    const old = host.querySelector('#top-id-pill');
    if (old) old.remove();
    if (!me) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'top-id-pill';
    btn.className = 'id-pill role-' + (me.role || 'store');
    btn.title = Session.isExternal() ? '查看当前账号详情' : '点击快速切换测试角色';
    btn.innerHTML = '<span class="dot"></span><span class="txt">' + UI.esc(idPillLabel(me)) + '</span>' +
      (!Session.isExternal() ? UI.icon('switch', 'xs') : '');
    btn.onclick = function () {
      if (Session.isExternal()) go('/profile');
      else openQuickIdentitySheet();
    };
    host.appendChild(btn);
  }

  function markNav(name) {
    const active = TAB_OF[name] || '';
    document.querySelectorAll('[data-nav]').forEach(function (el) {
      el.classList.toggle('on', el.dataset.nav === active);
    });
  }

  /* ---------------- 路由渲染 ---------------- */
  let lastHash = '';

  function render(opts) {
    opts = opts || {};
    const r = route();
    const me = Session.current();

    if (!me || r.name === 'login') {
      document.body.dataset.page = r.name === 'login' ? 'login' : 'guest';
      const view = document.getElementById('view');
      view.className = 'view';
      view.innerHTML = '';
      document.getElementById('topbar-title').textContent = '登录';
      document.getElementById('btn-back').classList.remove('on');
      document.getElementById('topbar-act').innerHTML = '';
      if (Views.login) Views.login(view, r, {});
      markNav('login');
      return;
    }

    const view = Views[r.name];
    if (!view) { go('/home', true); return; }

    state.me = me;
    state.route = r;
    document.body.dataset.page = r.name;

    // 每次渲染换一个全新的 #view 节点：避免页面在 root 上绑定的委托事件随着往返累积
    const old = document.getElementById('view');
    const container = old.cloneNode(false);
    container.className = 'view' + (r.name === 'catalog' ? ' wide flush' : '');
    old.parentNode.replaceChild(container, old);
    document.getElementById('topbar-title').textContent = titleOf(r);
    document.getElementById('topbar-act').innerHTML = '';

    const isTabRoot = ['home', 'catalog', 'orders', 'approvals', 'supplier', 'accept', 'reports', 'profile', 'drafts'].indexOf(r.name) >= 0;
    const back = document.getElementById('btn-back');
    back.classList.toggle('on', !isTabRoot);
    back.onclick = function () {
      if (history.length > 1) history.back();
      else go('/home');
    };

    try {
      view(container, r, { me: me, state: Store.loadState(), go: go, app: api });
    } catch (err) {
      console.error(err);
      container.innerHTML = '<div class="card card-pad"><div class="strong">页面渲染失败</div><div class="small muted mt8">' + UI.esc(err.message) + '</div></div>';
    }

    markNav(r.name);
    renderChrome();

    if (!opts.keepScroll && r.hash !== lastHash) window.scrollTo(0, 0);
    lastHash = r.hash;
  }

  /* ---------------- 业务动作 ---------------- */
  function mutate(fn) {
    const st = Store.loadState();
    const me = Session.current();
    const result = fn(st, me);
    Store.saveState(st);
    if (result) {
      if (result.audit) Store.appendAudit([result.audit]);
      if (result.audits) Store.appendAudit(result.audits);
    }
    renderChrome();
    return result;
  }

  function title(text) {
    document.getElementById('topbar-title').textContent = text;
  }

  function topAction(html, onMount) {
    const host = document.getElementById('topbar-act');
    host.innerHTML = html;
    if (onMount) onMount(host);
  }

  const api = {
    go: go,
    render: function (opts) { render(opts); },
    reload: function () { render({ keepScroll: true }); },
    mutate: mutate,
    title: title,
    topAction: topAction,
    me: function () { return Session.current(); },
    state: function () { return Store.loadState(); },
    route: function () { return state.route || route(); }
  };

  global.App = api;
  global.Views = Views;
  global.NAV = NAV;

  /* ---------------- 启动 ---------------- */
  function boot() {
    const logoEl = document.getElementById('side-logo-img');
    if (logoEl && global.UI) logoEl.src = UI.logoSrc();
    Session.bootstrap().then(function () {
      // 演示便利：?as=TEST-CENTRAL 可直接以指定身份进入（正式环境不会用到）
      const as = new URLSearchParams(location.search).get('as');
      if (as && !Session.isExternal()) {
        try { Session.switchTo(as); } catch (e) { /* ignore */ }
      }
      const hasIdentity = !!localStorage.getItem(Store.KEYS.identity);
      if (!location.hash) {
        location.hash = hasIdentity || Session.isExternal() ? '#/home' : '#/login';
      }
      renderChrome();
      render();
      window.addEventListener('hashchange', function () { render(); });
      window.addEventListener('error', function (e) {
        if (e && e.message) console.error('[h5]', e.message);
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);

</script>
</body>
