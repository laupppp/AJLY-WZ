  Views.orders = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;
    const orders = domain.visibleOrders(state, me);

    let filter = r.query.tab && GROUPS.some(function (g) { return g.key === r.query.tab; }) ? r.query.tab : 'all';
    let keyword = '';

    const slaRows = domain.slaEntries(state);
    const slaByOrder = {};
    slaRows.forEach(function (x) {
      if (me.role === 'supplier' && x.owner !== me.supplier) return;
      const cur = slaByOrder[x.orderId];
      if (!cur || (cur.level !== 'overdue' && x.level === 'overdue')) slaByOrder[x.orderId] = x;
    });

    function matches(o, g) {
      if (!GROUPS.filter(function (x) { return x.key === g; })[0].test(o.status)) return false;
      if (!keyword) return true;
      const kw = keyword.toLowerCase();
      const hay = [o.id, o.store, o.manager, o.department, o.supplier, (o.items || []).map(function (x) { return x.name; }).join(' ')]
        .join(' ').toLowerCase();
      return hay.indexOf(kw) >= 0;
    }

    function counts() {
      const map = {};
      GROUPS.forEach(function (g) {
        map[g.key] = orders.filter(function (o) { return matches(o, g.key); }).length;
      });
      return map;
    }

    function card(o) {
      // 结算/待对账阶段以订单状态为准：供应商分项此时已 accepted，
      // 若仍显示「已完成」会误导供应商不去确认结算金额；这些阶段也不该报审批/接单超时
      const inSettle = me.role === 'supplier' &&
        ['settle-pending', 'settle-supplier', 'settle-disputed', 'accepted'].indexOf(o.status) >= 0;
      const sla = inSettle ? null : slaByOrder[o.id];
      const myRec = inSettle ? null : (me.role === 'supplier' ? (o.supplierRecords || {})[me.supplier] : null);
      const itemNames = (o.items || []).slice(0, 3).map(function (x) { return x.name + '×' + x.qty; }).join('、');
      const more = (o.items || []).length > 3 ? ' 等 ' + o.items.length + ' 项' : '';
      const cls = myRec
        ? (({ pending: 'warn', confirmed: 'info', shipping: 'teal', accepted: 'good', issue: 'bad' })[myRec.status] || 'gray')
        : BIZ.fmt.statusCls(o.status);
      const statusHtml = myRec
        ? UI.supplierPill(myRec.status)
        : UI.statusPill(o.status);
      return '<a class="order-card accent-' + UI.esc(cls) + '" href="#/order/' + UI.esc(o.id) + '">' +
        '<div class="order-top"><span class="order-id">' + UI.esc(o.id) + '</span>' + statusHtml +
          (sla ? '<span class="sla ' + (sla.level === 'overdue' ? 'bad' : 'warn') + '" style="margin-left:auto">' + UI.icon('clock', 'xs') + BIZ.fmt.hoursText(sla.hours) + (sla.level === 'overdue' ? '超时' : '') + '</span>' : '') +
        '</div>' +
        '<div class="order-meta">' + UI.esc(o.purchaseType === 'department' ? ('部门采购 · ' + (o.department || '')) : o.store) +
          ' · ' + UI.esc(BIZ.fmt.shortTime(o.createdAt || o.created)) + '</div>' +
        '<div class="order-items">' + UI.esc(itemNames + more) + '</div>' +
        '<div class="order-foot">' +
          '<span class="pill line">' + UI.esc(BIZ.fmt.TIER_LABEL[o.tier] || '') + '</span>' +
          '<span class="tiny muted">' + (o.items || []).length + ' 种商品</span>' +
          '<span class="order-amt" style="margin-left:auto">¥' + UI.money(o.total) + '<small>' + (o.store || '') + '</small></span>' +
        '</div>' +
      '</a>';
    }

    function renderList() {
      const list = orders.filter(function (o) { return matches(o, filter); })
        .sort(function (a, b) { return String(b.createdAt || '').localeCompare(String(a.createdAt || '')); });
      const c = counts();

      root.querySelector('#chips').innerHTML = GROUPS.map(function (g) {
        return '<button class="chip' + (filter === g.key ? ' on' : '') + '" data-f="' + g.key + '">' +
          g.label + (c[g.key] ? '<span class="n">' + c[g.key] + '</span>' : '') + '</button>';
      }).join('');

      const host = root.querySelector('#order-list');
      if (!list.length) {
        host.innerHTML = UI.empty('📋', keyword ? '没有匹配的订单' : '该分类暂无订单', keyword ? '换个关键词试试' : '');
      } else {
        host.innerHTML = list.map(card).join('');
      }
      root.querySelector('#list-count').textContent = '共 ' + list.length + ' 笔';
    }

    root.innerHTML =
      '<div class="between" style="margin-bottom:8px">' +
        '<div class="search" style="margin:0;flex:1;max-width:420px">' +
          UI.icon('search') +
          '<input id="q" type="search" placeholder="搜索订单号 / 门店 / 商品" autocomplete="off">' +
        '</div>' +
        '<span class="tiny muted nowrap" id="list-count"></span>' +
      '</div>' +
      '<div class="chips" id="chips"></div>' +
      '<div id="order-list"></div>';

    root.querySelector('#chips').addEventListener('click', function (e) {
      const chip = e.target.closest('[data-f]');
      if (!chip) return;
      filter = chip.dataset.f;
      renderList();
      window.scrollTo({ top: 0 });
    });

    root.querySelector('#q').addEventListener('input', UI.debounce(function (e) {
      keyword = e.target.value.trim();
      renderList();
    }, 160));

    renderList();
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/order-detail.js ==== */
/* 订单详情：进度、商品、供应商履约、验收记录、审批留痕与可执行动作 */
(function (Views) {
  const SHIP = BIZ.domain.SHIPPING_METHODS;

  function findOrder(state, me, id) {
    return BIZ.domain.visibleOrders(state, me).filter(function (o) { return o.id === id; })[0];
  }

  function supplierStatus(status) {
    return UI.supplierStatusText(status);
  }

  Views.order = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;
    const id = r.params[0];
    const order = findOrder(state, me, id);

    if (!order) {
      root.innerHTML = UI.empty('🔒', '订单不存在或无权查看', '请确认订单号，或切换为对应门店/部门身份');
      return;
    }

    const pendingApprovals = domain.pendingApprovals(state, me).some(function (o) { return o.id === order.id; });
    const canAccept = domain.canAcceptOrder(order, me) &&
      ['delivering', 'delivered', 'partial'].indexOf(order.status) >= 0 &&
      (order.items || []).some(function (x) { return Number(x.deliveredQty || 0) > Number(x.accepted || 0); });
    // 门店单先经战区审核，该阶段也应允许提交人撤销（与小程序一致）
    const canCancel = (me.role === 'store' || me.role === 'department') &&
      order.submittedBy === me.id &&
      ['order-review', 'budget-region', 'budget-central', 'amount-approval', 'supplier', 'dept-approval'].indexOf(order.status) >= 0;
    const canClose = me.role === 'central' && ['supplier', 'preparing'].indexOf(order.status) >= 0;
    const canSupply = me.role === 'supplier' && !!(order.supplierRecords || {})[me.supplier];
    const canReorder = BIZ.perm.can(me, 'order.create');
    const mySub = me.role === 'supplier' && (order.items || []).some(function (x) { return x.supplier === me.supplier; });
    // 结算共同确认入口：门店填金额、供应商确认/异议
    const canSettle = !!domain.settleActorOf(order, me) &&
      ['settle-pending', 'settle-disputed'].indexOf(order.status) >= 0;
    const canShortClose = ((me && me.role === 'central') || !!domain.settleActorOf(order, me)) &&
      order.status === 'partial' &&
      (order.items || []).some(function (x) { return Number(x.accepted || 0) > 0; });
    const canSettleConfirm = me.role === 'supplier' && order.status === 'settle-supplier' && mySub &&
      !(order.settlement && order.settlement.confirmedBySuppliers && order.settlement.confirmedBySuppliers[me.supplier]);
    const settleText = order.status === 'settle-pending' ? '待门店确认结算金额'
      : order.status === 'settle-supplier' ? '待供应商确认结算金额'
        : order.status === 'settle-disputed' ? '供应商提出异议，待门店重提'
          : order.status === 'accepted' ? '结算金额已双方确认，待统一对账' : '';
    const S = order.settlement || null;
    const settleStatusText = S ? ({
      'pending-store': '待门店提交', 'pending-supplier': '待供应商确认',
      confirmed: '双方已确认', disputed: '供应商已提异议'
    }[S.status] || '待门店提交') : '';

    const steps = UI.stepsOf(order);
    const sla = domain.slaForOrder(state, order.id);
    const audits = Store.listAudit(order.id).slice().sort(function (a, b) {
      return String(a.at || '').localeCompare(String(b.at || ''));
    });

    const records = Object.keys(order.supplierRecords || {}).map(function (name) {
      return { name: name, rec: order.supplierRecords[name] };
    });

    const acceptances = (order.acceptances || []).slice().reverse();
    const issues = (order.acceptanceIssues || []).slice().reverse();
    const evList = Store.listEvidence(order.id);
    const evMap = {};
    evList.forEach(function (ev) {
      if (ev && ev.id && ev.filePath) evMap[ev.id] = ev.filePath;
    });
    function photoOf(a) {
      if (!a) return '';
      if (a.evidenceId && evMap[a.evidenceId]) return evMap[a.evidenceId];
      if (a.photoPath && String(a.photoPath).indexOf('data:image/') === 0) return a.photoPath;
      return '';
    }
    function photoBlockHtml(a, title) {
      const src = photoOf(a);
      if (src) {
        return '<div class="ev-row mt8">' +
          '<button class="ev-thumb-btn" type="button" data-preview-src="' + UI.esc(src) + '" data-preview-title="' + UI.esc(title) + '">' +
            '<img class="ev-thumb" src="' + UI.esc(src) + '" alt="验收照片">' +
            '<span class="ev-cap">点击放大查看现场留证</span>' +
          '</button>' +
        '</div>';
      }
      if (a.noPhoto) return '<div class="tiny" style="color:var(--warn);margin-top:4px">演示环境无照片留证</div>';
      if (a.evidenceId) return '<div class="tiny muted mt4">已登记留证编号：' + UI.esc(a.evidenceId) + '（本机图片缓存已清理）</div>';
      return '';
    }

    function itemTags(x) {
      let html = '';
      if (Number(x.accepted || 0) > 0) html += '<span class="item-tag">已验收 ' + x.accepted + '</span>';
      if (Number(x.reconciled || 0) > 0) html += '<span class="item-tag">已对账 ' + x.reconciled + '</span>';
      if (Number(x.deliveredQty || 0) > 0 && Number(x.deliveredQty) < x.qty) html += '<span class="item-tag">已发 ' + x.deliveredQty + '</span>';
      return html;
    }

    const heroMeta = [
      order.purchaseType === 'department' ? ('部门 · ' + (order.department || '')) : order.store,
      '提交人 ' + (order.manager || ''),
      BIZ.fmt.fullTime(order.createdAt) || order.created,
      '档位 ' + (BIZ.fmt.TIER_LABEL[order.tier] || '')
    ];

    root.innerHTML =
      '<div class="detail-hero">' +
        '<div class="st">' + UI.icon('box', 'sm') + UI.statusPill(order.status) +
          (sla ? '<span style="color:rgba(255,255,255,.8);font-size:11px">' + BIZ.fmt.hoursText(sla.hours) + (sla.level === 'overdue' ? ' 已超时' : ' 未处理') + '</span>' : '') +
        '</div>' +
        '<div class="id">' + UI.esc(order.id) +
          '<button class="icon-btn plain" id="copy-id" style="color:#fff;width:26px;height:26px;vertical-align:2px" title="复制单号">' + UI.icon('copy', 'xs') + '</button>' +
        '</div>' +
        '<div class="amt">¥' + UI.money(order.total) + '<small>含 ' + (order.items || []).length + ' 种商品</small></div>' +
        '<div class="meta">' + heroMeta.map(function (t) { return '<span>' + UI.esc(t) + '</span>'; }).join('') + '</div>' +
        '<div class="steps">' + steps.map(function (s) {
          return '<div class="step' + (s.done ? ' done' : '') + (s.active ? ' active' : '') + '"><i></i><span>' + s.label + '</span></div>';
        }).join('') + '</div>' +
      '</div>' +

      (order.status === 'cancelled' && order.closeReason
        ? '<div class="alert mt12">' + UI.icon('alert', 'sm') + '<span>' + UI.esc(order.closeReason) + '</span></div>'
        : '') +
      (order.status === 'rejected' && order.rejectReason
        ? '<div class="alert mt12">' + UI.icon('alert', 'sm') + '<span>驳回原因：' + UI.esc(order.rejectReason) + '</span></div>'
        : '') +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">单据信息</div>' +
        '<div class="kv"><span class="k">收货地点</span><span class="v">' + UI.esc(order.store || '') + '</span></div>' +
        '<div class="kv"><span class="k">收货人</span><span class="v">' + UI.esc(order.receiver || '') + '</span></div>' +
        '<div class="kv"><span class="k">地址</span><span class="v">' + UI.esc(order.address || '') + '</span></div>' +
        '<div class="kv"><span class="k">用途</span><span class="v">' + UI.esc(order.purpose || '') + '</span></div>' +
        '<div class="kv"><span class="k">期望到货</span><span class="v">' + UI.esc(order.due || '待供应商确认') + '</span></div>' +
        (order.note ? '<div class="kv"><span class="k">备注</span><span class="v">' + UI.esc(order.note) + '</span></div>' : '') +
        (order.overReason ? '<div class="kv"><span class="k">超预算说明</span><span class="v">' + UI.esc(order.overReason) + '</span></div>' : '') +
        (order.shortClosed ? '<div class="kv"><span class="k">短收结案</span><span class="v">' + UI.esc(order.shortClosed.reason) + '</span></div>' : '') +
        (order.budgetApplied && order.budgetTransfer
          ? '<div class="kv"><span class="k">追加预算</span><span class="v">¥' + UI.money(order.budgetTransfer) + '（从机动池核定）</span></div>'
          : '') +
        (order.groupId
          ? '<div class="kv"><span class="k">采购批次</span><span class="v mono">' + UI.esc(order.groupId) + '</span></div>'
          : '') +
      '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="between mb8"><span class="section-title">商品明细</span>' +
          '<span class="tiny muted">' + (order.items || []).length + ' 种</span></div>' +
        (order.items || []).map(function (x) {
          const bk = UI.budgetKeyOf(x);
          return '<div class="item-line"><span class="nm">' + UI.esc(x.name) +
            ' <span class="item-tag tone-' + bk + '">' + UI.esc(BIZ.budget.SHORT[bk] || '') + '</span>' +
            itemTags(x) +
            '<small>' + UI.esc(x.spec || '') + ' · ' + UI.esc(x.supplier || '') + '</small></span>' +
            '<span class="qty">×' + x.qty + '</span>' +
            '<span class="amt">¥' + UI.money(Number(x.price || 0) * Number(x.qty || 0)) + '</span></div>';
        }).join('') +
        '<div class="divider"></div>' +
        '<div class="between"><span class="small muted">合计</span><span class="money" style="font-size:17px">¥' + UI.money(order.total) + '</span></div>' +
      '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">供应商履约</div>' +
        records.map(function (x) {
          const rec = x.rec;
          const deliveries = rec.deliveries || [];
          return '<div class="rec-block">' +
            '<div class="rec-head">' + UI.icon('truck', 'sm') + '<span class="rec-name">' + UI.esc(x.name) + '</span>' +
              UI.supplierPill(rec.status) + '</div>' +
            (rec.issue ? '<div class="tiny" style="color:var(--bad);margin-top:6px">拒单原因：' + UI.esc(rec.issue) + '</div>' : '') +
            (deliveries.length
              ? deliveries.map(function (d) {
                  const sp = d.shipping || {};
                  return '<div class="rec-del">' +
                    '<div class="between"><span class="strong">第 ' + d.batchNo + ' 批</span>' +
                      '<span class="tiny muted">' + UI.esc(BIZ.fmt.fullTime(d.at)) + '</span></div>' +
                    '<div class="tiny muted mt4">' + UI.esc(SHIP[sp.method] || sp.method || '') +
                      (sp.carrier ? ' · ' + UI.esc(sp.carrier) : '') +
                      (sp.trackingNo ? ' · 单号 ' + UI.esc(sp.trackingNo) : '') + '</div>' +
                    '<div class="tiny muted">' + (sp.contact ? '联系人 ' + UI.esc(sp.contact) + ' · ' : '') +
                      (sp.estimatedAt ? '预计 ' + UI.esc(UI.dateTimeText(sp.estimatedAt)) : '') + '</div>' +
                    '<div class="tiny" style="margin-top:4px">' + d.lines.map(function (l) {
                      return UI.esc(l.name) + ' ×' + l.qty;
                    }).join('、') + '</div>' +
                  '</div>';
                }).join('')
              : '<div class="tiny muted" style="margin-top:6px">' + (rec.status === 'pending' ? '等待供应商接单' : rec.status === 'issue' ? '供应商反馈无法接单' : '尚未登记配送') + '</div>') +
          '</div>';
        }).join('') +
      '</div>' +

      (acceptances.length || issues.length
        ? '<div class="card card-pad mt12">' +
            '<div class="section-title mb8">验收记录</div>' +
            acceptances.map(function (a) {
              return '<div class="rec-block"><div class="between"><span class="strong">第 ' + a.batchNo + ' 批 · 验收合格</span>' +
                '<span class="tiny muted">' + UI.esc(BIZ.fmt.fullTime(a.at)) + '</span></div>' +
                '<div class="tiny muted mt4">' + UI.esc(a.byName || a.by || '') + (a.note ? ' · ' + UI.esc(a.note) : '') + '</div>' +
                '<div class="tiny mt4">' + (a.lines || []).map(function (l) { return UI.esc(l.name) + ' ×' + l.qty; }).join('、') + '</div>' +
                photoBlockHtml(a, '第 ' + a.batchNo + ' 批验收照片') +
              '</div>';
            }).join('') +
            issues.map(function (a) {
              const resolved = a.status === 'resolved' || !!a.resolvedAt;
              const canResolve = !resolved && (
                me.role === 'central' ||
                (me.role === 'supplier' && (!a.supplier || a.supplier === me.supplier)) ||
                canAccept
              );
              return '<div class="rec-block" style="' + (resolved ? 'border-color:#d4ede2;background:#f7fcf9' : 'border-color:#f6d9d4;background:#fffaf9') + '">' +
                '<div class="between"><span class="strong" style="color:' + (resolved ? 'var(--good)' : 'var(--bad)') + '">第 ' + a.batchNo + ' 批 · 异常反馈</span>' +
                '<span class="pill ' + (resolved ? 'good' : 'warn') + '">' + (resolved ? ('已处理 · ' + UI.esc(a.planLabel || '已解决')) : '待响应') + '</span></div>' +
                '<div class="tiny muted mt4">' + UI.esc(BIZ.fmt.fullTime(a.at)) + '</div>' +
                '<div class="tiny mt4">' + UI.esc(a.note || '') + '</div>' +
                (resolved && a.reply
                  ? '<div class="note-box mt8" style="background:#fff"><b>处理方案：</b>' + UI.esc(a.reply) +
                    '<div class="tiny muted mt4">' + UI.esc(a.resolvedBy || '') + ' · ' + UI.esc(BIZ.fmt.fullTime(a.resolvedAt)) + '</div></div>'
                  : '') +
                photoBlockHtml(a, '第 ' + a.batchNo + ' 批异常留证') +
                (canResolve
                  ? '<div class="mt8"><button class="btn soft xs" data-resolve-issue="' + UI.esc(a.id || '') + '" data-issue-sup="' + UI.esc(a.supplier || '') + '">登记处理方案</button></div>'
                  : '') +
              '</div>';
            }).join('') +
          '</div>'
        : '') +

      // 结算金额共同确认：验收完成后由门店填报、供应商确认，双方一致才进入对账
      ((S || settleText)
        ? '<div class="card card-pad mt12">' +
            '<div class="between mb8"><span class="section-title">结算金额</span>' +
              '<span class="pill ' + (S && S.status === 'confirmed' ? 'good' : 'warn') + '">' + UI.esc(S ? settleStatusText : settleText) + '</span></div>' +
            (S
              ? '<div class="kv"><span class="k">结算金额</span><span class="v money">¥' + UI.money(S.amount) + '</span></div>' +
                '<div class="kv"><span class="k">实收核算</span><span class="v num">¥' + UI.money(S.itemsAmount) + '</span></div>' +
                (Math.abs(Number(S.diff || 0)) > 0.004
                  ? '<div class="kv"><span class="k">差异</span><span class="v">' + (Number(S.diff) < 0 ? '少结' : '多结') + ' ¥' + UI.money(Math.abs(Number(S.diff))) + '</span></div>' : '') +
                (S.reason ? '<div class="kv"><span class="k">差异原因</span><span class="v">' + UI.esc(S.reason) + '</span></div>' : '') +
                '<div class="kv"><span class="k">提交人</span><span class="v">' + UI.esc(S.byName || '') +
                  (S.submittedAt ? ' · ' + UI.esc(BIZ.fmt.fullTime(S.submittedAt)) : '') + '</span></div>' +
                (S.confirmedAt ? '<div class="kv"><span class="k">供应商确认</span><span class="v">' + UI.esc(BIZ.fmt.fullTime(S.confirmedAt)) + '</span></div>' : '') +
                (S.disputes || []).map(function (d) {
                  return '<div class="rec-block" style="border-color:#f6d9d4;background:#fffaf9">' +
                    '<div class="between"><span class="strong" style="color:var(--bad)">供应商异议 · ' + UI.esc(d.supplier || d.by || '') + '</span>' +
                    '<span class="tiny muted">' + UI.esc(BIZ.fmt.fullTime(d.at)) + '</span></div>' +
                    '<div class="tiny mt4">' + UI.esc(d.reason || '') + '</div></div>';
                }).join('')
              : '<div class="tiny muted">验收完成后由门店填写实际结算金额，供应商在自己的账号确认，双方一致后进入统一对账。</div>') +
          '</div>'
        : '') +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb12">流转记录</div>' +
        (audits.length
          ? '<div class="timeline">' + audits.map(function (a) {
              const bad = /驳回|撤销|关闭|无法接单|异常/.test(a.decision || '');
              return '<div class="tl-item' + (bad ? ' bad' : ' on') + '">' +
                '<div class="tl-t">' + UI.esc(a.decision || '') + '</div>' +
                '<div class="tl-d">' + UI.esc(a.role || '') + (a.note ? ' · ' + UI.esc(a.note) : '') + '</div>' +
                '<div class="tl-time">' + UI.esc(BIZ.fmt.fullTime(a.at)) + '</div></div>';
            }).join('') + '</div>'
          : '<div class="timeline">' +
              '<div class="tl-item on"><div class="tl-t">提交订单</div>' +
                '<div class="tl-d">' + UI.esc(order.manager || '') + ' · ' + UI.esc(order.purpose || '') + '</div>' +
                '<div class="tl-time">' + UI.esc(BIZ.fmt.fullTime(order.createdAt)) + '</div></div>' +
              (order.supplierSentAt
                ? '<div class="tl-item on"><div class="tl-t">已发送供应商</div>' +
                    '<div class="tl-time">' + UI.esc(BIZ.fmt.fullTime(order.supplierSentAt)) + '</div></div>'
                : '') +
            '</div>') +
      '</div>' +

      '<div class="actionbar">' +
        (canReorder ? '<button class="btn ghost" id="btn-reorder">再次下单</button>' : '') +
        (canCancel ? '<button class="btn danger" id="btn-cancel">撤销</button>' : '') +
        (canClose ? '<button class="btn danger" id="btn-close">关闭订单</button>' : '') +
        (canShortClose ? '<button class="btn soft" id="btn-short-close">短收结案</button>' : '') +
        (pendingApprovals ? '<button class="btn primary" id="btn-approve">去审批</button>' : '') +
        (canAccept ? '<button class="btn primary" id="btn-accept">去验收</button>' : '') +
        (canSettle || canSettleConfirm ? '<button class="btn primary" id="btn-settle">' + (canSettleConfirm ? '确认结算金额' : '填写结算金额') + '</button>' : '') +
        (canSupply && ['supplier', 'preparing'].indexOf(order.status) >= 0 ? '<button class="btn primary" id="btn-supply">去处理</button>' : '') +
        (!canReorder && !canCancel && !canClose && !canShortClose && !pendingApprovals && !canAccept && !canSupply && !canSettle && !canSettleConfirm
          ? '<button class="btn ghost" style="flex:1" onclick="history.back()">返回</button>'
          : '') +
      '</div>' +
      '<div class="action-spacer"></div>';

    const copyBtn = root.querySelector('#copy-id');
    if (copyBtn) copyBtn.onclick = function () { UI.copy(order.id); };

    const reorder = root.querySelector('#btn-reorder');
    if (reorder) reorder.onclick = function () {
      const catMap = domain.catalogMapOf(state);
      const cart = Store.loadCart(me.id);
      cart.lines = cart.lines || {};
      let added = 0;
      let skipped = 0;
      (order.items || []).forEach(function (x) {
        const p = catMap[x.id] || BIZ.domain.CATALOG_BY_ID[x.id];
        if (!p || p.deleted || p.enabled === false || !domain.canActorBuyItem(p, me)) { skipped++; return; }
        cart.lines[x.id] = Math.min(9999, (cart.lines[x.id] || 0) + Number(x.qty || 0));
        added++;
      });
      if (!added) {
        UI.toast('原订单商品已全部下架或删除，无法再次下单', 'error');
        return;
      }
      if (order.purchaseType !== 'department') cart.store = order.store;
      Store.saveCart(me.id, cart);
      UI.toast(skipped ? ('已加入 ' + added + ' 项（已跳过 ' + skipped + ' 项下架商品）') : '已加入清单，可调整数量后提交', 'good');
      App.go('/catalog');
    };

    const shortClose = root.querySelector('#btn-short-close');
    if (shortClose) shortClose.onclick = function () {
      UI.sheet({
        title: '办理短收结案',
        sub: '适用于部分商品破损/缺货且供应商不再补发：将订单数量调整为已验收实收数量，释放未到货预算并进入结算确认。',
        body: '<div class="field"><div class="label">短收结案原因<span class="req">*</span></div>' +
          '<textarea class="textarea" id="sc-reason" maxlength="200" placeholder="请填写至少 4 个字的原因，如：剩余1件破损不再补货，按实收结算"></textarea></div>',
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: '确认短收结案', cls: 'primary', onClick: function (_done, bodyEl) {
              const reason = bodyEl.querySelector('#sc-reason').value.trim();
              try {
                App.mutate(function (st, ses) {
                  return BIZ.domain.finalizeShortDelivery(st, ses, { orderId: order.id, reason: reason });
                });
                UI.toast('已完成短收结案，请确认结算金额', 'good');
                App.reload();
              } catch (e) { UI.toast(e.message, 'error', 2600); return false; }
            } }
        ]
      });
    };

    const cancel = root.querySelector('#btn-cancel');
    if (cancel) cancel.onclick = function () {
      UI.confirm({
        title: '撤销这笔订单？',
        sub: '撤销后占用金额会释放，若已追加预算会退回机动池。',
        okText: '确认撤销',
        danger: true
      }).then(function (ok) {
        if (!ok) return;
        try {
          App.mutate(function (st, ses) { return BIZ.domain.cancelOrder(st, ses, order.id); });
          UI.toast('已撤销', 'good');
          App.reload();
        } catch (e) { UI.toast(e.message, 'error', 2600); }
      });
    };

    const close = root.querySelector('#btn-close');
    if (close) close.onclick = function () {
      const s = UI.sheet({
        title: '关闭停滞订单',
        sub: '适用于供应商长期未接单、或接单后一直未发货。关闭后释放预算占用并留痕。',
        body: '<div class="field"><div class="label">关闭原因</div>' +
          '<textarea class="textarea" id="close-reason" maxlength="120" placeholder="例如：供应商无法供货，已电话确认"></textarea></div>',
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: '确认关闭', cls: 'danger-solid', onClick: function (done, body) {
              const reason = body.querySelector('#close-reason').value.trim();
              try {
                App.mutate(function (st, ses) {
                  return BIZ.domain.closeOrder(st, ses, { orderId: order.id, reason: reason });
                });
                UI.toast('订单已关闭', 'good');
                App.reload();
              } catch (e) { UI.toast(e.message, 'error', 2600); return false; }
            } }
        ]
      });
    };

    const approve = root.querySelector('#btn-approve');
    if (approve) approve.onclick = function () { App.go('/approvals'); };

    const accept = root.querySelector('#btn-accept');
    if (accept) accept.onclick = function () { App.go('/accept/' + order.id); };

    const supply = root.querySelector('#btn-supply');
    if (supply) supply.onclick = function () { App.go('/supplier'); };

    const settle = root.querySelector('#btn-settle');
    if (settle) settle.onclick = function () { App.go('/settle/' + order.id); };

    root.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-preview-src]');
      if (btn) {
        UI.sheet({
          title: btn.dataset.previewTitle || '验收照片',
          body: '<img src="' + UI.esc(btn.dataset.previewSrc) + '" style="width:100%;border-radius:12px;display:block">',
          actions: [{ label: '关闭', cls: 'ghost' }]
        });
        return;
      }

      const ri = e.target.closest('[data-resolve-issue]');
      if (ri) {
        let plan = 'reship';
        UI.sheet({
          title: '处理验收异常 · ' + order.id,
          sub: '填写处理方案后将关闭该条异常待办提醒并记录流转审计',
          body:
            '<div class="field"><div class="label">处理方案<span class="req">*</span></div>' +
              '<div class="radio-cards" id="od-ri-plans">' +
                '<label class="radio-card on" data-p="reship"><span class="rd"></span><span class="grow"><span>安排补发 / 换货</span><span class="d">补充交付缺失或破损物资</span></span></label>' +
                '<label class="radio-card" data-p="discount"><span class="rd"></span><span class="grow"><span>转结算折让</span><span class="d">不再补发，按实际协商价在结算页减免</span></span></label>' +
                '<label class="radio-card" data-p="resolved"><span class="rd"></span><span class="grow"><span>协商结案</span><span class="d">双方已确认处理完毕</span></span></label>' +
              '</div></div>' +
            '<div class="field"><div class="label">处理说明<span class="req">*</span></div>' +
              '<textarea class="textarea" id="od-ri-reply" maxlength="300" placeholder="请填写处理结果或预计补发时间"></textarea></div>',
          mount: function (bodyEl) {
            bodyEl.querySelector('#od-ri-plans').addEventListener('click', function (ev) {
              const cardEl = ev.target.closest('[data-p]');
              if (!cardEl) return;
              plan = cardEl.dataset.p;
              bodyEl.querySelectorAll('[data-p]').forEach(function (x) { x.classList.toggle('on', x.dataset.p === plan); });
            });
          },
          actions: [
            { label: '取消', cls: 'ghost' },
            { label: '确认提交', cls: 'primary', onClick: function (_close, bodyEl) {
                const reply = bodyEl.querySelector('#od-ri-reply').value.trim();
                try {
                  App.mutate(function (st, ses) {
                    return domain.resolveAcceptanceIssue(st, ses, {
                      orderId: order.id, issueId: ri.dataset.resolveIssue || '', supplier: ri.dataset.issueSup || '', plan: plan, reply: reply
                    });
                  });
                  UI.toast('已登记异常处理方案', 'good');
                  App.reload();
                } catch (err) { UI.toast(err.message, 'error', 2600); return false; }
              } }
          ]
        });
      }
    });
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/approvals.js ==== */
/* 待办审批：预算核定缺口处理、金额审批、部门批次统一确认 */
(function (Views) {
  function gapText(order, state) {
    if (order.status !== 'budget-central') return '';
    const g = BIZ.domain.budgetGap(state, order);
    if (g.needed <= 0) return '';
    if (g.ok) {
      return '<div class="ap-budget">需从机动池追加 <b>¥' + UI.money(g.needed) + '</b>，机动池余额 ¥' + UI.money(g.flex) + '，足够核定</div>';
    }
    return '<div class="ap-budget bad">需追加 <b>¥' + UI.money(g.needed) + '</b> · 机动池仅 ¥' + UI.money(g.flex) +
      ' · 还差 <b>¥' + UI.money(g.short) + '</b>（单笔可核定上限 ¥' + UI.money(g.maxSupport) + '）</div>';
  }

  Views.approvals = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;

    if (!BIZ.perm.can(me, 'approve')) {
      root.innerHTML = UI.empty('🔐', '当前身份无审批权限', '审批由战区负责人与运营管理部处理');
      return;
    }

    const list = domain.pendingApprovals(state, me);
    const single = list.filter(function (o) { return o.status !== 'dept-approval'; });
    const deptGroups = {};
    list.filter(function (o) { return o.status === 'dept-approval'; }).forEach(function (o) {
      const key = o.groupId || o.id;
      if (!deptGroups[key]) deptGroups[key] = [];
      deptGroups[key].push(o);
    });

    const gapByOrder = {};
    single.forEach(function (o) {
      if (o.status === 'budget-central' || o.overPending) gapByOrder[o.id] = domain.budgetGap(state, o);
    });

    const batchEligible = single.filter(function (o) { return !o.overPending; });
    const ac = domain.approvalConfigOf(state);
    const expanded = {};

    function orderItemsDetailHtml(o) {
      return '<div class="ap-detail" style="display:' + (expanded[o.id] ? 'block' : 'none') + '">' +
        '<div class="tiny muted mb4">全部商品明细（共 ' + (o.items || []).length + ' 项）</div>' +
        (o.items || []).map(function (x) {
          const lineAmt = Math.round(Number(x.price || 0) * Number(x.qty || 0) * 100) / 100;
          return '<div class="item-line"><span class="nm">' + UI.esc(x.name) +
            '<small>' + UI.esc(x.spec || '规格以合同为准') + ' · ' + UI.esc(x.supplier || '') + '</small></span>' +
            '<span class="qty">¥' + UI.money(x.price) + '×' + x.qty + '</span>' +
            '<span class="amt">¥' + UI.money(lineAmt) + '</span></div>';
        }).join('') +
        '<div class="divider"></div>' +
        '<div class="tiny muted">收货人：' + UI.esc(o.receiver || '-') + ' · 期望到货：' + UI.esc(o.due || '待确认') + '</div>' +
        '<div class="tiny muted mt4">收货地址：' + UI.esc(o.address || '-') + '</div>' +
        '<div class="tiny muted mt4">采购用途：' + UI.esc(o.purpose || '-') + (o.note ? ' · 备注：' + UI.esc(o.note) : '') + '</div>' +
        '<div class="mt8"><a class="tbl-link tiny" href="#/order/' + UI.esc(o.id) + '">打开完整订单详情页 ›</a></div>' +
      '</div>';
    }

    function orderCard(o) {
      const g = gapByOrder[o.id];
      const split = domain.splitOrder(o);
      const splitTagsHtml = BIZ.budget.KEYS.filter(function (k) { return split[k] && split[k].total > 0; }).map(function (k) {
        const usable = Math.round(domain.storeUsableCents(state, o.store, o.id, k) / 100);
        return UI.budgetPill(k, BIZ.budget.SHORT[k] + ' ¥' + UI.money(split[k].total) + '（余 ¥' + UI.money(usable) + '）');
      }).join(' ');
      const itemCount = (o.items || []).length;
      const isOpen = !!expanded[o.id];

      return '<div class="card card-pad" style="margin-bottom:9px" data-order="' + UI.esc(o.id) + '">' +
        '<div class="between"><a class="order-id tbl-link" href="#/order/' + UI.esc(o.id) + '">' + UI.esc(o.id) + ' ›</a>' + UI.statusPill(o.status) + '</div>' +
        '<div class="order-meta">' + UI.esc(o.purchaseType === 'department' ? ('部门采购 · ' + o.department) : o.store) +
          ' · ' + UI.esc(o.manager || '') + ' · ' + UI.esc(BIZ.fmt.shortTime(o.createdAt)) + '</div>' +
        '<div class="order-items">' + UI.esc((o.items || []).slice(0, 3).map(function (x) { return x.name + '×' + x.qty; }).join('、')) +
          (itemCount > 3 ? ' 等 ' + itemCount + ' 项' : '') + '</div>' +
        '<div class="mt4"><button class="btn-inline" type="button" data-toggle-detail="' + UI.esc(o.id) + '" data-label="查看全部 ' + itemCount + ' 项明细">' +
          (isOpen ? '收起明细 ▴' : ('查看全部 ' + itemCount + ' 项明细 ▾')) + '</button></div>' +
        orderItemsDetailHtml(o) +
        (splitTagsHtml ? '<div class="tag-line mt4">' + splitTagsHtml + '</div>' : '') +
        (o.overReason ? '<div class="tiny mt4" style="color:var(--warn)">超预算说明：' + UI.esc(o.overReason) + '</div>' : '') +
        '<div class="between mt8"><span class="pill line">' + UI.esc(BIZ.fmt.TIER_LABEL[o.tier] || '') +
          (o.splitUpgraded ? ' · 累计防拆单' : '') + '</span>' +
          '<span class="order-amt">¥' + UI.money(o.total) + '</span></div>' +
        (g && g.needed > 0
          ? (g.ok
              ? '<div class="ap-budget">需从机动池追加 <b>¥' + UI.money(g.needed) + '</b>，余额 ¥' + UI.money(g.flex) + '（一步完成核定与金额审批）</div>'
              : '<div class="ap-budget bad">需追加 <b>¥' + UI.money(g.needed) + '</b> · 机动池 ¥' + UI.money(g.flex) +
                ' · 还差 <b>¥' + UI.money(g.short) + '</b></div>')
          : '') +
        '<div class="btn-group" style="margin-top:12px">' +
          '<button class="btn ghost sm" data-reject="' + UI.esc(o.id) + '">驳回</button>' +
          '<button class="btn ghost sm" data-adjust="' + UI.esc(o.id) + '">微调数量</button>' +
          '<button class="btn primary sm" data-pass="' + UI.esc(o.id) + '">通过</button>' +
        '</div>' +
      '</div>';
    }

    function groupCard(groupId, orders) {
      const total = orders.reduce(function (s, o) { return s + Number(o.total || 0); }, 0);
      const isOpen = !!expanded[groupId];
      const detailHtml = '<div class="ap-detail" style="display:' + (isOpen ? 'block' : 'none') + '">' +
        orders.map(function (o) {
          return '<div class="rec-block" style="margin-bottom:6px">' +
            '<div class="between"><a class="strong tbl-link" href="#/order/' + UI.esc(o.id) + '">' + UI.esc(o.id) + ' · ' + UI.esc(o.store) + ' ›</a>' +
              '<span class="money">¥' + UI.money(o.total) + '</span></div>' +
            '<div class="tiny muted mt4">收货人：' + UI.esc(o.receiver || '-') + ' · 地址：' + UI.esc(o.address || '-') + '</div>' +
            (o.items || []).map(function (x) {
              return '<div class="item-line"><span class="nm">' + UI.esc(x.name) +
                '<small>' + UI.esc(x.spec || '') + ' · ' + UI.esc(x.supplier || '') + '</small></span>' +
                '<span class="qty">×' + x.qty + '</span>' +
                '<span class="amt">¥' + UI.money(Number(x.price || 0) * Number(x.qty || 0)) + '</span></div>';
            }).join('') +
          '</div>';
        }).join('') +
      '</div>';

      return '<div class="card card-pad" style="margin-bottom:9px" data-group="' + UI.esc(groupId) + '">' +
        '<div class="between"><span class="order-id">' + UI.esc(groupId) + '</span>' +
          '<span class="pill warn">待统一确认</span></div>' +
        '<div class="order-meta">部门采购 · ' + UI.esc(orders[0].department || '') + ' · ' + UI.esc(orders[0].manager || '') + '</div>' +
        '<div class="order-items">' + UI.esc(orders.map(function (o) { return o.store; }).join('、')) + '</div>' +
        '<div class="mt4"><button class="btn-inline" type="button" data-toggle-detail="' + UI.esc(groupId) + '" data-label="查看 ' + orders.length + ' 个配送点完整明细">' +
          (isOpen ? '收起明细 ▴' : ('查看 ' + orders.length + ' 个配送点完整明细 ▾')) + '</button></div>' +
        detailHtml +
        '<div class="between mt8"><span class="tiny muted">' + orders.length + ' 个配送点</span>' +
          '<span class="order-amt">¥' + UI.money(total) + '</span></div>' +
        '<div class="btn-group" style="margin-top:12px">' +
          '<button class="btn ghost sm" data-group-reject="' + UI.esc(groupId) + '">整批驳回</button>' +
          '<button class="btn primary sm" data-group-pass="' + UI.esc(groupId) + '">整批确认</button>' +
        '</div>' +
      '</div>';
    }

    const totalCount = list.length;

    root.innerHTML =
      '<div class="between" style="margin-bottom:10px">' +
        '<div><div class="section-title">待我审批</div>' +
        '<div class="tiny muted mt4">' + UI.esc(BIZ.perm.roleMeta(me.role).duty) + '</div></div>' +
        '<div class="row" style="gap:6px">' +
          (batchEligible.length > 1
            ? '<button class="btn soft sm" id="btn-batch-pass">一键通过预算内（' + batchEligible.length + '）</button>'
            : '') +
          '<span class="pill ' + (totalCount ? 'warn' : 'good') + '">' + totalCount + ' 单待处理</span>' +
        '</div>' +
      '</div>' +
      (totalCount
        ? Object.keys(deptGroups).map(function (gid) { return groupCard(gid, deptGroups[gid]); }).join('') +
          single.sort(function (a, b) { return String(a.createdAt).localeCompare(String(b.createdAt)); }).map(orderCard).join('')
        : UI.empty('✅', '没有待审批事项', '订单提交后会按金额与预算规则自动流转到这里')) +
      '<div class="note-box mt16">审批规则（优化后）：预算内 ≤¥' + UI.money(ac.autoMax) + ' 战区一步审核直发，¥' +
        UI.money(ac.autoMax) + '–' + UI.money(ac.regionMax) + ' 战区一步终审（合规+金额合并，免二次点击），>¥' +
        UI.money(ac.regionMax) + ' 战区审核后报中台金额审批；超出可用预算的订单由战区审核后转中台一步完成「预算核定 + 金额审批」。' +
        (me.role === 'central' ? ' <a href="#/console?tab=rules" style="color:var(--brand);font-weight:600">去中台操作台调整阈值 →</a>' : '') +
      '</div>';

    function decide(orderId, pass, extra) {
      const order = state.orders.filter(function (o) { return o.id === orderId; })[0];
      if (!order) return false;
      const opts = extra || {};
      try {
        App.mutate(function (st, ses) {
          return BIZ.domain.approveOrder(st, ses, {
            orderId: orderId,
            stage: order.status,
            pass: pass,
            note: opts.note || '',
            requireReason: !!opts.requireReason,
            adjustQuantities: opts.adjustQuantities
          });
        });
        UI.toast(pass ? '已通过，流转至下一节点' : '已驳回', pass ? 'good' : '');
        App.reload();
        return true;
      } catch (e) {
        if (e.code === 'FLEX_SHORT') {
          openGap(order, e.gap);
        } else {
          UI.toast(e.message, 'error', 2800);
        }
        return false;
      }
    }

    function openRejectSheet(orderId) {
      const order = state.orders.filter(function (o) { return o.id === orderId; })[0];
      if (!order) return;
      UI.sheet({
        title: '驳回订单 ' + order.id,
        sub: UI.esc(order.store) + ' · ¥' + UI.money(order.total) + '（驳回后释放预算占用并留痕）',
        body: '<div class="field"><div class="label">驳回原因<span class="req">*</span></div>' +
          '<textarea class="textarea" id="rj-note" maxlength="160" placeholder="请填写至少 2 个字的驳回原因，便于门店修改后重提"></textarea></div>',
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: '确认驳回', cls: 'danger-solid', onClick: function (_close, bodyEl) {
              const reason = bodyEl.querySelector('#rj-note').value.trim();
              if (reason.length < 2) {
                UI.toast('请填写至少 2 个字的驳回原因', 'error');
                return false;
              }
              return decide(orderId, false, { note: reason, requireReason: true });
            } }
        ]
      });
    }

    function openAdjustSheet(orderId) {
      const order = state.orders.filter(function (o) { return o.id === orderId; })[0];
      if (!order) return;
      const body = '<div class="note-box mb12">可在审批通过前直接下调或修改各项商品数量（无需整单驳回重下），系统将自动重算订单金额与预算占用。</div>' +
        (order.items || []).map(function (it) {
          return '<div class="between" style="padding:8px 0;border-bottom:1px solid var(--line)">' +
            '<div><div class="strong">' + UI.esc(it.name) + '</div>' +
              '<div class="tiny muted">¥' + UI.money(it.price) + ' / ' + UI.esc(it.unit || '件') + ' · 原申购 ' + it.qty + '</div></div>' +
            '<input class="input" type="number" min="1" max="9999" data-adj-id="' + UI.esc(it.id) + '" value="' + it.qty + '" style="width:86px;text-align:center">' +
          '</div>';
        }).join('') +
        '<div class="field mt12"><div class="label">审批意见（选填）</div>' +
          '<input class="input" id="adj-note" maxlength="120" placeholder="例如：按实际活动规模核减数量"></div>';

      UI.sheet({
        title: '微调数量并通过 · ' + order.id,
        sub: UI.esc(order.store) + ' · 原金额 ¥' + UI.money(order.total),
        body: body,
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: '保存并通过', cls: 'primary', onClick: function (_close, bodyEl) {
              const map = {};
              bodyEl.querySelectorAll('[data-adj-id]').forEach(function (inp) {
                map[inp.dataset.adjId] = Number(inp.value);
              });
              const note = bodyEl.querySelector('#adj-note').value.trim();
              return decide(orderId, true, { adjustQuantities: map, note: note });
            } }
        ]
      });
    }

    function openGap(order, gap) {
      const shortRows = (gap.rows || []).filter(function (r) { return r.over; })
        .sort(function (a, b) { return b.needed - a.needed; });
      let key = shortRows[0] ? shortRows[0].key : '';
      let from = '';

      function candidatesFor(k) {
        return BIZ.domain.budgetSummary(state, { role: 'central', stores: [] })
          .filter(function (b) { return b.store !== order.store; })
          .map(function (b) {
            const it = (b.items || []).filter(function (x) { return x.key === k; })[0];
            return { store: b.store, free: it ? it.available : 0 };
          })
          .filter(function (c) { return c.free > 0; })
          .sort(function (a, b) { return b.free - a.free; })
          .slice(0, 6);
      }

      const itemRows = shortRows.map(function (r) {
        return '<div class="gap-row"><span class="k">' + UI.esc(r.name) + '</span>' +
          '<span class="v">¥' + UI.money(r.total) + '<span class="tiny muted"> · 可用 ¥' + UI.money(r.usable) +
          ' · 缺 ¥' + UI.money(r.needed) + '</span></span></div>';
      }).join('');

      const chips = shortRows.length > 1
        ? '<div class="gap-chips" id="g-chips">' + shortRows.map(function (r) {
            return '<button class="chip' + (r.key === key ? ' on' : '') + '" data-key="' + r.key + '">' +
              UI.esc(r.name) + ' · 缺 ¥' + UI.money(r.needed) + '</button>';
          }).join('') + '</div>'
        : '';

      const body =
        '<div class="gap-hero"><div class="t">机动预算不足，还差 ¥' + UI.money(gap.short) + '</div>' +
          '<div class="s">这笔单需要从机动池追加 ¥' + UI.money(gap.needed) + '，但余额只有 ¥' + UI.money(gap.flex) +
          '。下面任一方式补足后会自动完成核定。</div></div>' +

        '<div class="gap-rows">' +
          '<div class="gap-row"><span class="k">订单金额</span><span class="v">¥' + UI.money(gap.total) + '</span></div>' +
          itemRows +
          '<div class="gap-row"><span class="k">机动池余额</span><span class="v">¥' + UI.money(gap.flex) + '</span></div>' +
          '<div class="gap-row bad"><span class="k">仍缺</span><span class="v">¥' + UI.money(gap.short) + '</span></div>' +
        '</div>' +

        '<div class="gap-method">' +
          '<h4>方式一 · 追加机动预算</h4>' +
          '<p>增加公司预留额度，按科目缺口自动分配到对应费用项。真实场景应经预算负责人审批。</p>' +
          '<div class="bd"><div class="inline-input"><span class="c">¥</span>' +
            '<input id="g-amount" type="number" min="0" step="0.01" value="' + gap.short + '"></div>' +
            '<input class="input mt8" id="g-reason" maxlength="60" placeholder="用途说明，例如：门店开业活动专项（选填）">' +
            '<button class="btn soft block mt8" id="g-flex">追加 ¥<span id="g-amt-label">' + UI.money(gap.short) + '</span> 并核定</button>' +
          '</div>' +
        '</div>' +

        '<div class="gap-method">' +
          '<h4>方式二 · 从其他门店调剂同科目额度</h4>' +
          '<p>不增加公司总预算，把其他门店该科目的闲置额度划给本店，治理上更稳妥。</p>' +
          chips +
          '<div class="bd" id="g-move-wrap"></div>' +
        '</div>' +

        '<div class="note-box">单笔最多可核定 ¥' + UI.money(gap.maxSupport) + '（门店可用 + 机动池）。若两种方式都补不上，建议驳回，让门店按上限拆单或转专项采购。</div>';

      const s = UI.sheet({
        title: '预算核定缺口',
        sub: UI.esc(order.id) + ' · ' + UI.esc(order.store) + ' · 订单 ¥' + UI.money(order.total),
        body: body,
        actions: [
          { label: '稍后处理', cls: 'ghost' },
          { label: '驳回订单', cls: 'danger', onClick: function () { decide(order.id, false); } }
        ],
        mount: function (bodyEl) {
          const wrap = bodyEl.querySelector('#g-move-wrap');

          function renderMove() {
            const cands = candidatesFor(key);
            if (!from || !cands.some(function (c) { return c.store === from; })) {
              from = cands.length ? cands[0].store : '';
            }
            const need = (shortRows.filter(function (r) { return r.key === key; })[0] || {}).needed || gap.short;
            wrap.innerHTML = cands.length
              ? cands.map(function (c) {
                  return '<button class="store-pick' + (c.store === from ? ' on' : '') + '" data-from="' + UI.esc(c.store) + '">' +
                    '<span>' + UI.esc(c.store) + '</span>' +
                    '<span class="r">可调 ¥' + UI.money(c.free) + '</span></button>';
                }).join('') +
                '<div class="inline-input mt8"><span class="c">¥</span>' +
                  '<input id="g-move" type="number" min="0" step="0.01" value="' + Math.min(need, cands[0].free) + '"></div>' +
                '<button class="btn soft block mt8" id="g-transfer">调剂到 ' + UI.esc(order.store) + ' 并核定</button>'
              : '<div class="tiny muted">其他门店该科目当前没有可调结余，只能用方式一或驳回后让门店拆单。</div>';

            wrap.onclick = function (e) {
              const pick = e.target.closest('[data-from]');
              if (pick) {
                from = pick.dataset.from;
                wrap.querySelectorAll('[data-from]').forEach(function (x) {
                  x.classList.toggle('on', x.dataset.from === from);
                });
                return;
              }
              const btn = e.target.closest('#g-transfer');
              if (!btn) return;
              const amount = Number(wrap.querySelector('#g-move').value);
              if (!from) { UI.toast('请选择调出门店', 'error'); return; }
              try {
                App.mutate(function (st, ses) {
                  const res = BIZ.domain.transferStoreBudget(st, ses, from, order.store, amount, key);
                  Store.appendAudit([{
                    orderId: order.id, kind: 'budget', stage: 'budget-central', decision: '门店额度调剂',
                    role: '运营管理部（' + ses.id + '）', from: '', to: '',
                    note: res.from + ' → ' + res.to + '「' + res.item + '」¥' + UI.money(res.amount),
                    at: new Date().toISOString()
                  }]);
                  return BIZ.domain.approveOrder(st, ses, { orderId: order.id, stage: order.status, pass: true });
                });
                s.close();
                UI.toast('已调剂额度并完成核定', 'good');
                App.reload();
              } catch (err) {
                UI.toast(err.message, 'error', 2800);
              }
            };
          }

          const chipsEl = bodyEl.querySelector('#g-chips');
          if (chipsEl) {
            chipsEl.addEventListener('click', function (e) {
              const chip = e.target.closest('[data-key]');
              if (!chip) return;
              key = chip.dataset.key;
              chipsEl.querySelectorAll('[data-key]').forEach(function (x) {
                x.classList.toggle('on', x.dataset.key === key);
              });
              renderMove();
            });
          }

          renderMove();

          const amountInput = bodyEl.querySelector('#g-amount');
          amountInput.addEventListener('input', function () {
            bodyEl.querySelector('#g-amt-label').textContent = UI.money(Number(amountInput.value || 0));
          });

          bodyEl.querySelector('#g-flex').onclick = function () {
            const amount = Number(amountInput.value);
            const reason = bodyEl.querySelector('#g-reason').value.trim();
            try {
              App.mutate(function (st, ses) {
                const adj = BIZ.domain.adjustFlex(st, ses, amount, reason);
                Store.appendAudit([{
                  orderId: order.id, kind: 'budget', stage: 'budget-central', decision: '追加机动预算',
                  role: '运营管理部（' + ses.id + '）', from: '', to: '',
                  note: '机动池 ¥' + UI.money(adj.before) + ' → ¥' + UI.money(adj.after) + (reason ? '；用途：' + reason : ''),
                  at: new Date().toISOString()
                }]);
                return BIZ.domain.approveOrder(st, ses, { orderId: order.id, stage: order.status, pass: true });
              });
              s.close();
              UI.toast('已追加预算并完成核定', 'good');
              App.reload();
            } catch (err) {
              UI.toast(err.message, 'error', 2800);
            }
          };
        }
      });
    }

    root.addEventListener('click', function (e) {
      const toggleBtn = e.target.closest('[data-toggle-detail]');
      if (toggleBtn) {
        const key = toggleBtn.dataset.toggleDetail;
        expanded[key] = !expanded[key];
        const card = toggleBtn.closest('.card');
        const panel = card && card.querySelector('.ap-detail');
        if (panel) panel.style.display = expanded[key] ? 'block' : 'none';
        toggleBtn.textContent = expanded[key] ? '收起明细 ▴' : ((toggleBtn.dataset.label || '查看明细') + ' ▾');
        return;
      }

      if (e.target.closest('#btn-batch-pass')) {
        UI.confirm({
          title: '一键通过 ' + batchEligible.length + ' 笔预算内订单？',
          sub: '仅处理当前名下未超预算的待审订单（超预算核定单保留单独处理）。',
          okText: '确认批量通过'
        }).then(function (ok) {
          if (!ok) return;
          try {
            const res = App.mutate(function (st, ses) {
              return BIZ.domain.batchApproveOrders(st, ses, {
                orderIds: batchEligible.map(function (o) { return o.id; })
              });
            });
            UI.toast('已批量通过 ' + res.count + ' 笔订单', 'good');
            App.reload();
          } catch (err) {
            UI.toast(err.message, 'error', 2800);
          }
        });
        return;
      }

      const pass = e.target.closest('[data-pass]');
      if (pass) { decide(pass.dataset.pass, true); return; }

      const adjust = e.target.closest('[data-adjust]');
      if (adjust) { openAdjustSheet(adjust.dataset.adjust); return; }

      const reject = e.target.closest('[data-reject]');
      if (reject) {
        openRejectSheet(reject.dataset.reject);
        return;
      }

      const gp = e.target.closest('[data-group-pass]');
      if (gp) {
        groupDecide(gp.dataset.groupPass, true);
        return;
      }

      const gr = e.target.closest('[data-group-reject]');
      if (gr) {
        UI.confirm({
          title: '整批驳回部门采购？',
          sub: '该批次下所有配送点都会变为已驳回。',
          okText: '整批驳回', danger: true
        }).then(function (ok) { if (ok) groupDecide(gr.dataset.groupReject, false); });
      }
    });

    function groupDecide(groupId, pass) {
      try {
        App.mutate(function (st, ses) {
          return BIZ.domain.approveDepartmentGroup(st, ses, groupId, pass);
        });
        UI.toast(pass ? '批次已确认，已发送供应商' : '批次已驳回', pass ? 'good' : '');
        App.reload();
      } catch (e) {
        UI.toast(e.message, 'error', 2800);
      }
    }
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/supplier.js ==== */
/* 供应商工作台（外部账号）：接单 / 拒单 / 分批发货 */
(function (Views) {
  const SHIP = BIZ.domain.SHIPPING_METHODS;

  Views.supplier = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;
    const supplier = me.supplier;

    if (me.role !== 'supplier') {
      root.innerHTML = UI.empty('🔐', '仅供应商账号可进入', '门店与内部角色请使用「采购下单 / 订单」等功能');
      return;
    }

    let tab = r.query.tab || 'pending';

    function mine() {
      return domain.visibleOrders(state, me).filter(function (o) {
        const rec = (o.supplierRecords || {})[supplier];
        // 已取消 / 已拒单不进供应商工作台，与小程序口径一致
        return rec && ['cancelled', 'rejected'].indexOf(o.status) < 0;
      }).sort(function (a, b) {
        return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
      });
    }

    // 每单只归一个页签：之前按 key 各自判断会「一单命中多个页签」，
    // 导致顶部数字与列表条数不符（如结算确认显示 9 单却只有 1 单）
    function classify(o) {
      const rec = o.supplierRecords[supplier] || {};
      if (rec.status === 'pending') return 'pending';
      if (rec.status === 'issue' || domain.hasOpenAcceptanceIssue(o, supplier)) return 'issue';
      // 验收完成后分项记录已是 accepted，但结算金额仍需双方确认，
      // 因此优先按订单状态分流到「结算确认」，不能简单归入「已完成」
      if (['settle-pending', 'settle-supplier', 'settle-disputed'].indexOf(o.status) >= 0) return 'settle';
      if (['accepted', 'delivered'].indexOf(rec.status) >= 0) return 'done';
      if (rec.status === 'shipping') return 'shipping';
      if (rec.status === 'confirmed') {
        return (rec.deliveries && rec.deliveries.length) ? 'shipping' : 'toship';
      }
      return 'pending';
    }

    function bucket(key) {
      return mine().filter(function (o) { return classify(o) === key; });
    }

    const TABS = [
      { key: 'pending', label: '待接单' },
      { key: 'issue', label: '异常' },
      { key: 'toship', label: '待发货' },
      { key: 'shipping', label: '配送中' },
      { key: 'settle', label: '结算确认' },
      { key: 'done', label: '已完成' }
    ];

    function myItems(o) {
      return (o.items || []).filter(function (x) { return x.supplier === supplier; });
    }

    function remaining(x) {
      return Math.max(0, Number(x.qty || 0) - Number(x.deliveredQty || 0));
    }

    function openIssuesFor(o) {
      return (o.acceptanceIssues || []).filter(function (iss) {
        return (!iss.supplier || iss.supplier === supplier) && (iss.status === 'open' || (!iss.status && !iss.resolvedAt));
      });
    }

    function card(o) {
      const rec = o.supplierRecords[supplier];
      const items = myItems(o);
      const amount = items.reduce(function (s, x) { return s + Number(x.price || 0) * Number(x.qty || 0); }, 0);
      const toShip = items.reduce(function (s, x) { return s + remaining(x); }, 0);
      const openIssues = openIssuesFor(o);
      // 结算阶段以订单状态为准，避免"验收完就显示已完成"的误导
      const inSettle = ['settle-pending', 'settle-supplier', 'settle-disputed', 'accepted'].indexOf(o.status) >= 0;
      const pill = openIssues.length
        ? '<span class="pill bad">验收异常 ' + openIssues.length + ' 项</span>'
        : (inSettle ? UI.statusPill(o.status) : UI.supplierPill(rec.status));
      return '<div class="card card-pad" style="margin-bottom:9px">' +
        '<div class="between"><span class="order-id">' + UI.esc(o.id) + '</span>' + pill + '</div>' +
        '<div class="order-meta">' + UI.esc(o.store || '') + ' · ' + UI.esc(o.receiver || '') + ' · ' + UI.esc(o.address || '') + '</div>' +
        items.slice(0, 4).map(function (x) {
          return '<div class="sup-item"><span>' + UI.esc(x.name) + '</span>' +
            '<span class="q">×' + x.qty + (remaining(x) > 0 && remaining(x) < x.qty ? '（待发 ' + remaining(x) + '）' : '') + '</span></div>';
        }).join('') +
        ((items.length > 4) ? '<div class="tiny muted">等 ' + items.length + ' 项</div>' : '') +
        (rec.issue ? '<div class="alert mt8">' + UI.icon('alert', 'sm') + '<span>拒单原因：' + UI.esc(rec.issue) + '</span></div>' : '') +
        openIssues.map(function (iss) {
          return '<div class="alert mt8">' + UI.icon('alert', 'sm') +
            '<span>门店第 ' + (iss.batchNo || 1) + ' 批验收异常：' + UI.esc(iss.note || '') + '</span></div>';
        }).join('') +
        '<div class="between" style="margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2)">' +
          '<span class="tiny muted">期望到货 ' + UI.esc(o.due || '待确认') + ' · 我的金额</span>' +
          '<span class="order-amt">¥' + UI.money(amount) + '</span></div>' +
        '<div class="btn-group" style="margin-top:10px">' +
          '<button class="btn ghost sm" data-view="' + UI.esc(o.id) + '">详情</button>' +
          (openIssues.length
            ? '<button class="btn danger sm" data-resolve-issue="' + UI.esc(o.id) + '">响应验收异常</button>'
            : '') +
          (rec.status === 'pending'
            ? '<button class="btn danger sm" data-issue="' + UI.esc(o.id) + '">无法接单</button>' +
              '<button class="btn primary sm" data-ack="' + UI.esc(o.id) + '">确认接单</button>'
            : '') +
          (rec.status === 'issue'
            ? '<button class="btn soft sm" data-reopen="' + UI.esc(o.id) + '">撤回拒单</button>'
            : '') +
          (rec.status === 'confirmed' && toShip > 0
            ? '<button class="btn primary sm" data-ship="' + UI.esc(o.id) + '">登记发货</button>'
            : '') +
          (rec.status === 'shipping'
            ? '<button class="btn soft sm" data-view="' + UI.esc(o.id) + '">查看物流</button>'
            : '') +
          (o.status === 'settle-supplier'
            ? '<button class="btn primary sm" data-settle="' + UI.esc(o.id) + '">确认结算金额</button>'
            : o.status === 'accepted' || o.status === 'done'
              ? '<button class="btn ghost sm" data-settle="' + UI.esc(o.id) + '">查看结算</button>'
              : '') +
        '</div>' +
      '</div>';
    }

    function render() {
      const counts = {};
      TABS.forEach(function (t) { counts[t.key] = bucket(t.key).length; });

      root.innerHTML =
        '<div class="between" style="margin-bottom:10px">' +
          '<div><div class="section-title">' + UI.esc(supplier) + '</div>' +
          '<div class="tiny muted mt4">外部供应商账号 · 仅可接单、发货与对账确认</div></div>' +
          '<span class="pill amber">' + counts.pending + ' 单待接</span>' +
        '</div>' +
        '<div class="tab-seg" id="sup-tabs">' + TABS.map(function (t) {
          return '<button data-t="' + t.key + '" class="' + (tab === t.key ? 'on' : '') + '">' +
            t.label + (counts[t.key] ? ' ' + counts[t.key] : '') + '</button>';
        }).join('') + '</div>' +
        '<div id="sup-list"></div>' +
        '<div class="note-box mt16">发货请按实际交付数量登记，可分多批。订单在门店验收后才会进入「已完结」，发货本身只推进到「配送中」。</div>';

      const list = bucket(tab);
      root.querySelector('#sup-list').innerHTML = list.length
        ? list.map(card).join('')
        : UI.empty('🚚', '该分类暂无订单', tab === 'pending' ? '新订单会实时出现在这里' : '');

      root.querySelector('#sup-tabs').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-t]');
        if (!btn) return;
        tab = btn.dataset.t;
        render();
      });
    }

    function find(id) {
      return state.orders.filter(function (o) { return o.id === id; })[0];
    }

    function ack(orderId) {
      try {
        App.mutate(function (st, ses) {
          return BIZ.domain.supplierAck(st, ses, { orderId: orderId, action: 'confirm' });
        });
        UI.toast('已确认接单，请及时备货发货', 'good');
        App.go('/supplier?tab=toship');
      } catch (e) { UI.toast(e.message, 'error', 2800); }
    }

    function reject(orderId) {
      const s = UI.sheet({
        title: '反馈无法接单',
        sub: '请说明原因，采购方会看到并处理。',
        body: '<div class="field"><div class="label">原因<span class="req">*</span></div>' +
          '<textarea class="textarea" id="issue-reason" maxlength="300" placeholder="例如：该商品暂时缺货，预计 3 天后到货"></textarea></div>',
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: '提交', cls: 'primary', onClick: function (close, body) {
              const reason = body.querySelector('#issue-reason').value.trim();
              try {
                App.mutate(function (st, ses) {
                  return BIZ.domain.supplierAck(st, ses, { orderId: orderId, action: 'issue', reason: reason });
                });
                UI.toast('已反馈采购方', '');
                App.reload();
              } catch (e) { UI.toast(e.message, 'error', 2800); return false; }
            } }
        ]
      });
    }

    function reopen(orderId) {
      try {
        App.mutate(function (st, ses) {
          return BIZ.domain.reopenSupplierAck(st, ses, { orderId: orderId });
        });
        UI.toast('已撤回拒单，可重新确认接单', 'good');
        App.reload();
      } catch (e) { UI.toast(e.message, 'error', 2800); }
    }

    function ship(orderId) {
      const order = find(orderId);
      if (!order) return;
      const items = myItems(order).filter(function (x) { return remaining(x) > 0; });
      let method = 'express';

      function shippingFields() {
        if (method === 'express') {
          return '<div class="field-row"><div class="field"><div class="label">快递公司<span class="req">*</span></div>' +
            '<input class="input" id="s-carrier" maxlength="30" placeholder="顺丰 / 京东 / 德邦"></div>' +
            '<div class="field"><div class="label">运单号<span class="req">*</span></div>' +
            '<input class="input" id="s-track" maxlength="40" placeholder="至少 4 位"></div></div>';
        }
        if (method === 'lalamove' || method === 'runner') {
          return '<div class="field"><div class="label">平台订单号<span class="req">*</span></div>' +
            '<input class="input" id="s-track" maxlength="40" placeholder="平台订单号 / 取货码"></div>' +
            '<div class="field"><div class="label">联系人</div>' +
            '<input class="input" id="s-contact" maxlength="30" placeholder="司机 / 骑手联系电话（选填）"></div>';
        }
        return '<div class="field"><div class="label">配送安排 / 联系人<span class="req">*</span></div>' +
          '<input class="input" id="s-contact" maxlength="30" placeholder="例如：自有车辆，张师傅 138xxxx"></div>';
      }

      const body =
        '<div class="note-box mb12">' + UI.esc(order.store) + ' · ' + UI.esc(order.receiver) + ' · ' + UI.esc(order.address) + '</div>' +
        '<div class="field"><div class="label">配送方式<span class="req">*</span></div>' +
          '<div class="radio-cards" id="s-methods">' + Object.keys(SHIP).map(function (k) {
            return '<label class="radio-card' + (k === method ? ' on' : '') + '" data-m="' + k + '">' +
              '<span class="rd"></span><span class="grow"><span>' + UI.esc(SHIP[k]) + '</span>' +
              '<span class="d">' + (k === 'express' ? '需填写快递公司与运单号' : k === 'lalamove' ? '货拉拉等同城货运，需平台单号' : k === 'runner' ? '闪送/跑腿，需平台单号' : '自行安排车辆配送') + '</span></span></label>';
          }).join('') + '</div></div>' +
        '<div id="s-ship-fields">' + shippingFields() + '</div>' +
        '<div class="field"><div class="label">预计到达</div>' +
          '<input class="input" id="s-eta" type="date" min="' + UI.todayStr() + '"></div>' +
        '<div class="field"><div class="label">本次交付商品<span class="req">*</span></div>' +
          '<div class="ship-lines">' + items.map(function (x) {
            return '<div class="ship-line"><span class="nm">' + UI.esc(x.name) +
              '<small>待交付 ' + remaining(x) + ' / 共 ' + x.qty + '</small></span>' +
              '<input type="number" min="0" max="' + remaining(x) + '" value="' + remaining(x) + '" data-line="' + UI.esc(x.id) + '">' +
              '<span class="u">' + UI.esc(x.unit || '件') + '</span></div>';
          }).join('') + '</div></div>' +
        '<div class="field"><div class="label">发货备注</div>' +
          '<textarea class="textarea" id="s-note" maxlength="120" placeholder="选填，例如：分两箱发出"></textarea></div>' +
        '<div class="note-box">发货后订单进入「配送中」，门店验收后才会完结。</div>';

      const s = UI.sheet({
        title: '登记发货',
        sub: UI.esc(order.id) + ' · ' + UI.esc(order.store),
        body: body,
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: '确认发货', cls: 'primary', onClick: function (close, bodyEl) {
              const lines = [];
              bodyEl.querySelectorAll('[data-line]').forEach(function (input) {
                const qty = Number(input.value);
                if (qty > 0) lines.push({ id: input.dataset.line, qty: qty });
              });
              const shipping = {
                method: method,
                carrier: (bodyEl.querySelector('#s-carrier') || {}).value || '',
                trackingNo: (bodyEl.querySelector('#s-track') || {}).value || '',
                contact: (bodyEl.querySelector('#s-contact') || {}).value || '',
                estimatedAt: (bodyEl.querySelector('#s-eta') || {}).value || ''
              };
              try {
                const res = App.mutate(function (st, ses) {
                  return BIZ.domain.supplierDeliver(st, ses, {
                    orderId: order.id, lines: lines, shipping: shipping,
                    note: (bodyEl.querySelector('#s-note') || {}).value || ''
                  });
                });
                UI.toast('第 ' + res.batchNo + ' 批已登记，订单进入配送中', 'good', 2400);
                App.go('/supplier?tab=shipping');
              } catch (e) {
                UI.toast(e.message, 'error', 2800);
                return false;
              }
            } }
        ],
        mount: function (bodyEl) {
          bodyEl.querySelector('#s-methods').addEventListener('click', function (e) {
            const card = e.target.closest('[data-m]');
            if (!card) return;
            method = card.dataset.m;
            bodyEl.querySelectorAll('[data-m]').forEach(function (x) {
              x.classList.toggle('on', x.dataset.m === method);
            });
            const fields = bodyEl.querySelector('#s-ship-fields');
            fields.innerHTML = shippingFields();
            fields.querySelectorAll('input').forEach(function (i) {
              if (i.type === 'number' || i.type === 'date') return;
            });
          });
        }
      });
    }

    render();

    root.addEventListener('click', function (e) {
      const v = e.target.closest('[data-view]');
      if (v) { App.go('/order/' + v.dataset.view); return; }

      const a = e.target.closest('[data-ack]');
      if (a) {
        UI.confirm({
          title: '确认接单？',
          sub: '接单后请按承诺时间备货，并登记配送信息。',
          okText: '确认接单'
        }).then(function (ok) { if (ok) ack(a.dataset.ack); });
        return;
      }

      const i = e.target.closest('[data-issue]');
      if (i) { reject(i.dataset.issue); return; }

      const re = e.target.closest('[data-reopen]');
      if (re) {
        UI.confirm({ title: '撤回拒单？', sub: '撤回后订单会恢复为待接单，可重新确认。', okText: '确认撤回' })
          .then(function (ok) { if (ok) reopen(re.dataset.reopen); });
        return;
      }

      const sh = e.target.closest('[data-ship]');
      if (sh) { ship(sh.dataset.ship); return; }

      // 结算金额共同确认：供应商确认 / 查看结算明细
      const se = e.target.closest('[data-settle]');
      if (se) { App.go('/settle/' + se.dataset.settle); return; }

      const ri = e.target.closest('[data-resolve-issue]');
      if (ri) {
        const orderId = ri.dataset.resolveIssue;
        const o = find(orderId);
        const iss = o ? openIssuesFor(o)[0] : null;
        let plan = 'reship';
        UI.sheet({
          title: '响应门店验收异常 · ' + orderId,
          sub: iss ? ('第 ' + (iss.batchNo || 1) + ' 批异常：' + iss.note) : '选择处理方案并填写说明，门店及中台将同步看到',
          body:
            '<div class="field"><div class="label">处理方案<span class="req">*</span></div>' +
              '<div class="radio-cards" id="ri-plans">' +
                '<label class="radio-card on" data-p="reship"><span class="rd"></span><span class="grow"><span>安排补发 / 换货</span><span class="d">立即安排补齐或替换破损物资</span></span></label>' +
                '<label class="radio-card" data-p="discount"><span class="rd"></span><span class="grow"><span>转结算折让</span><span class="d">不再补发，按少收/破损数量在结算环节折让</span></span></label>' +
                '<label class="radio-card" data-p="resolved"><span class="rd"></span><span class="grow"><span>已沟通协商结案</span><span class="d">已与门店核对完毕，关闭异常提醒</span></span></label>' +
              '</div></div>' +
            '<div class="field"><div class="label">处理说明<span class="req">*</span></div>' +
              '<textarea class="textarea" id="ri-reply" maxlength="300" placeholder="例如：已安排顺丰补发 2 个充电宝，预计明日送达"></textarea></div>',
          mount: function (bodyEl) {
            bodyEl.querySelector('#ri-plans').addEventListener('click', function (ev) {
              const cardEl = ev.target.closest('[data-p]');
              if (!cardEl) return;
              plan = cardEl.dataset.p;
              bodyEl.querySelectorAll('[data-p]').forEach(function (x) { x.classList.toggle('on', x.dataset.p === plan); });
            });
          },
          actions: [
            { label: '取消', cls: 'ghost' },
            { label: '提交方案', cls: 'primary', onClick: function (_close, bodyEl) {
                const reply = bodyEl.querySelector('#ri-reply').value.trim();
                try {
                  App.mutate(function (st, ses) {
                    return domain.resolveAcceptanceIssue(st, ses, {
                      orderId: orderId, issueId: iss && iss.id, plan: plan, reply: reply
                    });
                  });
                  UI.toast('已登记处理方案', 'good');
                  render();
                } catch (err) { UI.toast(err.message, 'error', 2600); return false; }
              } }
          ]
        });
      }
    });
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/accept.js ==== */
/* 收货验收：按配送批次验收、拍照留证、异常反馈 */
(function (Views) {
  const SHIP = BIZ.domain.SHIPPING_METHODS;

  function orderById(state, id) {
    return state.orders.filter(function (o) { return o.id === id; })[0];
  }

  Views.accept = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;

    if (r.params[0]) {
      renderForm(root, r, ctx);
      return;
    }

    const list = domain.pendingAcceptOrders(state, me);
    const groups = [];

    list.forEach(function (order) {
      Object.keys(order.supplierRecords || {}).forEach(function (supplier) {
        const rec = order.supplierRecords[supplier];
        (rec.deliveries || []).forEach(function (d) {
          let avail;
          try { avail = domain.batchAvailability(order, supplier, d.batchNo); } catch (e) { return; }
          const total = Object.keys(avail.remaining).reduce(function (s, k) { return s + avail.remaining[k]; }, 0);
          if (total > 0) groups.push({ order: order, supplier: supplier, delivery: d, remaining: avail.remaining, total: total });
        });
      });
    });

    if (!groups.length) {
      root.innerHTML = UI.empty('📷', '没有待验收的批次', '供应商发货后，这里会出现待验收记录');
      return;
    }

    root.innerHTML =
      '<div class="between" style="margin-bottom:10px">' +
        '<div><div class="section-title">待验收</div><div class="tiny muted mt4">按配送批次逐批验收，支持部分验收</div></div>' +
        '<span class="pill warn">' + groups.length + ' 个批次</span>' +
      '</div>' +
      groups.map(function (g) {
        const sp = g.delivery.shipping || {};
        return '<a class="card card-pad" style="margin-bottom:9px;display:block" href="#/accept/' + UI.esc(g.order.id) +
          '?supplier=' + encodeURIComponent(g.supplier) + '&batch=' + g.delivery.batchNo + '">' +
          '<div class="between"><span class="order-id">' + UI.esc(g.order.id) + '</span>' +
            '<span class="pill info">第 ' + g.delivery.batchNo + ' 批 · 待验收</span></div>' +
          '<div class="order-meta">' + UI.esc(g.order.store) + ' · ' + UI.esc(g.supplier) + '</div>' +
          '<div class="order-items">' + (g.delivery.lines || []).map(function (l) {
            return l.name + '×' + l.qty;
          }).join('、') + '</div>' +
          '<div class="order-foot">' +
            '<span class="tiny muted">' + UI.esc(SHIP[sp.method] || '') + (sp.trackingNo ? ' · ' + UI.esc(sp.trackingNo) : '') + '</span>' +
            '<span class="pill good" style="margin-left:auto">待验收 ' + g.total + ' 件</span>' +
          '</div>' +
        '</a>';
      }).join('');
  };

  function renderForm(root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;
    const order = orderById(state, r.params[0]);

    if (!order) {
      root.innerHTML = UI.empty('🔒', '订单不存在', '');
      return;
    }
    if (!domain.canAcceptOrder(order, me)) {
      root.innerHTML = UI.empty('🔒', '当前身份不能验收这笔订单', '门店单由收货门店验收，总部配送由采购部门验收');
      return;
    }

    const supplier = r.query.supplier || Object.keys(order.supplierRecords || {})[0];
    const rec = (order.supplierRecords || {})[supplier];
    if (!rec) {
      root.innerHTML = UI.empty('🚚', '找不到该供应商的配送记录', '');
      return;
    }
    const deliveries = rec.deliveries || [];
    if (!deliveries.length) {
      root.innerHTML = UI.empty('🚚', '该供应商还没有发货记录', '');
      return;
    }

    let batchNo = Number(r.query.batch || deliveries[deliveries.length - 1].batchNo);
    let delivery = deliveries.filter(function (d) { return d.batchNo === batchNo; })[0] || deliveries[deliveries.length - 1];
    batchNo = delivery.batchNo;

    let avail = domain.batchAvailability(order, supplier, batchNo);
    let photo = '';
    let result = 'pass';

    function render() {
      const sp = delivery.shipping || {};
      const lines = Object.keys(avail.remaining).filter(function (id) {
        return avail.remaining[id] > 0;
      }).map(function (id) {
        return { item: order.items.filter(function (x) { return x.id === id; })[0], left: avail.remaining[id] };
      }).filter(function (x) { return x.item; });

      const needInstall = lines.some(function (x) { return BIZ.domain.INSTALL_REQUIRED.indexOf(x.item.id) >= 0; });

      root.innerHTML =
        '<div class="card card-pad">' +
          '<div class="between"><span class="order-id">' + UI.esc(order.id) + ' · 第 ' + batchNo + ' 批</span>' +
            UI.statusPill(order.status) + '</div>' +
          '<div class="order-meta">' + UI.esc(order.store) + ' · ' + UI.esc(supplier) + '</div>' +
          '<div class="divider"></div>' +
          '<div class="kv"><span class="k">配送方式</span><span class="v">' + UI.esc(SHIP[sp.method] || '-') +
            (sp.carrier ? ' · ' + UI.esc(sp.carrier) : '') + (sp.trackingNo ? ' · ' + UI.esc(sp.trackingNo) : '') + '</span></div>' +
          '<div class="kv"><span class="k">预计到达</span><span class="v">' + UI.esc(UI.dateTimeText(sp.estimatedAt) || '未填写') + '</span></div>' +
          '<div class="kv"><span class="k">收货地址</span><span class="v">' + UI.esc(order.address) + '</span></div>' +
          (deliveries.length > 1
            ? '<div class="field mt8"><div class="label">切换批次</div><select class="select" id="a-batch">' +
                deliveries.map(function (d) {
                  return '<option value="' + d.batchNo + '"' + (d.batchNo === batchNo ? ' selected' : '') + '>第 ' + d.batchNo + ' 批 · ' + BIZ.fmt.fullTime(d.at) + '</option>';
                }).join('') + '</select></div>'
            : '') +
        '</div>' +

        '<div class="card card-pad mt12">' +
          '<div class="label">验收结果</div>' +
          '<div class="radio-cards">' +
            '<label class="radio-card' + (result === 'pass' ? ' on' : '') + '" data-res="pass">' +
              '<span class="rd"></span><span class="grow"><span>验收合格</span><span class="d">规格、数量、外观与订单一致</span></span></label>' +
            '<label class="radio-card' + (result === 'issue' ? ' on' : '') + '" data-res="issue">' +
              '<span class="rd"></span><span class="grow"><span>异常反馈</span><span class="d">缺件、破损、规格不符等</span></span></label>' +
          '</div>' +
        '</div>' +

        '<div class="card card-pad mt12">' +
          '<div class="section-title mb8">本次验收数量</div>' +
          '<div class="ship-lines">' + lines.map(function (x) {
            return '<div class="ship-line"><span class="nm">' + UI.esc(x.item.name) +
              '<small>本批可验收 ' + x.left + ' / 共 ' + x.item.qty + '</small></span>' +
              '<input type="number" min="0" max="' + x.left + '" value="' + x.left + '" data-acc="' + UI.esc(x.item.id) + '"' + (result === 'issue' ? ' disabled' : '') + '>' +
              '<span class="u">' + UI.esc(x.item.unit || '件') + '</span></div>';
          }).join('') + '</div>' +
          '<div class="tiny muted mt8">部分到货时把数量改小，剩余数量等下一批验收。</div>' +
        '</div>' +

        '<div class="card card-pad mt12">' +
          '<div class="section-title mb8">现场留证</div>' +
          '<div class="photo-pick">' +
            (photo
              ? '<img class="photo-prev" src="' + photo + '" id="photo-prev">'
              : '<button class="photo-btn" id="photo-btn">' + UI.icon('camera') + '<span>拍照/上传</span></button>') +
            '<div class="photo-hint">验收照片用于对账争议留证。<br>演示环境会压缩后保存在本机。</div>' +
            '<input type="file" accept="image/*" capture="environment" id="photo-file" style="display:none">' +
          '</div>' +
          '<label class="check"><input type="checkbox" id="chk-spec" checked>已核对规格、数量及外观' + (result === 'issue' ? '（异常时可不勾选）' : '') + '</label>' +
          (needInstall
            ? '<label class="check"><input type="checkbox" id="chk-install">安装类物料已确认安装位置、牢固程度及完工效果</label>'
            : '') +
          '<div class="field mt8"><div class="label">备注</div>' +
            '<textarea class="textarea" id="a-note" maxlength="300" placeholder="' + (result === 'issue' ? '请描述异常情况（至少 4 个字）' : '选填') + '">' + UI.esc(formNote) + '</textarea></div>' +
        '</div>' +

        '<div class="actionbar">' +
          '<button class="btn ghost" id="btn-back-list">返回列表</button>' +
          '<button class="btn primary" id="btn-submit" style="flex:1.4">' + (result === 'pass' ? '确认验收' : '提交异常') + '</button>' +
        '</div>' +
        '<div class="action-spacer"></div>';

      const sel = root.querySelector('#a-batch');
      if (sel) sel.onchange = function () {
        batchNo = Number(sel.value);
