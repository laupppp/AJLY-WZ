        '<div class="order-meta">部门采购 · ' + UI.esc(orders[0].department || '') + ' · ' + UI.esc(orders[0].manager || '') + '</div>' +
        '<div class="order-items">' + UI.esc(orders.map(function (o) { return o.store; }).join('、')) + '</div>' +
        '<div class="between mt8"><span class="tiny muted">' + orders.length + ' 个配送点</span>' +
          '<span class="order-amt">¥' + UI.money(total) + '</span></div>' +
        '<div class="btn-group" style="margin-top:12px">' +
          '<button class="btn ghost sm" data-group-reject="' + UI.esc(groupId) + '">整批驳回</button>' +
          '<button class="btn primary sm" data-group-pass="' + UI.esc(groupId) + '">整批确认</button>' +
        '</div>' +
      '</div>';
    }

    const totalCount = list.length;

    root.innerHTML =
      '<div class="between" style="margin-bottom:10px">' +
        '<div><div class="section-title">待我审批</div>' +
        '<div class="tiny muted mt4">' + UI.esc(BIZ.perm.roleMeta(me.role).duty) + '</div></div>' +
        '<span class="pill ' + (totalCount ? 'warn' : 'good') + '">' + totalCount + ' 单待处理</span>' +
      '</div>' +
      (totalCount
        ? Object.keys(deptGroups).map(function (gid) { return groupCard(gid, deptGroups[gid]); }).join('') +
          single.sort(function (a, b) { return String(a.createdAt).localeCompare(String(b.createdAt)); }).map(orderCard).join('')
        : UI.empty('✅', '没有待审批事项', '订单提交后会按金额与预算规则自动流转到这里')) +
      '<div class="note-box mt16">审批规则：超出可用预算 → 战区预算追加 → 运营管理部核定（必要时从机动池追加或门店间调剂）；500 元以内免审批，500-2000 元战区审批，2000 元以上中台审批。</div>';

    function decide(orderId, pass) {
      const order = state.orders.filter(function (o) { return o.id === orderId; })[0];
      if (!order) return;
      try {
        App.mutate(function (st, ses) {
          return BIZ.domain.approveOrder(st, ses, { orderId: orderId, stage: order.status, pass: pass });
        });
        UI.toast(pass ? '已通过，流转至下一节点' : '已驳回', pass ? 'good' : '');
        App.reload();
      } catch (e) {
        if (e.code === 'FLEX_SHORT') {
          openGap(order, e.gap);
        } else {
          UI.toast(e.message, 'error', 2800);
        }
      }
    }

    function openGap(order, gap) {
      const shortRows = (gap.rows || []).filter(function (r) { return r.over; })
        .sort(function (a, b) { return b.needed - a.needed; });
      let key = shortRows[0] ? shortRows[0].key : '';
      let from = '';

      function candidatesFor(k) {
        return BIZ.domain.budgetSummary(state, { role: 'central', stores: [] })
          .filter(function (b) { return b.store !== order.store; })
          .map(function (b) {
            const it = (b.items || []).filter(function (x) { return x.key === k; })[0];
            return { store: b.store, free: it ? it.available : 0 };
          })
          .filter(function (c) { return c.free > 0; })
          .sort(function (a, b) { return b.free - a.free; })
          .slice(0, 6);
      }

      const itemRows = shortRows.map(function (r) {
        return '<div class="gap-row"><span class="k">' + UI.esc(r.name) + '</span>' +
          '<span class="v">¥' + UI.money(r.total) + '<span class="tiny muted"> · 可用 ¥' + UI.money(r.usable) +
          ' · 缺 ¥' + UI.money(r.needed) + '</span></span></div>';
      }).join('');

      const chips = shortRows.length > 1
        ? '<div class="gap-chips" id="g-chips">' + shortRows.map(function (r) {
            return '<button class="chip' + (r.key === key ? ' on' : '') + '" data-key="' + r.key + '">' +
              UI.esc(r.name) + ' · 缺 ¥' + UI.money(r.needed) + '</button>';
          }).join('') + '</div>'
        : '';

      const body =
        '<div class="gap-hero"><div class="t">机动预算不足，还差 ¥' + UI.money(gap.short) + '</div>' +
          '<div class="s">这笔单需要从机动池追加 ¥' + UI.money(gap.needed) + '，但余额只有 ¥' + UI.money(gap.flex) +
          '。下面任一方式补足后会自动完成核定。</div></div>' +

        '<div class="gap-rows">' +
          '<div class="gap-row"><span class="k">订单金额</span><span class="v">¥' + UI.money(gap.total) + '</span></div>' +
          itemRows +
          '<div class="gap-row"><span class="k">机动池余额</span><span class="v">¥' + UI.money(gap.flex) + '</span></div>' +
          '<div class="gap-row bad"><span class="k">仍缺</span><span class="v">¥' + UI.money(gap.short) + '</span></div>' +
        '</div>' +

        '<div class="gap-method">' +
          '<h4>方式一 · 追加机动预算</h4>' +
          '<p>增加公司预留额度，按科目缺口自动分配到对应费用项。真实场景应经预算负责人审批。</p>' +
          '<div class="bd"><div class="inline-input"><span class="c">¥</span>' +
            '<input id="g-amount" type="number" min="0" step="0.01" value="' + gap.short + '"></div>' +
            '<input class="input mt8" id="g-reason" maxlength="60" placeholder="用途说明，例如：门店开业活动专项（选填）">' +
            '<button class="btn soft block mt8" id="g-flex">追加 ¥<span id="g-amt-label">' + UI.money(gap.short) + '</span> 并核定</button>' +
          '</div>' +
        '</div>' +

        '<div class="gap-method">' +
          '<h4>方式二 · 从其他门店调剂同科目额度</h4>' +
          '<p>不增加公司总预算，把其他门店该科目的闲置额度划给本店，治理上更稳妥。</p>' +
          chips +
          '<div class="bd" id="g-move-wrap"></div>' +
        '</div>' +

        '<div class="note-box">单笔最多可核定 ¥' + UI.money(gap.maxSupport) + '（门店可用 + 机动池）。若两种方式都补不上，建议驳回，让门店按上限拆单或转专项采购。</div>';

      const s = UI.sheet({
        title: '预算核定缺口',
        sub: UI.esc(order.id) + ' · ' + UI.esc(order.store) + ' · 订单 ¥' + UI.money(order.total),
        body: body,
        actions: [
          { label: '稍后处理', cls: 'ghost' },
          { label: '驳回订单', cls: 'danger', onClick: function () { decide(order.id, false); } }
        ],
        mount: function (bodyEl) {
          const wrap = bodyEl.querySelector('#g-move-wrap');

          function renderMove() {
            const cands = candidatesFor(key);
            if (!from || !cands.some(function (c) { return c.store === from; })) {
              from = cands.length ? cands[0].store : '';
            }
            const need = (shortRows.filter(function (r) { return r.key === key; })[0] || {}).needed || gap.short;
            wrap.innerHTML = cands.length
              ? cands.map(function (c) {
                  return '<button class="store-pick' + (c.store === from ? ' on' : '') + '" data-from="' + UI.esc(c.store) + '">' +
                    '<span>' + UI.esc(c.store) + '</span>' +
                    '<span class="r">可调 ¥' + UI.money(c.free) + '</span></button>';
                }).join('') +
                '<div class="inline-input mt8"><span class="c">¥</span>' +
                  '<input id="g-move" type="number" min="0" step="0.01" value="' + Math.min(need, cands[0].free) + '"></div>' +
                '<button class="btn soft block mt8" id="g-transfer">调剂到 ' + UI.esc(order.store) + ' 并核定</button>'
              : '<div class="tiny muted">其他门店该科目当前没有可调结余，只能用方式一或驳回后让门店拆单。</div>';

            wrap.onclick = function (e) {
              const pick = e.target.closest('[data-from]');
              if (pick) {
                from = pick.dataset.from;
                wrap.querySelectorAll('[data-from]').forEach(function (x) {
                  x.classList.toggle('on', x.dataset.from === from);
                });
                return;
              }
              const btn = e.target.closest('#g-transfer');
              if (!btn) return;
              const amount = Number(wrap.querySelector('#g-move').value);
              if (!from) { UI.toast('请选择调出门店', 'error'); return; }
              try {
                App.mutate(function (st, ses) {
                  const res = BIZ.domain.transferStoreBudget(st, ses, from, order.store, amount, key);
                  Store.appendAudit([{
                    orderId: order.id, kind: 'budget', stage: 'budget-central', decision: '门店额度调剂',
                    role: '运营管理部（' + ses.id + '）', from: '', to: '',
                    note: res.from + ' → ' + res.to + '「' + res.item + '」¥' + UI.money(res.amount),
                    at: new Date().toISOString()
                  }]);
                  return BIZ.domain.approveOrder(st, ses, { orderId: order.id, stage: order.status, pass: true });
                });
                s.close();
                UI.toast('已调剂额度并完成核定', 'good');
                App.reload();
              } catch (err) {
                UI.toast(err.message, 'error', 2800);
              }
            };
          }

          const chipsEl = bodyEl.querySelector('#g-chips');
          if (chipsEl) {
            chipsEl.addEventListener('click', function (e) {
              const chip = e.target.closest('[data-key]');
              if (!chip) return;
              key = chip.dataset.key;
              chipsEl.querySelectorAll('[data-key]').forEach(function (x) {
                x.classList.toggle('on', x.dataset.key === key);
              });
              renderMove();
            });
          }

          renderMove();

          const amountInput = bodyEl.querySelector('#g-amount');
          amountInput.addEventListener('input', function () {
            bodyEl.querySelector('#g-amt-label').textContent = UI.money(Number(amountInput.value || 0));
          });

          bodyEl.querySelector('#g-flex').onclick = function () {
            const amount = Number(amountInput.value);
            const reason = bodyEl.querySelector('#g-reason').value.trim();
            try {
              App.mutate(function (st, ses) {
                const adj = BIZ.domain.adjustFlex(st, ses, amount, reason);
                Store.appendAudit([{
                  orderId: order.id, kind: 'budget', stage: 'budget-central', decision: '追加机动预算',
                  role: '运营管理部（' + ses.id + '）', from: '', to: '',
                  note: '机动池 ¥' + UI.money(adj.before) + ' → ¥' + UI.money(adj.after) + (reason ? '；用途：' + reason : ''),
                  at: new Date().toISOString()
                }]);
                return BIZ.domain.approveOrder(st, ses, { orderId: order.id, stage: order.status, pass: true });
              });
              s.close();
              UI.toast('已追加预算并完成核定', 'good');
              App.reload();
            } catch (err) {
              UI.toast(err.message, 'error', 2800);
            }
          };
        }
      });
    }

    root.addEventListener('click', function (e) {
      const pass = e.target.closest('[data-pass]');
      if (pass) { decide(pass.dataset.pass, true); return; }

      const reject = e.target.closest('[data-reject]');
      if (reject) {
        UI.confirm({
          title: '驳回这笔订单？',
          sub: '驳回后释放预算占用，门店需要重新调整后提交。',
          okText: '确认驳回', danger: true
        }).then(function (ok) { if (ok) decide(reject.dataset.reject, false); });
        return;
      }

      const gp = e.target.closest('[data-group-pass]');
      if (gp) {
        groupDecide(gp.dataset.groupPass, true);
        return;
      }

      const gr = e.target.closest('[data-group-reject]');
      if (gr) {
        UI.confirm({
          title: '整批驳回部门采购？',
          sub: '该批次下所有配送点都会变为已驳回。',
          okText: '整批驳回', danger: true
        }).then(function (ok) { if (ok) groupDecide(gr.dataset.groupReject, false); });
      }
    });

    function groupDecide(groupId, pass) {
      try {
        App.mutate(function (st, ses) {
          return BIZ.domain.approveDepartmentGroup(st, ses, groupId, pass);
        });
        UI.toast(pass ? '批次已确认，已发送供应商' : '批次已驳回', pass ? 'good' : '');
        App.reload();
      } catch (e) {
        UI.toast(e.message, 'error', 2800);
      }
    }
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/supplier.js ==== */
/* 供应商工作台（外部账号）：接单 / 拒单 / 分批发货 */
(function (Views) {
  const SHIP = BIZ.domain.SHIPPING_METHODS;

  Views.supplier = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;
    const supplier = me.supplier;

    if (me.role !== 'supplier') {
      root.innerHTML = UI.empty('🔐', '仅供应商账号可进入', '门店与内部角色请使用「采购下单 / 订单」等功能');
      return;
    }

    let tab = r.query.tab || 'pending';

    function mine() {
      return domain.visibleOrders(state, me).filter(function (o) {
        const rec = (o.supplierRecords || {})[supplier];
        // 已取消 / 已拒单不进供应商工作台，与小程序口径一致
        return rec && ['cancelled', 'rejected'].indexOf(o.status) < 0;
      }).sort(function (a, b) {
        return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
      });
    }

    // 每单只归一个页签：之前按 key 各自判断会「一单命中多个页签」，
    // 导致顶部数字与列表条数不符（如结算确认显示 9 单却只有 1 单）
    function classify(o) {
      const rec = o.supplierRecords[supplier] || {};
      // 验收完成后分项记录已是 accepted，但结算金额仍需双方确认，
      // 因此优先按订单状态分流到「结算确认」，不能简单归入「已完成」
      if (['settle-pending', 'settle-supplier', 'settle-disputed'].indexOf(o.status) >= 0) return 'settle';
      if (rec.status === 'pending') return 'pending';
      if (rec.status === 'issue') return 'issue';
      if (['accepted', 'delivered'].indexOf(rec.status) >= 0) return 'done';
      if (rec.status === 'shipping') return 'shipping';
      if (rec.status === 'confirmed') {
        return (rec.deliveries && rec.deliveries.length) ? 'shipping' : 'toship';
      }
      return 'pending';
    }

    function bucket(key) {
      return mine().filter(function (o) { return classify(o) === key; });
    }

    const TABS = [
      { key: 'pending', label: '待接单' },
      { key: 'issue', label: '异常' },
      { key: 'toship', label: '待发货' },
      { key: 'shipping', label: '配送中' },
      { key: 'settle', label: '结算确认' },
      { key: 'done', label: '已完成' }
    ];

    function myItems(o) {
      return (o.items || []).filter(function (x) { return x.supplier === supplier; });
    }

    function remaining(x) {
      return Math.max(0, Number(x.qty || 0) - Number(x.deliveredQty || 0));
    }

    function card(o) {
      const rec = o.supplierRecords[supplier];
      const items = myItems(o);
      const amount = items.reduce(function (s, x) { return s + Number(x.price || 0) * Number(x.qty || 0); }, 0);
      const toShip = items.reduce(function (s, x) { return s + remaining(x); }, 0);
      // 结算阶段以订单状态为准，避免"验收完就显示已完成"的误导
      const inSettle = ['settle-pending', 'settle-supplier', 'settle-disputed', 'accepted'].indexOf(o.status) >= 0;
      const pill = inSettle ? UI.statusPill(o.status) : UI.supplierPill(rec.status);
      return '<div class="card card-pad" style="margin-bottom:9px">' +
        '<div class="between"><span class="order-id">' + UI.esc(o.id) + '</span>' + pill + '</div>' +
        '<div class="order-meta">' + UI.esc(o.store || '') + ' · ' + UI.esc(o.receiver || '') + ' · ' + UI.esc(o.address || '') + '</div>' +
        items.slice(0, 4).map(function (x) {
          return '<div class="sup-item"><span>' + UI.esc(x.name) + '</span>' +
            '<span class="q">×' + x.qty + (remaining(x) > 0 && remaining(x) < x.qty ? '（待发 ' + remaining(x) + '）' : '') + '</span></div>';
        }).join('') +
        ((items.length > 4) ? '<div class="tiny muted">等 ' + items.length + ' 项</div>' : '') +
        (rec.issue ? '<div class="alert mt8">' + UI.icon('alert', 'sm') + '<span>' + UI.esc(rec.issue) + '</span></div>' : '') +
        '<div class="between" style="margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2)">' +
          '<span class="tiny muted">期望到货 ' + UI.esc(o.due || '待确认') + ' · 我的金额</span>' +
          '<span class="order-amt">¥' + UI.money(amount) + '</span></div>' +
        '<div class="btn-group" style="margin-top:10px">' +
          '<button class="btn ghost sm" data-view="' + UI.esc(o.id) + '">详情</button>' +
          (rec.status === 'pending'
            ? '<button class="btn danger sm" data-issue="' + UI.esc(o.id) + '">无法接单</button>' +
              '<button class="btn primary sm" data-ack="' + UI.esc(o.id) + '">确认接单</button>'
            : '') +
          (rec.status === 'issue'
            ? '<button class="btn soft sm" data-reopen="' + UI.esc(o.id) + '">撤回拒单</button>'
            : '') +
          (rec.status === 'confirmed' && toShip > 0
            ? '<button class="btn primary sm" data-ship="' + UI.esc(o.id) + '">登记发货</button>'
            : '') +
          (rec.status === 'shipping'
            ? '<button class="btn soft sm" data-view="' + UI.esc(o.id) + '">查看物流</button>'
            : '') +
          (o.status === 'settle-supplier'
            ? '<button class="btn primary sm" data-settle="' + UI.esc(o.id) + '">确认结算金额</button>'
            : o.status === 'accepted' || o.status === 'done'
              ? '<button class="btn ghost sm" data-settle="' + UI.esc(o.id) + '">查看结算</button>'
              : '') +
        '</div>' +
      '</div>';
    }

    function render() {
      const counts = {};
      TABS.forEach(function (t) { counts[t.key] = bucket(t.key).length; });

      root.innerHTML =
        '<div class="between" style="margin-bottom:10px">' +
          '<div><div class="section-title">' + UI.esc(supplier) + '</div>' +
          '<div class="tiny muted mt4">外部供应商账号 · 仅可接单、发货与对账确认</div></div>' +
          '<span class="pill amber">' + counts.pending + ' 单待接</span>' +
        '</div>' +
        '<div class="tab-seg" id="sup-tabs">' + TABS.map(function (t) {
          return '<button data-t="' + t.key + '" class="' + (tab === t.key ? 'on' : '') + '">' +
            t.label + (counts[t.key] ? ' ' + counts[t.key] : '') + '</button>';
        }).join('') + '</div>' +
        '<div id="sup-list"></div>' +
        '<div class="note-box mt16">发货请按实际交付数量登记，可分多批。订单在门店验收后才会进入「已完结」，发货本身只推进到「配送中」。</div>';

      const list = bucket(tab);
      root.querySelector('#sup-list').innerHTML = list.length
        ? list.map(card).join('')
        : UI.empty('🚚', '该分类暂无订单', tab === 'pending' ? '新订单会实时出现在这里' : '');

      root.querySelector('#sup-tabs').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-t]');
        if (!btn) return;
        tab = btn.dataset.t;
        render();
      });
    }

    function find(id) {
      return state.orders.filter(function (o) { return o.id === id; })[0];
    }

    function ack(orderId) {
      try {
        App.mutate(function (st, ses) {
          return BIZ.domain.supplierAck(st, ses, { orderId: orderId, action: 'confirm' });
        });
        UI.toast('已确认接单，请及时备货发货', 'good');
        App.go('/supplier?tab=toship');
      } catch (e) { UI.toast(e.message, 'error', 2800); }
    }

    function reject(orderId) {
      const s = UI.sheet({
        title: '反馈无法接单',
        sub: '请说明原因，采购方会看到并处理。',
        body: '<div class="field"><div class="label">原因<span class="req">*</span></div>' +
          '<textarea class="textarea" id="issue-reason" maxlength="300" placeholder="例如：该商品暂时缺货，预计 3 天后到货"></textarea></div>',
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: '提交', cls: 'primary', onClick: function (close, body) {
              const reason = body.querySelector('#issue-reason').value.trim();
              try {
                App.mutate(function (st, ses) {
                  return BIZ.domain.supplierAck(st, ses, { orderId: orderId, action: 'issue', reason: reason });
                });
                UI.toast('已反馈采购方', '');
                App.reload();
              } catch (e) { UI.toast(e.message, 'error', 2800); return false; }
            } }
        ]
      });
    }

    function reopen(orderId) {
      try {
        App.mutate(function (st, ses) {
          return BIZ.domain.reopenSupplierAck(st, ses, { orderId: orderId });
        });
        UI.toast('已撤回拒单，可重新确认接单', 'good');
        App.reload();
      } catch (e) { UI.toast(e.message, 'error', 2800); }
    }

    function ship(orderId) {
      const order = find(orderId);
      if (!order) return;
      const items = myItems(order).filter(function (x) { return remaining(x) > 0; });
      let method = 'express';

      function shippingFields() {
        if (method === 'express') {
          return '<div class="field-row"><div class="field"><div class="label">快递公司<span class="req">*</span></div>' +
            '<input class="input" id="s-carrier" maxlength="30" placeholder="顺丰 / 京东 / 德邦"></div>' +
            '<div class="field"><div class="label">运单号<span class="req">*</span></div>' +
            '<input class="input" id="s-track" maxlength="40" placeholder="至少 4 位"></div></div>';
        }
        if (method === 'lalamove' || method === 'runner') {
          return '<div class="field"><div class="label">平台订单号<span class="req">*</span></div>' +
            '<input class="input" id="s-track" maxlength="40" placeholder="平台订单号 / 取货码"></div>' +
            '<div class="field"><div class="label">联系人</div>' +
            '<input class="input" id="s-contact" maxlength="30" placeholder="司机 / 骑手联系电话（选填）"></div>';
        }
        return '<div class="field"><div class="label">配送安排 / 联系人<span class="req">*</span></div>' +
          '<input class="input" id="s-contact" maxlength="30" placeholder="例如：自有车辆，张师傅 138xxxx"></div>';
      }

      const body =
        '<div class="note-box mb12">' + UI.esc(order.store) + ' · ' + UI.esc(order.receiver) + ' · ' + UI.esc(order.address) + '</div>' +
        '<div class="field"><div class="label">配送方式<span class="req">*</span></div>' +
          '<div class="radio-cards" id="s-methods">' + Object.keys(SHIP).map(function (k) {
            return '<label class="radio-card' + (k === method ? ' on' : '') + '" data-m="' + k + '">' +
              '<span class="rd"></span><span class="grow"><span>' + UI.esc(SHIP[k]) + '</span>' +
              '<span class="d">' + (k === 'express' ? '需填写快递公司与运单号' : k === 'lalamove' ? '货拉拉等同城货运，需平台单号' : k === 'runner' ? '闪送/跑腿，需平台单号' : '自行安排车辆配送') + '</span></span></label>';
          }).join('') + '</div></div>' +
        '<div id="s-ship-fields">' + shippingFields() + '</div>' +
        '<div class="field"><div class="label">预计到达</div>' +
          '<input class="input" id="s-eta" type="date" min="' + UI.todayStr() + '"></div>' +
        '<div class="field"><div class="label">本次交付商品<span class="req">*</span></div>' +
          '<div class="ship-lines">' + items.map(function (x) {
            return '<div class="ship-line"><span class="nm">' + UI.esc(x.name) +
              '<small>待交付 ' + remaining(x) + ' / 共 ' + x.qty + '</small></span>' +
              '<input type="number" min="0" max="' + remaining(x) + '" value="' + remaining(x) + '" data-line="' + UI.esc(x.id) + '">' +
              '<span class="u">' + UI.esc(x.unit || '件') + '</span></div>';
          }).join('') + '</div></div>' +
        '<div class="field"><div class="label">发货备注</div>' +
          '<textarea class="textarea" id="s-note" maxlength="120" placeholder="选填，例如：分两箱发出"></textarea></div>' +
        '<div class="note-box">发货后订单进入「配送中」，门店验收后才会完结。</div>';

      const s = UI.sheet({
        title: '登记发货',
        sub: UI.esc(order.id) + ' · ' + UI.esc(order.store),
        body: body,
        actions: [
          { label: '取消', cls: 'ghost' },
          { label: '确认发货', cls: 'primary', onClick: function (close, bodyEl) {
              const lines = [];
              bodyEl.querySelectorAll('[data-line]').forEach(function (input) {
                const qty = Number(input.value);
                if (qty > 0) lines.push({ id: input.dataset.line, qty: qty });
              });
              const shipping = {
                method: method,
                carrier: (bodyEl.querySelector('#s-carrier') || {}).value || '',
                trackingNo: (bodyEl.querySelector('#s-track') || {}).value || '',
                contact: (bodyEl.querySelector('#s-contact') || {}).value || '',
                estimatedAt: (bodyEl.querySelector('#s-eta') || {}).value || ''
              };
              try {
                const res = App.mutate(function (st, ses) {
                  return BIZ.domain.supplierDeliver(st, ses, {
                    orderId: order.id, lines: lines, shipping: shipping,
                    note: (bodyEl.querySelector('#s-note') || {}).value || ''
                  });
                });
                UI.toast('第 ' + res.batchNo + ' 批已登记，订单进入配送中', 'good', 2400);
                App.go('/supplier?tab=shipping');
              } catch (e) {
                UI.toast(e.message, 'error', 2800);
                return false;
              }
            } }
        ],
        mount: function (bodyEl) {
          bodyEl.querySelector('#s-methods').addEventListener('click', function (e) {
            const card = e.target.closest('[data-m]');
            if (!card) return;
            method = card.dataset.m;
            bodyEl.querySelectorAll('[data-m]').forEach(function (x) {
              x.classList.toggle('on', x.dataset.m === method);
            });
            const fields = bodyEl.querySelector('#s-ship-fields');
            fields.innerHTML = shippingFields();
            fields.querySelectorAll('input').forEach(function (i) {
              if (i.type === 'number' || i.type === 'date') return;
            });
          });
        }
      });
    }

    render();

    root.addEventListener('click', function (e) {
      const v = e.target.closest('[data-view]');
      if (v) { App.go('/order/' + v.dataset.view); return; }

      const a = e.target.closest('[data-ack]');
      if (a) {
        UI.confirm({
          title: '确认接单？',
          sub: '接单后请按承诺时间备货，并登记配送信息。',
          okText: '确认接单'
        }).then(function (ok) { if (ok) ack(a.dataset.ack); });
        return;
      }

      const i = e.target.closest('[data-issue]');
      if (i) { reject(i.dataset.issue); return; }

      const re = e.target.closest('[data-reopen]');
      if (re) {
        UI.confirm({ title: '撤回拒单？', sub: '撤回后订单会恢复为待接单，可重新确认。', okText: '确认撤回' })
          .then(function (ok) { if (ok) reopen(re.dataset.reopen); });
        return;
      }

      const sh = e.target.closest('[data-ship]');
      if (sh) { ship(sh.dataset.ship); return; }

      // 结算金额共同确认：供应商确认 / 查看结算明细
      const se = e.target.closest('[data-settle]');
      if (se) { App.go('/settle/' + se.dataset.settle); }
    });
  };
})(window.Views);

</script>
<script>
/* ==== js/pages/accept.js ==== */
/* 收货验收：按配送批次验收、拍照留证、异常反馈 */
(function (Views) {
  const SHIP = BIZ.domain.SHIPPING_METHODS;

  function orderById(state, id) {
    return state.orders.filter(function (o) { return o.id === id; })[0];
  }

  Views.accept = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;

    if (r.params[0]) {
      renderForm(root, r, ctx);
      return;
    }

    const list = domain.pendingAcceptOrders(state, me);
    const groups = [];

    list.forEach(function (order) {
      Object.keys(order.supplierRecords || {}).forEach(function (supplier) {
        const rec = order.supplierRecords[supplier];
        (rec.deliveries || []).forEach(function (d) {
          let avail;
          try { avail = domain.batchAvailability(order, supplier, d.batchNo); } catch (e) { return; }
          const total = Object.keys(avail.remaining).reduce(function (s, k) { return s + avail.remaining[k]; }, 0);
          if (total > 0) groups.push({ order: order, supplier: supplier, delivery: d, remaining: avail.remaining, total: total });
        });
      });
    });

    if (!groups.length) {
      root.innerHTML = UI.empty('📷', '没有待验收的批次', '供应商发货后，这里会出现待验收记录');
      return;
    }

    root.innerHTML =
      '<div class="between" style="margin-bottom:10px">' +
        '<div><div class="section-title">待验收</div><div class="tiny muted mt4">按配送批次逐批验收，支持部分验收</div></div>' +
        '<span class="pill warn">' + groups.length + ' 个批次</span>' +
      '</div>' +
      groups.map(function (g) {
        const sp = g.delivery.shipping || {};
        return '<a class="card card-pad" style="margin-bottom:9px;display:block" href="#/accept/' + UI.esc(g.order.id) +
          '?supplier=' + encodeURIComponent(g.supplier) + '&batch=' + g.delivery.batchNo + '">' +
          '<div class="between"><span class="order-id">' + UI.esc(g.order.id) + '</span>' +
            '<span class="pill info">第 ' + g.delivery.batchNo + ' 批 · 待验收</span></div>' +
          '<div class="order-meta">' + UI.esc(g.order.store) + ' · ' + UI.esc(g.supplier) + '</div>' +
          '<div class="order-items">' + (g.delivery.lines || []).map(function (l) {
            return l.name + '×' + l.qty;
          }).join('、') + '</div>' +
          '<div class="order-foot">' +
            '<span class="tiny muted">' + UI.esc(SHIP[sp.method] || '') + (sp.trackingNo ? ' · ' + UI.esc(sp.trackingNo) : '') + '</span>' +
            '<span class="pill good" style="margin-left:auto">待验收 ' + g.total + ' 件</span>' +
          '</div>' +
        '</a>';
      }).join('');
  };

  function renderForm(root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;
    const order = orderById(state, r.params[0]);

    if (!order) {
      root.innerHTML = UI.empty('🔒', '订单不存在', '');
      return;
    }
    if (!domain.canAcceptOrder(order, me)) {
      root.innerHTML = UI.empty('🔒', '当前身份不能验收这笔订单', '门店单由收货门店验收，总部配送由采购部门验收');
      return;
    }

    const supplier = r.query.supplier || Object.keys(order.supplierRecords || {})[0];
    const rec = (order.supplierRecords || {})[supplier];
    if (!rec) {
      root.innerHTML = UI.empty('🚚', '找不到该供应商的配送记录', '');
      return;
    }
    const deliveries = rec.deliveries || [];
    if (!deliveries.length) {
      root.innerHTML = UI.empty('🚚', '该供应商还没有发货记录', '');
      return;
    }

    let batchNo = Number(r.query.batch || deliveries[deliveries.length - 1].batchNo);
    let delivery = deliveries.filter(function (d) { return d.batchNo === batchNo; })[0] || deliveries[deliveries.length - 1];
    batchNo = delivery.batchNo;

    let avail = domain.batchAvailability(order, supplier, batchNo);
    let photo = '';
    let result = 'pass';

    function render() {
      const sp = delivery.shipping || {};
      const lines = Object.keys(avail.remaining).filter(function (id) {
        return avail.remaining[id] > 0;
      }).map(function (id) {
        return { item: order.items.filter(function (x) { return x.id === id; })[0], left: avail.remaining[id] };
      }).filter(function (x) { return x.item; });

      const needInstall = lines.some(function (x) { return BIZ.domain.INSTALL_REQUIRED.indexOf(x.item.id) >= 0; });

      root.innerHTML =
        '<div class="card card-pad">' +
          '<div class="between"><span class="order-id">' + UI.esc(order.id) + ' · 第 ' + batchNo + ' 批</span>' +
            UI.statusPill(order.status) + '</div>' +
          '<div class="order-meta">' + UI.esc(order.store) + ' · ' + UI.esc(supplier) + '</div>' +
          '<div class="divider"></div>' +
          '<div class="kv"><span class="k">配送方式</span><span class="v">' + UI.esc(SHIP[sp.method] || '-') +
            (sp.carrier ? ' · ' + UI.esc(sp.carrier) : '') + (sp.trackingNo ? ' · ' + UI.esc(sp.trackingNo) : '') + '</span></div>' +
          '<div class="kv"><span class="k">预计到达</span><span class="v">' + UI.esc(UI.dateTimeText(sp.estimatedAt) || '未填写') + '</span></div>' +
          '<div class="kv"><span class="k">收货地址</span><span class="v">' + UI.esc(order.address) + '</span></div>' +
          (deliveries.length > 1
            ? '<div class="field mt8"><div class="label">切换批次</div><select class="select" id="a-batch">' +
                deliveries.map(function (d) {
                  return '<option value="' + d.batchNo + '"' + (d.batchNo === batchNo ? ' selected' : '') + '>第 ' + d.batchNo + ' 批 · ' + BIZ.fmt.fullTime(d.at) + '</option>';
                }).join('') + '</select></div>'
            : '') +
        '</div>' +

        '<div class="card card-pad mt12">' +
          '<div class="label">验收结果</div>' +
          '<div class="radio-cards">' +
            '<label class="radio-card' + (result === 'pass' ? ' on' : '') + '" data-res="pass">' +
              '<span class="rd"></span><span class="grow"><span>验收合格</span><span class="d">规格、数量、外观与订单一致</span></span></label>' +
            '<label class="radio-card' + (result === 'issue' ? ' on' : '') + '" data-res="issue">' +
              '<span class="rd"></span><span class="grow"><span>异常反馈</span><span class="d">缺件、破损、规格不符等</span></span></label>' +
          '</div>' +
        '</div>' +

        '<div class="card card-pad mt12">' +
          '<div class="section-title mb8">本次验收数量</div>' +
          '<div class="ship-lines">' + lines.map(function (x) {
            return '<div class="ship-line"><span class="nm">' + UI.esc(x.item.name) +
              '<small>本批可验收 ' + x.left + ' / 共 ' + x.item.qty + '</small></span>' +
              '<input type="number" min="0" max="' + x.left + '" value="' + x.left + '" data-acc="' + UI.esc(x.item.id) + '"' + (result === 'issue' ? ' disabled' : '') + '>' +
              '<span class="u">' + UI.esc(x.item.unit || '件') + '</span></div>';
          }).join('') + '</div>' +
          '<div class="tiny muted mt8">部分到货时把数量改小，剩余数量等下一批验收。</div>' +
        '</div>' +

        '<div class="card card-pad mt12">' +
          '<div class="section-title mb8">现场留证</div>' +
          '<div class="photo-pick">' +
            (photo
              ? '<img class="photo-prev" src="' + photo + '" id="photo-prev">'
              : '<button class="photo-btn" id="photo-btn">' + UI.icon('camera') + '<span>拍照/上传</span></button>') +
            '<div class="photo-hint">验收照片用于对账争议留证。<br>演示环境会压缩后保存在本机。</div>' +
            '<input type="file" accept="image/*" capture="environment" id="photo-file" style="display:none">' +
          '</div>' +
          '<label class="check"><input type="checkbox" id="chk-spec" checked>已核对规格、数量及外观' + (result === 'issue' ? '（异常时可不勾选）' : '') + '</label>' +
          (needInstall
            ? '<label class="check"><input type="checkbox" id="chk-install">安装类物料已确认安装位置、牢固程度及完工效果</label>'
            : '') +
          '<div class="field mt8"><div class="label">备注</div>' +
            '<textarea class="textarea" id="a-note" maxlength="300" placeholder="' + (result === 'issue' ? '请描述异常情况（至少 4 个字）' : '选填') + '">' + UI.esc(formNote) + '</textarea></div>' +
        '</div>' +

        '<div class="actionbar">' +
          '<button class="btn ghost" id="btn-back-list">返回列表</button>' +
          '<button class="btn primary" id="btn-submit" style="flex:1.4">' + (result === 'pass' ? '确认验收' : '提交异常') + '</button>' +
        '</div>' +
        '<div class="action-spacer"></div>';

      const sel = root.querySelector('#a-batch');
      if (sel) sel.onchange = function () {
        batchNo = Number(sel.value);
        delivery = deliveries.filter(function (d) { return d.batchNo === batchNo; })[0];
        avail = domain.batchAvailability(order, supplier, batchNo);
        formNote = root.querySelector('#a-note') ? root.querySelector('#a-note').value : '';
        render();
      };

      root.querySelectorAll('[data-res]').forEach(function (el) {
        el.addEventListener('click', function () {
          result = el.dataset.res;
          formNote = root.querySelector('#a-note') ? root.querySelector('#a-note').value : '';
          render();
        });
      });

      const photoBtn = root.querySelector('#photo-btn');
      const file = root.querySelector('#photo-file');
      if (photoBtn) photoBtn.onclick = function () { file.click(); };
      if (file) file.onchange = function () {
        const f = file.files && file.files[0];
        if (!f) return;
        UI.compressImage(f, 900, 0.72).then(function (data) {
          photo = data;
          render();
        }).catch(function (e) { UI.toast(e.message, 'error'); });
      };

      const prev = root.querySelector('#photo-prev');
      if (prev) prev.onclick = function () {
        UI.sheet({
          title: '验收照片',
          body: '<img src="' + photo + '" style="width:100%;border-radius:12px">',
          actions: [{ label: '重新拍摄', cls: 'ghost', onClick: function () { photo = ''; render(); } }]
        });
      };

      root.querySelector('#btn-back-list').onclick = function () { App.go('/accept'); };
      root.querySelector('#btn-submit').onclick = function () { submit(); };
    }

    let formNote = '';

    function submit() {
      const note = root.querySelector('#a-note') ? root.querySelector('#a-note').value.trim() : '';
      const specChecked = root.querySelector('#chk-spec') ? root.querySelector('#chk-spec').checked : false;
      const installChecked = root.querySelector('#chk-install') ? root.querySelector('#chk-install').checked : false;

      if (result === 'pass' && !specChecked) { UI.toast('请先确认规格、数量及外观已核对', 'error'); return; }
      if (result === 'issue' && note.length < 4) { UI.toast('请填写至少 4 个字的异常情况', 'error'); return; }

      const lines = [];
      root.querySelectorAll('[data-acc]').forEach(function (input) {
        const qty = Number(input.value);
        if (qty > 0) lines.push({ id: input.dataset.acc, qty: qty });
      });
      if (result === 'pass' && !lines.length) { UI.toast('请填写至少一项合格数量', 'error'); return; }

      const evidenceId = 'EV-' + Date.now().toString(36);

      const doSubmit = function (allowNoPhoto) {
        try {
          const res = App.mutate(function (st, ses) {
            return BIZ.domain.acceptDelivery(st, ses, {
              orderId: order.id,
              supplier: supplier,
              batchNo: batchNo,
              result: result,
              lines: lines,
              specChecked: specChecked,
              installChecked: installChecked,
              prove: true,
              evidenceId: evidenceId,
              photoPath: photo ? ('evidence:' + evidenceId) : '',
              allowNoPhoto: allowNoPhoto,
              note: note
            });
          });
          Store.addEvidence(Object.assign({}, res.evidence, { filePath: photo }));
          // 全部验收完成 → 直接引导去填写结算金额，避免门店不知道下一步在哪
          const settleReady = res.order && res.order.status === 'settle-pending';
          if (result === 'pass' && settleReady) {
            UI.toast('验收完成，请确认结算金额', 'good', 2400);
            App.go('/settle/' + order.id);
          } else {
            UI.toast(result === 'pass' ? '验收完成' : '异常已反馈', result === 'pass' ? 'good' : '');
            App.go('/order/' + order.id);
          }
        } catch (e) {
          UI.toast(e.message, 'error', 2800);
        }
      };

      if (!photo) {
        UI.confirm({
          title: '没有验收照片',
          sub: '现场留证是默认要求。演示环境若无法调用相机，可以选择无照片验收（会标记为演示无照片）。',
          okText: '无照片验收'
        }).then(function (ok) { if (ok) doSubmit(true); });
      } else {
        doSubmit(false);
      }
    }

    render();
  }
})(window.Views);

</script>
<script>
/* ==== js/pages/reports.js ==== */
/* 统计看板与统一对账 */
(function (Views) {
  const RECON_STATUS = {
    'supplier-pending': { label: '待供应商确认', cls: 'warn' },
    'supplier-confirmed': { label: '已确认待锁定', cls: 'info' },
    'locked': { label: '已锁定', cls: 'good' },
    'disputed': { label: '有差异', cls: 'bad' }
  };

  Views.reports = function (root, r, ctx) {
    const domain = BIZ.domain;
    const me = ctx.me;
    const state = ctx.state;

    const budgets = domain.budgetSummary(state, me);
    const report = domain.reportSummary(state);
    const depts = me.role === 'central' ? domain.departmentSummary(state) : [];

    const tabs = [];
    if (budgets.length) tabs.push({ key: 'budget', label: '预算占用' });
    if (me.role !== 'supplier') tabs.push({ key: 'zone', label: '战区金额' });
    if (me.role === 'central') tabs.push({ key: 'dept', label: '部门' });
    tabs.push({ key: 'supplier', label: '供应商' });
    if (me.role === 'central' || me.role === 'supplier') tabs.push({ key: 'recon', label: '对账' });

    let tab = r.query.tab && tabs.some(function (t) { return t.key === r.query.tab; }) ? r.query.tab : tabs[0].key;
    if (me.role === 'supplier' && r.query.tab !== 'supplier') tab = r.query.tab === 'recon' ? 'recon' : tabs[0].key;

    function budgetTable() {
      if (!budgets.length) return UI.empty('📊', '当前身份无预算视图', '');
      const keys = (budgets[0].items || []).map(function (i) { return i.key; });
      const names = (budgets[0].items || []).map(function (i) { return i.name; });
      const itemTotal = function (idx, f) {
        return budgets.reduce(function (s, b) {
          const it = (b.items || [])[idx];
          return s + (it ? it[f] : 0);
        }, 0);
      };
      const cards = names.map(function (name, i) {
        const budget = itemTotal(i, 'budget');
        const used = itemTotal(i, 'used');
        const pct = budget > 0 ? Math.min(100, Math.round(used / budget * 100)) : 0;
        const tone = pct >= 90 ? 'bad' : pct >= 70 ? 'warn' : '';
        return '<div class="bcat">' +
          '<div class="bcat-name">' + UI.esc(name) + '</div>' +
          '<div class="bcat-amt">¥' + UI.money(used) + '</div>' +
          '<div class="bcat-sub">/ ¥' + UI.money(budget) + ' · ' + pct + '%</div>' +
          '<div class="bar" style="height:4px"><i class="' + tone + '" style="width:' + pct + '%"></i></div>' +
        '</div>';
      }).join('');

      const rows = budgets.map(function (b) {
        const tone = b.usedPct >= 90 ? 'bad' : b.usedPct >= 70 ? 'warn' : '';
        const cells = keys.map(function (k) {
          const it = (b.items || []).filter(function (x) { return x.key === k; })[0] || { used: 0, budget: 0, usedPct: 0 };
          const t = it.usedPct >= 90 ? 'bad' : it.usedPct >= 70 ? 'warn' : '';
          return '<td class="r"><span class="mono">' + UI.money(it.used) + '</span>' +
            '<div class="tiny muted">/ ' + UI.money(it.budget) + ' · ' + it.usedPct + '%</div>' +
            '<div class="bar" style="height:3px;margin-top:3px"><i class="' + t + '" style="width:' + it.usedPct + '%"></i></div></td>';
        }).join('');
        return '<tr><td><span class="strong">' + UI.esc(b.store) + '</span><div class="tiny muted">' +
            b.rooms + ' 间房 · ' + UI.esc(b.zone) + '</div></td>' + cells +
          '<td class="r strong">' + UI.money(b.used) + '<div class="tiny muted">/ ' + UI.money(b.budget) + '</div></td>' +
          '<td class="r">' + UI.money(b.available) + '</td>' +
          '<td><div class="bar" style="height:5px"><i class="' + tone + '" style="width:' + b.usedPct + '%"></i></div>' +
            '<div class="tiny muted" style="text-align:right">' + b.usedPct + '%</div></td></tr>';
      }).join('');

      const totalCells = keys.map(function (k, i) {
        return '<td class="r">' + UI.money(itemTotal(i, 'used')) + '<div class="tiny muted">/ ' + UI.money(itemTotal(i, 'budget')) + '</div></td>';
      }).join('');

      return '<div class="card card-pad">' +
        '<div class="between mb8"><span class="section-title">门店费用预算</span>' +
          (me.role === 'central'
            ? '<a class="pill" href="#/budget">调整预算参数</a>'
            : '<span class="tiny muted">' + budgets.length + ' 家门店</span>') + '</div>' +
        '<div class="bcat-row">' + cards + '</div>' +
        '<div class="table-scroll"><table class="tbl"><thead><tr>' +
          '<th>门店</th>' + names.map(function (n) { return '<th class="r">' + UI.esc(n) + '</th>'; }).join('') +
          '<th class="r">合计</th><th class="r">可用</th><th style="width:76px">占用率</th>' +
        '</tr></thead><tbody>' + rows +
        '<tr class="tot"><td>合计</td>' + totalCells +
          '<td class="r">' + UI.money(budgets.reduce(function (s, b) { return s + b.used; }, 0)) + '</td>' +
          '<td class="r">' + UI.money(budgets.reduce(function (s, b) { return s + b.available; }, 0)) + '</td><td></td></tr>' +
        '</tbody></table></div>' +
        '<div class="note-box mt12">额度 = 管理房间数 × 科目系数（当前每店 ' + budgets[0].rooms +
          ' 间房、每科目 10 元/间）；机动池追加与门店间调剂计入「已核定额度」，不影响基数。</div>' +
      '</div>';
    }

    // 战区金额：门店单按战区汇总（部门采购在「部门」页单独看），并叠加该战区预算占用
    function zoneTable() {
      const orders = domain.visibleOrders(state, me);
      const agg = {};
      orders.forEach(function (o) {
        if (o.purchaseType === 'department') return;
        if (['rejected', 'cancelled'].indexOf(o.status) >= 0) return;
        const key = o.zone || '未归属战区';
        if (!agg[key]) agg[key] = { key: key, orders: 0, requested: 0, accepted: 0, reconciled: 0, stores: {} };
        const a = agg[key];
        a.orders += 1;
        a.stores[o.store] = 1;
        a.requested += Number(o.total || 0);
        (o.items || []).forEach(function (line) {
          const price = Number(line.price || 0);
          a.accepted += Number(line.accepted || 0) * price;
          a.reconciled += Number(line.reconciled || 0) * price;
        });
      });
      const budgetByZone = {};
      budgets.forEach(function (b) {
        if (!b.zone) return;
        if (!budgetByZone[b.zone]) budgetByZone[b.zone] = { budget: 0, used: 0, stores: 0 };
        budgetByZone[b.zone].budget += Number(b.budget || 0);
        budgetByZone[b.zone].used += Number(b.used || 0);
        budgetByZone[b.zone].stores += 1;
      });
      const zones = Object.keys(agg).map(function (k) {
        const a = agg[k];
        const b = budgetByZone[k] || { budget: 0, used: 0, stores: 0 };
        return {
          key: k, stores: b.stores || Object.keys(a.stores).length, orders: a.orders,
          requested: a.requested, accepted: a.accepted, reconciled: a.reconciled,
          pending: Math.max(0, a.requested - a.accepted),
          rate: a.requested > 0 ? Math.round(a.accepted / a.requested * 100) : 0,
          budget: b.budget, usedBudget: b.used,
          usedPct: b.budget > 0 ? Math.min(100, Math.round(b.used / b.budget * 100)) : 0
        };
      }).sort(function (x, y) { return y.requested - x.requested; });
      const sum = function (f) { return zones.reduce(function (s, z) { return s + z[f]; }, 0); };
      const tone = function (pct) { return pct >= 90 ? 'bad' : pct >= 75 ? 'warn' : ''; };

      return '<div class="card card-pad">' +
        '<div class="between mb8"><span class="section-title">战区金额</span>' +
          '<span class="tiny muted">' + zones.length + ' 个战区 · ' + sum('stores') + ' 家门店 · ' + sum('orders') + ' 笔门店单</span></div>' +
        '<div class="zone-card mb12">' + zones.map(function (z) {
          return '<div class="zone-box"><div class="zb-name">' + UI.esc(z.key) + '</div>' +
            '<div class="zb-amt">¥' + UI.money(z.requested) + '</div>' +
            '<div class="zb-sub">' + z.stores + ' 家门店 · ' + z.orders + ' 单 · 已验收 ' + z.rate + '%</div>' +
            '<div class="bar" style="height:4px;margin-top:6px"><i class="' + tone(z.usedPct) + '" style="width:' + z.usedPct + '%"></i></div>' +
            '<div class="zb-sub">预算占用 ' + z.usedPct + '%（¥' + UI.money(z.usedBudget) + ' / ¥' + UI.money(z.budget) + '）</div>' +
          '</div>';
        }).join('') + '</div>' +
        '<div class="table-scroll"><table class="tbl"><thead><tr>' +
          '<th>战区</th><th class="r">门店</th><th class="r">订单</th><th class="r">申请</th>' +
          '<th class="r">已验收</th><th class="r">待验收</th><th class="r">已对账</th>' +
        '</tr></thead><tbody>' +
        zones.map(function (z) {
          return '<tr><td><span class="strong">' + UI.esc(z.key) + '</span></td>' +
            '<td class="r">' + z.stores + '</td><td class="r">' + z.orders + '</td>' +
            '<td class="r">' + UI.money(z.requested) + '</td><td class="r">' + UI.money(z.accepted) + '</td>' +
            '<td class="r">' + UI.money(z.pending) + '</td><td class="r">' + UI.money(z.reconciled) + '</td></tr>';
        }).join('') +
        '<tr class="tot"><td>合计</td><td class="r">' + sum('stores') + '</td><td class="r">' + sum('orders') + '</td>' +
          '<td class="r">' + UI.money(sum('requested')) + '</td><td class="r">' + UI.money(sum('accepted')) + '</td>' +
          '<td class="r">' + UI.money(sum('pending')) + '</td><td class="r">' + UI.money(sum('reconciled')) + '</td></tr>' +
        '</tbody></table></div>' +
        '<div class="note-box mt12">门店单按收货门店所属战区汇总；部门采购单在「部门」页单独统计，不计入战区金额。预算占用按各门店三科目额度合计计算。</div>' +
      '</div>';
    }

    function deptTable() {
      if (!depts.length) return '';
      return '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">部门采购统计</div>' +
        '<div class="table-scroll"><table class="tbl"><thead><tr>' +
          '<th>部门</th><th class="r">批次</th><th class="r">申请</th><th class="r">已验收</th><th class="r">已对账</th>' +
        '</tr></thead><tbody>' +
        depts.filter(function (d) { return d.orders > 0; }).map(function (d) {
          return '<tr><td>' + UI.esc(d.department) + '</td><td class="r">' + d.orders + '</td>' +
            '<td class="r">' + UI.money(d.requested) + '</td><td class="r">' + UI.money(d.accepted) + '</td>' +
            '<td class="r">' + UI.money(d.reconciled) + '</td></tr>';
        }).join('') +
        '</tbody></table></div></div>';
    }

    function supplierTable() {
      return '<div class="card card-pad">' +
        '<div class="section-title mb8">供应商金额统计</div>' +
        (report.bySupplier.length
          ? '<div class="table-scroll"><table class="tbl"><thead><tr>' +
              '<th>供应商</th><th class="r">订单</th><th class="r">申请</th><th class="r">已验收</th><th class="r">已对账</th>' +
            '</tr></thead><tbody>' +
            report.bySupplier.map(function (s) {
              return '<tr><td>' + UI.esc(s.key) + '</td><td class="r">' + s.orders + '</td>' +
                '<td class="r">' + UI.money(s.requested) + '</td><td class="r">' + UI.money(s.accepted) + '</td>' +
                '<td class="r">' + UI.money(s.reconciled) + '</td></tr>';
            }).join('') +
            '</tbody></table></div>'
          : UI.empty('🧾', '暂无供应商数据', '')) +
      '</div>';
    }

    function reconPanel() {
      const recons = (state.recons || []).filter(function (x) {
        return me.role !== 'supplier' || x.supplier === me.supplier;
      });
      const canCreate = me.role === 'central';

      return (canCreate
        ? '<div class="card card-pad mb12">' +
            '<div class="section-title mb8">生成对账单</div>' +
            '<div class="field-row">' +
              '<div class="field"><div class="label">供应商</div><select class="select" id="rc-supplier">' +
                BIZ.seed.SUPPLIERS.map(function (s) { return '<option>' + UI.esc(s) + '</option>'; }).join('') +
              '</select></div>' +
              '<div class="field"><div class="label">对账周期</div>' +
                '<input class="input" id="rc-period" value="' + (new Date().getFullYear()) + '-' + ('0' + (new Date().getMonth() + 1)).slice(-2) + '"></div>' +
            '</div>' +
            '<button class="btn soft block" id="rc-create">按已验收数量生成</button>' +
            '<div class="tiny muted mt8">口径：仅统计已验收、尚未对账的数量。</div>' +
          '</div>'
        : '') +
      '<div class="card card-pad">' +
        '<div class="between mb8"><span class="section-title">对账单</span>' +
          '<span class="tiny muted">' + recons.length + ' 张</span></div>' +
        (recons.length
          ? recons.map(function (rec) {
              const st = RECON_STATUS[rec.status] || { label: rec.status, cls: 'gray' };
              return '<div class="rec-block">' +
                '<div class="between"><span class="strong">' + UI.esc(rec.id) + ' · ' + UI.esc(rec.supplier) + '</span>' +
                  '<span class="pill ' + st.cls + '">' + st.label + '</span></div>' +
                '<div class="tiny muted mt4">周期 ' + UI.esc(rec.period) + ' · ' + rec.lines.length + ' 条明细 · ' +
                  UI.esc(BIZ.fmt.fullTime(rec.createdAt)) + '</div>' +
                '<div class="between mt8"><span class="money">¥' + UI.money(rec.total) + '</span>' +
                  (me.role === 'supplier' && rec.status === 'supplier-pending'
                    ? '<span class="btn-group"><button class="btn ghost xs" data-dispute="' + UI.esc(rec.id) + '">有差异</button>' +
                      '<button class="btn primary xs" data-confirm="' + UI.esc(rec.id) + '">确认</button></span>'
                    : me.role === 'central' && rec.status === 'supplier-confirmed'
                      ? '<button class="btn primary xs" data-lock="' + UI.esc(rec.id) + '">锁定对账单</button>'
                      : '') +
                '</div>' +
                (rec.disputeNote ? '<div class="tiny" style="color:var(--bad);margin-top:6px">差异说明：' + UI.esc(rec.disputeNote) + '</div>' : '') +
              '</div>';
            }).join('')
          : UI.empty('🧾', '还没有对账单', canCreate ? '选择供应商后生成第一张' : '等待运营管理部发起')) +
      '</div>';
    }

    function renderBody() {
      const host = root.querySelector('#report-body');
      if (tab === 'budget') host.innerHTML = budgetTable();
      else if (tab === 'zone') host.innerHTML = zoneTable() + deptTable();
      else if (tab === 'dept') host.innerHTML = deptTable() || UI.empty('🏢', '暂无部门采购数据', '');
      else if (tab === 'supplier') host.innerHTML = supplierTable();
      else host.innerHTML = reconPanel();

      root.querySelectorAll('#tabs button').forEach(function (b) {
        b.classList.toggle('on', b.dataset.t === tab);
      });

      if (tab === 'recon') {
        const create = host.querySelector('#rc-create');
        if (create) create.onclick = function () {
          const supplier = host.querySelector('#rc-supplier').value;
          const period = host.querySelector('#rc-period').value.trim();
          try {
            const res = App.mutate(function (st, ses) {
              return BIZ.domain.createReconciliation(st, ses, { supplier: supplier, period: period });
            });
            UI.toast('已生成 ' + res.recon.id + '，¥' + UI.money(res.recon.total), 'good', 2600);
            renderBody();
          } catch (e) { UI.toast(e.message, 'error', 2800); }
        };
      }
    }

    root.innerHTML =
      '<div class="tab-seg" id="tabs">' + tabs.map(function (t) {
        return '<button data-t="' + t.key + '" class="' + (tab === t.key ? 'on' : '') + '">' + t.label + '</button>';
      }).join('') + '</div>' +
      '<div id="report-body"></div>';

    root.querySelector('#tabs').addEventListener('click', function (e) {
      const b = e.target.closest('[data-t]');
      if (!b) return;
      tab = b.dataset.t;
      renderBody();
    });

    renderBody();

    root.addEventListener('click', function (e) {
      const confirmBtn = e.target.closest('[data-confirm]');
      if (confirmBtn) {
        try {
          App.mutate(function (st, ses) {
            return BIZ.domain.reconAction(st, ses, { reconId: confirmBtn.dataset.confirm, action: 'confirm' });
          });
          UI.toast('已确认对账单', 'good');
          renderBody();
        } catch (err) { UI.toast(err.message, 'error', 2600); }
        return;
      }

      const lockBtn = e.target.closest('[data-lock]');
      if (lockBtn) {
        UI.confirm({ title: '锁定这张对账单？', sub: '锁定后金额进入已对账，订单可完结。', okText: '确认锁定' })
          .then(function (ok) {
            if (!ok) return;
            try {
              App.mutate(function (st, ses) {
                return BIZ.domain.reconAction(st, ses, { reconId: lockBtn.dataset.lock, action: 'lock' });
              });
              UI.toast('已锁定', 'good');
              renderBody();
            } catch (err) { UI.toast(err.message, 'error', 2600); }
          });
        return;
      }

      const disputeBtn = e.target.closest('[data-dispute]');
      if (disputeBtn) {
        UI.sheet({
          title: '反馈对账差异',
          sub: '请说明差异原因，运营管理部会核查。',
          body: '<div class="field"><div class="label">差异说明<span class="req">*</span></div>' +
            '<textarea class="textarea" id="d-note" maxlength="300" placeholder="例如：SQ-0003 少计 2 件"></textarea></div>',
          actions: [
            { label: '取消', cls: 'ghost' },
            { label: '提交', cls: 'primary', onClick: function (close, body) {
                const note = body.querySelector('#d-note').value.trim();
                try {
                  App.mutate(function (st, ses) {
                    return BIZ.domain.reconAction(st, ses, { reconId: disputeBtn.dataset.dispute, action: 'dispute', note: note });
                  });
                  UI.toast('已提交差异说明', 'good');
                  renderBody();
                } catch (err) { UI.toast(err.message, 'error', 2600); return false; }
              } }
          ]
        });
      }
    });
  };
})(window.Views);

</script>
<script>

        '<div class="kv"><span class="k">账号 ID</span><span class="v mono">' + UI.esc(me.id) + '</span></div>' +
        (me.role === 'supplier'
          ? '<div class="kv"><span class="k">账号类型</span><span class="v">外部供应商 · 仅开放接单、发货、对账确认，看不到其他供应商与门店预算</span></div>'

          return '<span class="mini-tag">' + UI.esc(CAP_LABEL[c] || c) + '</span>';

      '</div>' +

      '<div class="card card-pad mt12">' +

          UI.icon('right', 'sm') + '</a>' +
      '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="between mb8"><span class="section-title">企业微信接入</span>' +
          '<span class="pill ' + (wecom.state === 'on' ? 'good' : wecom.state === 'error' ? 'bad' : wecom.state === 'off' ? 'gray' : 'info') + '">' +
          (wecom.state === 'on' ? '已连接' : wecom.state === 'off' ? '未启用' : wecom.state === 'error' ? '异常' : '待授权') + '</span></div>' +
        '<div class="small muted" style="line-height:1.6">' + UI.esc(wecom.text) + '</div>' +
        '<div class="divider"></div>' +
        '<div class="pref-list">' +
          '<div class="pref-item"><span class="n">1</span><div><div class="t">企业微信后台创建自建应用</div>' +
            '<div class="d">拿到 CorpID、AgentId、Secret；配置应用主页为本页地址，并设置可见范围。</div></div></div>' +
          '<div class="pref-item"><span class="n">2</span><div><div class="t">配置可信域名与 HTTPS</div>' +
            '<div class="d">域名需 ICP 备案且与企业主体一致，上传校验文件；企业微信内置浏览器要求公网可访问。</div></div></div>' +

            '<div class="d">code → getuserinfo 拿 UserId → user/get 拿部门/职务/isleader → 映射成门店店长/战区/中台/部门角色 → 签发 token。</div></div></div>' +
          '<div class="pref-item"><span class="n">4</span><div><div class="t">供应商单独开账号</div>' +
            '<div class="d">为每家供应商建一个企业微信成员账号（或上下游联系人），应用可见范围只勾选他们，账号只进「供应商工作台」，看不到内部订单与预算。</div></div></div>' +
          '<div class="pref-item"><span class="n">5</span><div><div class="t">待办推送</div>' +
            '<div class="d">用应用消息 message/send 按 userid 推送「有单待审批 / 已超时」，无需用户逐次授权订阅。</div></div></div>' +
        '</div>' +

      '<div class="card card-pad mt12">' +
        '<div class="section-title mb8">演示工具</div>' +
        (demoOn
          ? '<a class="btn ghost block" href="#/login" style="margin-bottom:8px">' + UI.icon('user', 'sm') + '切换演示身份</a>'
          : '<div class="note-box mb8">演示模式已关闭：首页不再显示身份切换入口，适合对外演示。</div>') +
        '<div class="between" style="padding:10px 0;border-top:1px solid var(--line-2)">' +
          '<div><div class="small">演示模式</div><div class="tiny muted">关闭后隐藏演示痕迹</div></div>' +

(function (Views) {

      root.innerHTML =

                  '<span class="tiny muted">' + UI.esc(BIZ.fmt.fullTime(d.updatedAt)) + '</span></div>' +

                '<div class="between mt8"><span class="money">¥' + UI.money2(d.amount) + '</span>' +
                  '<span class="btn-group" style="flex:0 0 auto">' +
                    '<button class="btn ghost xs" data-del="' + UI.esc(d.id) + '">删除</button>' +
                    '<button class="btn primary xs" data-restore="' + UI.esc(d.id) + '">继续编辑</button>' +

<script>
/* ==== js/pages/budget.js ==== */
/* 门店费用预算设置（中台）：房间数 × 科目系数，可为单店直接定额 */
(function (Views) {
  Views.budget = function (root, r, ctx) {
    const domain = BIZ.domain;
    const perm = BIZ.perm;
    const BUDGET = BIZ.budget;
    const me = ctx.me;

    if (!perm.can(me, 'budget.config')) {
      root.innerHTML = UI.empty('🔒', '当前身份无预算设置权限', '仅运营管理部（中台）可调整门店费用预算');
      return;
    }

    let state = ctx.state;
    const sync = function () { state = Store.loadState(); };

    let keyword = '';
    let limit = 12;
    let editing = '';
    let form = null;

    function rows() {
      const summary = domain.budgetSummary(state, me);
      const usedOf = {};
      summary.forEach(function (x) { usedOf[x.store] = x; });
      const kw = keyword.trim();
      return BIZ.catalog.STORES.filter(function (s) {
        return !kw || s.indexOf(kw) >= 0;
      }).map(function (s) {
        const cfg = domain.budgetConfigOf(state, s);
        const used = usedOf[s];
        return {
          store: s,
          rooms: cfg.rooms,
          total: cfg.total,
          used: used ? used.used : 0,
          pct: used ? used.usedPct : 0,
          items: cfg.items
        };
      });
    }

    function storeCard(row) {
      const isEdit = editing === row.store;
      const tone = row.pct >= 90 ? 'bad' : row.pct >= 70 ? 'warn' : '';
      const itemLines = row.items.map(function (it) {
        return '<div class="bitem">' +
          '<span class="bitem-name">' + UI.esc(it.name) + '</span>' +
          '<span class="bitem-basis">' + (it.basis === 'override' ? '直接定额' : it.coef + ' 元/间') + '</span>' +
          '<span class="bitem-amt num">¥' + UI.money(it.budget) + '</span>' +
        '</div>';
      }).join('');

      let editor = '';
      if (isEdit && form) {
        editor = '<div class="bedit">' +
          '<div class="field"><div class="label">管理房间数</div>' +
            '<input class="input" type="number" min="1" id="f-rooms" value="' + form.rooms + '"></div>' +
          form.items.map(function (fi, i) {
            return '<div class="bedit-item">' +
              '<div class="between"><span class="strong small">' + UI.esc(fi.name) + '</span>' +
                '<span class="tiny muted">当前 ¥' + UI.money(fi.budget) + (fi.adjust ? '（含追加 ' + UI.money(fi.adjust) + '）' : '') + '</span></div>' +
              '<div class="field-row mt8">' +
                '<div class="field" style="margin:0"><div class="label">系数（元/间）</div>' +
                  '<input class="input" type="number" min="0" step="0.01" data-coef="' + i + '" value="' + fi.coef + '"></div>' +
                '<div class="field" style="margin:0"><div class="label">直接定额（留空按公式）</div>' +
                  '<input class="input" type="number" min="0" step="1" data-ov="' + i + '" value="' + (fi.override === null ? '' : fi.override) + '"></div>' +
              '</div>' +
            '</div>';
          }).join('') +
          '<div class="btn-group mt12">' +
            '<button class="btn ghost sm" data-reset="' + UI.esc(row.store) + '">恢复默认</button>' +
            '<button class="btn primary sm" data-save="' + UI.esc(row.store) + '">保存</button>' +
          '</div>' +
          '<div class="tiny muted mt8">保存后立即生效：下单试算、预算核定缺口、看板统计都按新额度计算，历史订单不追溯。</div>' +
        '</div>';
      }

      return '<div class="card card-pad store-card" data-store="' + UI.esc(row.store) + '">' +
        '<div class="between">' +
          '<div class="grow"><div class="strong">' + UI.esc(row.store) + '</div>' +
            '<div class="tiny muted mt4">' + row.rooms + ' 间房 · 已用 ¥' + UI.money(row.used) + '（' + row.pct + '%）</div></div>' +
          '<div style="text-align:right;flex:0 0 auto">' +
            '<div class="num strong">¥' + UI.money(row.total) + '</div>' +
            '<button class="btn ghost xs mt4" data-edit="' + UI.esc(row.store) + '">' + (isEdit ? '收起' : '调整') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="bar mt8" style="height:4px"><i class="' + tone + '" style="width:' + Math.min(100, row.pct) + '%"></i></div>' +
        '<div class="bitems">' + itemLines + '</div>' +
        editor +
      '</div>';
    }

    function render() {
      const list = rows();
      const shown = list.slice(0, limit);
      root.innerHTML =
        '<div class="between" style="margin-bottom:10px">' +
          '<div><div class="section-title">门店费用预算</div>' +
            '<div class="tiny muted mt4">额度 = 管理房间数 × 科目系数，可对单店直接定额；机动池余额 ¥' + UI.money(state.flex) + '</div></div>' +
          '<span class="pill line">' + list.length + ' 家门店</span>' +
        '</div>' +
        '<div class="card card-pad" style="padding:12px 14px">' +
          '<div class="field" style="margin:0"><div class="label">搜索门店</div>' +
            '<input class="input" id="b-kw" placeholder="输入门店名称，如 福海和平店" value="' + UI.esc(keyword) + '"></div>' +
        '</div>' +
        '<div class="bstore-list">' + shown.map(storeCard).join('') + '</div>' +
        (shown.length < list.length
          ? '<div style="text-align:center;margin-top:10px"><button class="btn ghost" id="b-more" style="width:210px">显示更多（' + shown.length + '/' + list.length + '）</button></div>'
          : '') +
        '<div class="note-box mt12">三项费用均按「管理房间数 × 系数」计提，默认 1000 间房 × 10 元/间 = 每科目 ¥10,000。' +
          '机动池追加与门店间调剂不计入基数，在「统一对账 → 预算占用」中查看明细。</div>';

      const kwInput = root.querySelector('#b-kw');
      kwInput.addEventListener('input', UI.debounce(function () {
        keyword = kwInput.value;
        limit = 12;
        render();
        const again = root.querySelector('#b-kw');
        again.focus();
        again.setSelectionRange(keyword.length, keyword.length);
      }, 220));

      const more = root.querySelector('#b-more');
      if (more) more.onclick = function () { limit += 20; render(); };

      root.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.onclick = function () {
          const name = btn.dataset.edit;
          if (editing === name) { editing = ''; form = null; render(); return; }
          const cfg = domain.budgetConfigOf(state, name);
          editing = name;
          form = {
            rooms: String(cfg.rooms),
            items: cfg.items.map(function (it) {
              return {
                key: it.key, name: it.name, coef: it.coef,
                override: it.override === null ? '' : it.override,
                budget: it.budget, adjust: it.adjust
              };
            })
          };
          render();
          const card = root.querySelector('[data-store="' + name + '"]');
          if (card && card.scrollIntoView) card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        };
      });

      root.querySelectorAll('[data-coef],[data-ov]').forEach(function (input) {
        input.addEventListener('input', function () {
          if (!form) return;
          const idx = Number(input.dataset.coef !== undefined ? input.dataset.coef : input.dataset.ov);
          const item = form.items[idx];
          if (!item) return;
          if (input.dataset.coef !== undefined) item.coef = input.value;
          else item.override = input.value;
        });
      });

      const roomsInput = root.querySelector('#f-rooms');
      if (roomsInput) roomsInput.addEventListener('input', function () { if (form) form.rooms = roomsInput.value; });

      root.querySelectorAll('[data-save]').forEach(function (btn) {
        btn.onclick = function () {
          const name = btn.dataset.save;
          if (!form) return;
          const payload = { store: name, rooms: Number(form.rooms), coef: {}, override: {} };
          form.items.forEach(function (it) {
            const c = String(it.coef).trim();
            const o = String(it.override).trim();
            payload.coef[it.key] = c === '' ? null : Number(c);
            payload.override[it.key] = o === '' ? null : Number(o);
          });
          try {
            let changed = [];
            App.mutate(function (st, ses) {
              const res = BIZ.domain.saveBudgetConfig(st, ses, payload);
              changed = res.changed;
              Store.appendAudit([{
                orderId: '', kind: 'budget', stage: 'budget-config', decision: '调整门店预算',
                role: '运营管理部（' + ses.id + '）', from: '', to: '',
                note: name + '：' + changed.join('，'), at: new Date().toISOString()
              }]);
            });
            sync();
            UI.toast('已保存：' + changed.join('，'), 'good', 2600);
            const cfg = domain.budgetConfigOf(state, name);
            form = {
              rooms: String(cfg.rooms),
              items: cfg.items.map(function (it) {
                return {
                  key: it.key, name: it.name, coef: it.coef,
                  override: it.override === null ? '' : it.override,
                  budget: it.budget, adjust: it.adjust
                };
              })
            };
            render();
          } catch (err) {
            UI.toast(err.message, 'error', 3000);
          }
        };
      });

      root.querySelectorAll('[data-reset]').forEach(function (btn) {
        btn.onclick = function () {
          const name = btn.dataset.reset;
          UI.confirm({
            title: '恢复默认预算？',
            sub: '清除「' + name + '」的科目系数覆盖与直接定额，改回房间数 × 默认系数（机动池追加/调剂不受影响）。',
            okText: '恢复默认'
          }).then(function (ok) {
            if (!ok) return;
            const payload = { store: name, coef: {}, override: {} };
            BIZ.budget.KEYS.forEach(function (k) {
              payload.coef[k] = null;
              payload.override[k] = null;
            });
            try {
              App.mutate(function (st, ses) { BIZ.domain.saveBudgetConfig(st, ses, payload); });
              sync();
              UI.toast('已恢复默认');
              const cfg = domain.budgetConfigOf(state, name);
              form = {
                rooms: String(cfg.rooms),
                items: cfg.items.map(function (it) {
                  return {
                    key: it.key, name: it.name, coef: it.coef,
                    override: it.override === null ? '' : it.override,
                    budget: it.budget, adjust: it.adjust
                  };
                })
              };
              render();
            } catch (err) {
              UI.toast(err.message, 'error', 3000);
            }
          });
        };
      });
    }

    render();
  };
})(window.Views);

</script>
