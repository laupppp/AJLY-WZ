<style>
/* ==== css/app.css ==== */
/* 安居乐寓物资采购管理系统 · H5
   一套样式同时适配手机（企业微信内置浏览器）与桌面（企业微信 PC 侧边栏/浏览器） */

:root {
  --brand: #183654;
  --brand-2: #2966a5;
  --brand-3: #3f80c2;
  --ink: #16273a;
  --ink-2: #33475e;
  --muted: #6d8095;
  --muted-2: #96a5b6;
  --bg: #f4f7fb;
  --card: #ffffff;
  --line: #e6edf5;
  --line-2: #eef3f9;
  --good: #0d7a52;
  --good-bg: #e7f6ef;
  --warn: #a0680f;
  --warn-bg: #fdf4e3;
  --bad: #b23b32;
  --bad-bg: #fdeeec;
  --info: #2b5c8f;
  --info-bg: #eaf2fb;
  --violet: #6a4fa3;
  --violet-bg: #f1ecfb;
  --cat-community: #1c7ed6;
  --cat-community-bg: #e8f3fe;
  --cat-customer: #0f766e;
  --cat-customer-bg: #e3f6f2;
  --cat-marketing: #5f3dc4;
  --cat-marketing-bg: #f0ecfe;
  --radius: 16px;
  --shadow: 0 2px 10px rgba(20, 45, 70, .05);
  --shadow-lg: 0 12px 32px rgba(20, 45, 70, .14);
  --topbar: 56px;
  --tabbar: 60px;
  --safe: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  padding-bottom: calc(var(--tabbar) + var(--safe));
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
ul { margin: 0; padding: 0; list-style: none; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 18px; height: 18px; }
.ic.xs { width: 14px; height: 14px; stroke-width: 2; }

/* ---------------- 框架 ---------------- */
.shell { min-height: 100%; }
.side { display: none; }
.main { min-height: 100vh; }

.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--topbar);
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px 0 6px;
  background: rgba(255, 255, 255, .92);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-title { font-size: 17px; font-weight: 700; letter-spacing: .2px; flex: 1; text-align: center; }
.topbar-back {
  width: 38px; height: 38px; border-radius: 12px;
  display: none; align-items: center; justify-content: center; color: var(--ink-2);
}
.topbar-back.on { display: flex; }
.topbar-act { min-width: 38px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
body[data-page="login"] .topbar { display: none; }

.view { padding: 14px 14px 22px; max-width: 980px; margin: 0 auto; }
.view.wide { max-width: 1200px; }
.view.flush { padding: 0; max-width: none; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  height: calc(var(--tabbar) + var(--safe));
  padding-bottom: var(--safe);
  display: flex; align-items: stretch;
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tabbar a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 10px; color: var(--muted-2); position: relative;
}
.tabbar a .ic { width: 23px; height: 23px; }
.tabbar a.on { color: var(--brand-2); font-weight: 600; }
.tabbar a .dot {
  position: absolute; top: 8px; left: 50%; margin-left: 6px;
  min-width: 8px; height: 8px; border-radius: 9px; background: #d6453c;
  border: 2px solid #fff;
}
.tabbar a .dot.num { height: 15px; min-width: 15px; padding: 0 3px; font-size: 9px; line-height: 11px; text-align: center; color: #fff; }

/* 桌面端规则统一放在文件末尾（见文末「桌面端布局」段），
   避免被后面追加的基础样式以同等优先级覆盖。 */

/* ---------------- 侧栏 ---------------- */
.side-brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 20px; }
.side-logo {
  width: 38px; height: 38px; border-radius: 11px; flex: 0 0 auto;
  background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .2);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 700; color: #fff; letter-spacing: 1px;
}
.side-logo.has-img {
  background: #ffffff; border-color: rgba(255, 255, 255, .85); padding: 4px;
  box-shadow: 0 4px 12px rgba(9, 25, 42, .22);
}
.side-logo.has-img img,
.login-logo.has-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.login-logo.has-img {
  width: 68px; height: 68px; padding: 9px; border-radius: 19px;
  background: #ffffff; border: 1px solid #dbe9f8;
  box-shadow: 0 10px 26px rgba(24, 54, 84, .14);
}
.side-brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.side-brand-text strong { font-size: 15px; letter-spacing: .4px; }
.side-brand-text span { font-size: 9px; letter-spacing: 1.6px; color: rgba(231, 239, 248, .5); margin-top: 3px; }
.side-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.side-nav a {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 12px; border-radius: 11px;
  font-size: 14px; color: rgba(231, 239, 248, .74); position: relative;
}
.side-nav a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.side-nav a.on { background: rgba(255, 255, 255, .14); color: #fff; font-weight: 600; }
.side-nav a.on::before {
  content: ""; position: absolute; left: -14px; top: 11px; bottom: 11px; width: 3px;
  background: #7fb4ec; border-radius: 0 3px 3px 0;
}
.side-nav a .ic { width: 19px; height: 19px; opacity: .9; }
.side-nav a .n { margin-left: auto; font-size: 11px; background: #d6453c; color: #fff; border-radius: 9px; padding: 0 6px; height: 17px; line-height: 17px; }
.side-foot { border-top: 1px solid rgba(255, 255, 255, .12); padding-top: 12px; }
.side-user { display: flex; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 11px; }
.side-user:hover { background: rgba(255, 255, 255, .07); }
.side-user .av { width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 255, 255, .16); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
.side-user .nm { font-size: 13px; font-weight: 600; }
.side-user .rl { font-size: 10px; color: rgba(231, 239, 248, .55); margin-top: 2px; }
.side-note { font-size: 10px; color: rgba(231, 239, 248, .35); padding: 10px 8px 0; }

/* ---------------- 通用 ---------------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 16px; }
.card + .card, .card + .section, .section + .section { margin-top: 12px; }
.section { margin-top: 20px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; padding: 0 2px; }
.section-title { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
.section-more { font-size: 12px; color: var(--brand-2); display: inline-flex; align-items: center; gap: 2px; }

.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.tiny { font-size: 11px; }
.small { font-size: 13px; }
.strong { font-weight: 700; }
.nowrap { white-space: nowrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mt4 { margin-top: 4px; } .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

.money { font-variant-numeric: tabular-nums; font-weight: 700; }
.money.big { font-size: 26px; letter-spacing: -.4px; }
.money.red { color: var(--bad); }
.money.green { color: var(--good); }
.cur { font-size: .68em; font-weight: 600; margin-right: 1px; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; line-height: 1.35; white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.dark { background: #eaf0f7; color: #2b4761; }
.pill.gray { background: #f0f3f7; color: #6d8095; }
.pill.violet { background: var(--violet-bg); color: var(--violet); }
.pill.line { background: transparent; border: 1px solid var(--line); color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 18px; border-radius: 12px;
  font-size: 15px; font-weight: 600; white-space: nowrap;
  border: 1px solid transparent; transition: .16s ease;
}
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(24, 54, 84, .18); }
.btn.primary:hover { background: #1d4467; }
.btn.blue { background: var(--brand-2); color: #fff; }
.btn.soft { background: #edf4fd; color: #245b94; }
.btn.ghost { background: #fff; border-color: var(--line); color: var(--ink-2); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.danger-solid { background: #b23b32; color: #fff; }
.btn.link { height: auto; padding: 0; background: none; color: var(--brand-2); font-weight: 500; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.xs { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn-group { display: flex; gap: 8px; }
.btn-group .btn { flex: 1; }

.icon-btn { width: 38px; height: 38px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); background: #fff; border: 1px solid var(--line); }
.icon-btn.plain { border-color: transparent; background: transparent; }

.empty { text-align: center; padding: 52px 20px; color: var(--muted); }
.empty .ico { font-size: 34px; opacity: .55; margin-bottom: 10px; }
.empty .ico.svg {
  width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 16px;
  background: #eaf2fa; color: var(--brand-2); opacity: 1;
  display: flex; align-items: center; justify-content: center;
}
.empty .ico.svg .ic { width: 28px; height: 28px; }
.empty .t { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.empty .s { font-size: 12px; color: var(--muted-2); margin-top: 6px; }

.divider { height: 1px; background: var(--line-2); margin: 12px 0; }

/* 顶部提示条 */
.alert {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 12px; font-size: 12.5px;
  background: var(--bad-bg); color: var(--bad); border: 1px solid #f6d9d4;
}
.alert.warn { background: var(--warn-bg); color: var(--warn); border-color: #f3e3c4; }
.alert.info { background: var(--info-bg); color: var(--info); border-color: #d8e6f7; }
.alert .ic { flex: 0 0 auto; }
.alert .go { margin-left: auto; font-weight: 600; white-space: nowrap; }

/* ---------------- 首页 ---------------- */
.hero {
  position: relative; overflow: hidden;
  background: linear-gradient(140deg, #142d47 0%, #1b3f63 48%, #2a639c 100%);
  color: #fff; border-radius: 20px; padding: 18px 18px 20px;
  box-shadow: 0 10px 26px rgba(20, 45, 70, .22);
}
.hero::after {
  content: ""; position: absolute; right: -60px; top: -70px; width: 200px; height: 200px;
  border-radius: 50%; background: radial-gradient(circle, rgba(120, 175, 235, .28), transparent 68%);
}
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; position: relative; z-index: 1; }
.hero-hello { font-size: 12px; color: rgba(255, 255, 255, .62); letter-spacing: .4px; }
.hero-name { font-size: 21px; font-weight: 700; margin-top: 3px; letter-spacing: .3px; }
.hero-tag { display: inline-block; margin-left: 8px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: rgba(255, 255, 255, .16); vertical-align: 3px; }
.hero-scope { font-size: 12px; color: rgba(255, 255, 255, .66); margin-top: 6px; }
.hero-date { font-size: 11px; padding: 6px 10px; border-radius: 999px; background: rgba(255, 255, 255, .12); white-space: nowrap; }
.hero-foot { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, .12); position: relative; z-index: 1; }
.hero-metric .k { font-size: 10.5px; color: rgba(255, 255, 255, .58); }
.hero-metric .v { font-size: 17px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
.hero-switch { margin-left: auto; font-size: 11.5px; color: rgba(255, 255, 255, .82); display: inline-flex; align-items: center; gap: 3px; background: rgba(255, 255, 255, .12); border-radius: 999px; padding: 5px 10px; }

.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick-grid.n3 { grid-template-columns: repeat(3, 1fr); }
.quick {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 13px 4px 11px; background: #fff; border: 1px solid var(--line);
  border-radius: 14px; position: relative; box-shadow: var(--shadow);
}
.quick:active { background: #fafcff; }
.quick .qi { width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; }
.quick .qi .ic { width: 21px; height: 21px; }
.quick .ql { font-size: 11.5px; color: var(--ink-2); font-weight: 500; }
.quick .qb { position: absolute; top: 7px; right: 9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #d6453c; color: #fff; font-size: 9.5px; line-height: 16px; text-align: center; }
.qi.blue { background: #e9f2fd; color: #2766a5; }
.qi.navy { background: #e8eef6; color: #27486a; }
.qi.teal { background: #e3f4f0; color: #157a68; }
.qi.amber { background: #fdf2df; color: #a5701a; }
.qi.violet { background: #f0ebfb; color: #6a4fa3; }
.qi.gray { background: #eff3f7; color: #60748a; }
.qi.green { background: #e6f5ee; color: #0d7a52; }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 13px; box-shadow: var(--shadow); }
.stat .k { font-size: 11px; color: var(--muted); }
.stat .v { font-size: 22px; font-weight: 700; margin-top: 3px; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.stat .d { font-size: 10.5px; color: var(--muted-2); margin-top: 2px; }

/* 预算 */
.budget-row { padding: 11px 0; border-bottom: 1px dashed var(--line-2); }
.budget-row:last-child { border-bottom: 0; }
.budget-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.budget-store { font-size: 13.5px; font-weight: 600; }
.budget-num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 7px; border-radius: 999px; background: #eef2f7; margin-top: 7px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #4f92cf, #2966a5); }
.bar > i.warn { background: linear-gradient(90deg, #e0a83f, #c98a1c); }
.bar > i.bad { background: linear-gradient(90deg, #d9705f, #b23b32); }
.bar-legend { display: flex; gap: 10px; font-size: 10.5px; color: var(--muted-2); margin-top: 6px; }

/* 待办 */
.todo { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
.todo:last-child { border-bottom: 0; }
.todo-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.todo-ico.info { background: var(--info-bg); color: var(--info); }
.todo-ico.good { background: var(--good-bg); color: var(--good); }
.todo-main { flex: 1; min-width: 0; }
.todo-title { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.todo-sub { font-size: 11px; color: var(--muted-2); margin-top: 2px; }

/* ---------------- 下单页 ---------------- */
.cat-page { display: flex; flex-direction: column; }
.cat-top { position: sticky; top: var(--topbar); z-index: 20; background: var(--bg); padding: 10px 14px 8px; border-bottom: 1px solid var(--line); }
@media (min-width: 900px) { .cat-top { top: 64px; padding: 12px 22px 10px; } }
.ctx-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ctx-left { min-width: 0; }
.ctx-k { font-size: 10.5px; color: var(--muted); }
.ctx-v { font-size: 15px; font-weight: 700; margin-top: 1px; display: flex; align-items: center; gap: 4px; }
.ctx-v .ic { width: 14px; height: 14px; color: var(--muted-2); }
.ctx-sum { text-align: right; font-size: 11px; color: var(--muted); }
.ctx-sum b { display: block; font-size: 17px; color: var(--brand); font-variant-numeric: tabular-nums; }

.search { display: flex; align-items: center; gap: 8px; height: 40px; margin-top: 9px; padding: 0 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
.search .ic { color: var(--muted-2); width: 17px; height: 17px; flex: 0 0 auto; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; }
.search .clear { color: var(--muted-2); padding: 4px; display: none; }
.search.has .clear { display: block; }

.cat-head { display: flex; align-items: baseline; justify-content: space-between; padding: 9px 2px 0; }
.cat-head .t { font-size: 13.5px; font-weight: 700; }
.cat-head .t span { font-weight: 400; font-size: 11px; color: var(--muted-2); margin-left: 5px; }
.cat-head .c { font-size: 10.5px; color: var(--muted-2); }

.cat-body { display: flex; align-items: flex-start; }
.rail {
  flex: 0 0 94px; width: 94px;
  position: sticky; top: calc(var(--topbar) + 118px);
  max-height: calc(100vh - var(--topbar) - 130px);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: #fff; border-right: 1px solid var(--line);
  padding-bottom: 90px;
}
@media (min-width: 900px) {
  .rail {
    flex-basis: 164px; width: 164px; top: 190px;
    max-height: calc(100vh - 210px);
    min-height: calc(100vh - 200px);
  }
  .rail-cat { padding: 15px 14px 15px 18px; font-size: 13.5px; }
  .rail-sub { padding: 12px 12px 12px 30px; font-size: 12.5px; }
  .search { max-width: 560px; }
  .goods { padding: 16px 24px 0; }
  .plist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .prod { margin: 0; }
}
.rail-cat {
  display: flex; align-items: center; gap: 4px;
  padding: 13px 8px 13px 10px; font-size: 12.5px; color: var(--ink-2);
  border-bottom: 1px solid var(--line-2); line-height: 1.25; cursor: pointer;
}
.rail-cat .ic { width: 12px; height: 12px; color: var(--muted-2); margin-left: auto; flex: 0 0 auto; transition: transform .18s; }
.rail-cat .n { font-size: 10px; color: var(--muted-2); margin-left: auto; }
.rail-cat.open .ic { transform: rotate(90deg); }
.rail-cat.on { background: #fff; color: var(--brand-2); font-weight: 700; box-shadow: inset 3px 0 0 var(--brand-2); }
.rail-cat:not(.on) { background: #fbfcfe; }
.rail-sub {
  display: flex; align-items: center; gap: 4px;
  padding: 10px 8px 10px 20px; font-size: 11.5px; color: var(--muted);
  background: #f7fafd; border-bottom: 1px solid #f2f6fa; cursor: pointer; line-height: 1.3;
}
.rail-sub .n { margin-left: auto; font-size: 9.5px; color: var(--muted-2); }
.rail-sub.on { background: #fff; color: var(--brand-2); font-weight: 700; box-shadow: inset 3px 0 0 var(--brand-2); }
.rail-sub.on .n { color: var(--brand-2); }
.rail-pad { height: 80px; }

.goods { flex: 1; min-width: 0; padding: 10px 12px 0; }
@media (min-width: 900px) { .goods { padding: 14px 18px 0; } }

.freq { margin-bottom: 12px; }
.freq-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 7px; }
.freq-head .t { font-size: 12.5px; font-weight: 700; }
.freq-head .s { font-size: 10px; color: var(--muted-2); }
.freq-list { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 3px; scrollbar-width: none; }
.freq-list::-webkit-scrollbar { display: none; }
.freq-chip {
  flex: 0 0 auto; max-width: 150px; padding: 7px 10px; border-radius: 10px;
  background: #fff; border: 1px solid var(--line); font-size: 11px; color: var(--ink-2);
  text-align: left; line-height: 1.3;
}
.freq-chip b { display: block; font-size: 11.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.freq-chip span { color: var(--brand-2); font-weight: 600; font-size: 10.5px; }

.plist { display: flex; flex-direction: column; gap: 8px; }
.prod { display: flex; gap: 10px; padding: 11px 12px; background: #fff; border: 1px solid var(--line); border-radius: 13px; align-items: center; }
.prod-ico { width: 40px; height: 40px; border-radius: 11px; background: #f1f6fc; display: flex; align-items: center; justify-content: center; font-size: 19px; flex: 0 0 auto; }
.prod-main { flex: 1; min-width: 0; }
.prod-name { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.prod-spec { font-size: 10.5px; color: var(--muted-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prod-spec .prod-sup { font-size: 10px; color: #a9b7c6; }
.prod-foot { display: flex; align-items: baseline; gap: 3px; margin-top: 4px; white-space: nowrap; overflow: hidden; }
.prod-price { font-size: 14px; font-weight: 700; color: var(--brand-2); font-variant-numeric: tabular-nums; }
.prod-unit { font-size: 10px; color: var(--muted-2); }

.prod-act { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.step-btn { width: 26px; height: 26px; border-radius: 9px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
.step-btn.add { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
.step-btn .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.step-qty { min-width: 18px; text-align: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.step-qty.zero { display: none; }

.more { width: 100%; margin: 10px 0 6px; padding: 11px; border-radius: 12px; background: #fff; border: 1px dashed var(--line); color: var(--muted); font-size: 12px; }

.cartbar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + var(--safe)); z-index: 45;
  display: none; align-items: center; gap: 12px;
  padding: 10px 14px; background: rgba(255, 255, 255, .97);
  border-top: 1px solid var(--line); backdrop-filter: blur(10px);
  box-shadow: 0 -4px 18px rgba(20, 45, 70, .06);
}
.cartbar.on { display: flex; }
.cartbar .sum { flex: 1; min-width: 0; }
.cartbar .sum .k { font-size: 10.5px; color: var(--muted); }
.cartbar .sum .v { font-size: 18px; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
.cartbar .sum .v small { font-size: 10px; font-weight: 500; color: var(--muted-2); margin-left: 4px; }
@media (min-width: 900px) {
  .cartbar { left: 236px; bottom: 0; padding: 12px 26px; }
}

/* ---------------- 表单 ---------------- */
.field { margin-bottom: 13px; }
.field:last-child { margin-bottom: 0; }
.label { display: flex; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.label .req { color: var(--bad); margin-left: 2px; }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 12px;
  background: #fff; border: 1px solid var(--line); border-radius: 11px;
  font-size: 14.5px; outline: none; transition: border-color .15s, box-shadow .15s;
}
.input:focus, .select:focus, .textarea:focus { border-color: #9dc2e6; box-shadow: 0 0 0 3px rgba(41, 102, 165, .1); }
.textarea { min-height: 74px; resize: vertical; line-height: 1.5; }
.select { appearance: none; background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236d8095' stroke-width='2'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; background-size: 16px; padding-right: 32px; }
.field-row { display: flex; gap: 10px; }
.field-row > .field { flex: 1; min-width: 0; }
.check { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--ink-2); padding: 9px 0; cursor: pointer; }
.check input { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--brand-2); flex: 0 0 auto; }
.radio-cards { display: flex; flex-direction: column; gap: 7px; }
.radio-card { display: flex; align-items: center; gap: 9px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: #fff; font-size: 13.5px; cursor: pointer; }
.radio-card.on { border-color: var(--brand-2); background: #f5faff; box-shadow: 0 0 0 2px rgba(41, 102, 165, .07); }
.radio-card .rd { width: 17px; height: 17px; border-radius: 50%; border: 2px solid #c6d3e0; flex: 0 0 auto; }
.radio-card.on .rd { border-color: var(--brand-2); box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 9px var(--brand-2); }
.radio-card .grow > span { display: block; }
.radio-card .d { display: block; font-size: 11px; color: var(--muted-2); margin-top: 2px; line-height: 1.4; }

/* ---------------- 列表/筛选 ---------------- */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 999px;
  background: #fff; border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 4px;
}
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.chip .n { font-size: 10px; opacity: .62; }

.order-card { padding: 13px 14px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: block; }
.order-card + .order-card { margin-top: 9px; }
.order-top { display: flex; align-items: center; gap: 8px; }
.order-id { font-size: 14px; font-weight: 700; letter-spacing: .2px; font-variant-numeric: tabular-nums; }
.order-meta { font-size: 11px; color: var(--muted-2); margin-top: 3px; }
.order-items { font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.order-foot { display: flex; align-items: center; gap: 8px; margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line-2); }
.order-amt { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.order-amt small { font-size: 10px; font-weight: 500; color: var(--muted-2); margin-left: 3px; }
.sla { font-size: 10.5px; display: inline-flex; align-items: center; gap: 3px; }
.sla.bad { color: var(--bad); font-weight: 600; }
.sla.warn { color: var(--warn); font-weight: 600; }

/* ---------------- 详情 ---------------- */
.detail-hero { padding: 16px; border-radius: 16px; background: linear-gradient(140deg, #17324e, #245582); color: #fff; box-shadow: 0 8px 22px rgba(20, 45, 70, .18); }
.detail-hero .st { font-size: 12px; color: rgba(255, 255, 255, .66); display: flex; align-items: center; gap: 6px; }
.detail-hero .id { font-size: 19px; font-weight: 700; margin-top: 4px; letter-spacing: .3px; }
.detail-hero .amt { font-size: 28px; font-weight: 700; margin-top: 8px; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.detail-hero .amt small { font-size: 12px; font-weight: 500; opacity: .7; margin-left: 4px; }
.detail-hero .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 11px; color: rgba(255, 255, 255, .72); }

.kv { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; font-size: 13px; }
.kv .k { flex: 0 0 84px; color: var(--muted); font-size: 12px; padding-top: 1px; }
.kv .v { flex: 1; min-width: 0; color: var(--ink-2); word-break: break-all; }
.kv .v.mono { font-variant-numeric: tabular-nums; letter-spacing: .2px; }
.copy-inline { display: inline-flex; align-items: center; gap: 3px; color: var(--brand-2); font-size: 10.5px; margin-left: 6px; vertical-align: 1px; }

.item-line { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line-2); }
.item-line:last-child { border-bottom: 0; }
.item-line .nm { flex: 1; min-width: 0; font-size: 13px; }
.item-line .nm small { display: block; font-size: 10.5px; color: var(--muted-2); margin-top: 2px; }
.item-line .qty { font-size: 11.5px; color: var(--muted); width: 52px; text-align: right; flex: 0 0 auto; }
.item-line .amt { font-size: 13px; font-weight: 600; width: 76px; text-align: right; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.item-tag { display: inline-block; font-size: 9.5px; padding: 1px 5px; border-radius: 4px; background: #eef3f9; color: var(--muted); margin-left: 5px; vertical-align: 1px; }

.timeline { position: relative; padding-left: 18px; }
.timeline::before { content: ""; position: absolute; left: 4px; top: 5px; bottom: 6px; width: 1.5px; background: var(--line); }
.tl-item { position: relative; padding-bottom: 14px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before { content: ""; position: absolute; left: -18px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 2px solid #b9cde2; }
.tl-item.on::before { border-color: var(--brand-2); background: var(--brand-2); }
.tl-item.bad::before { border-color: var(--bad); background: var(--bad); }
.tl-t { font-size: 12.5px; font-weight: 600; }
.tl-d { font-size: 11px; color: var(--muted-2); margin-top: 2px; line-height: 1.5; }
.tl-time { font-size: 10.5px; color: var(--muted-2); margin-top: 2px; }

.rec-block { padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: #fcfdff; }
.rec-head { display: flex; align-items: center; gap: 6px; }
.rec-name { font-size: 12.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-del { font-size: 11.5px; color: var(--ink-2); margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line-2); }
.rec-del .m { color: var(--muted); }
.rec-del + .rec-del { border-top: 1px dashed var(--line-2); margin-top: 6px; padding-top: 6px; }

.actionbar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + var(--safe)); z-index: 46;
  margin: 0; padding: 10px 14px; display: flex; gap: 8px;
  background: rgba(255, 255, 255, .97); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(20, 45, 70, .07);
}
.actionbar .btn { flex: 1; }
.action-spacer { height: 76px; }
@media (min-width: 900px) {
  .actionbar { position: static; background: none; border: 0; box-shadow: none; backdrop-filter: none; padding: 18px 0 0; }
  .action-spacer { display: none; }
}

/* ---------------- 表格 ---------------- */
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { text-align: left; font-weight: 600; color: var(--muted); font-size: 10.5px; padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 6px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .tot td { font-weight: 700; background: #fafcff; }
.table-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.tbl-link { color: var(--brand-2); font-weight: 600; }

/* ---------------- 登录 ---------------- */
.login { max-width: 460px; margin: 0 auto; padding: 26px 16px 40px; }
.login-hero { text-align: center; padding: 12px 0 22px; }
.login-logo { width: 58px; height: 58px; margin: 0 auto 12px; border-radius: 17px; background: linear-gradient(145deg, #1b4064, #2f74b3); color: #fff; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(24, 54, 84, .28); }
.login-hero h1 { font-size: 19px; letter-spacing: .4px; }
.login-hero p { font-size: 11.5px; color: var(--muted); margin-top: 7px; line-height: 1.6; }
.login-group { margin-top: 14px; }
.login-group h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 7px; padding-left: 2px; display: flex; justify-content: space-between; }
.login-group h3 span { font-weight: 400; color: var(--muted-2); font-size: 10.5px; }
.id-card { display: flex; align-items: center; gap: 11px; width: 100%; padding: 12px 13px; background: #fff; border: 1px solid var(--line); border-radius: 13px; text-align: left; box-shadow: var(--shadow); margin-bottom: 7px; }
.id-card:hover { border-color: #c9dcef; }
.id-card .av { width: 38px; height: 38px; border-radius: 11px; background: #eaf2fb; color: #245b94; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex: 0 0 auto; }
.id-card .nm { font-size: 13.5px; font-weight: 600; }
.id-card .ds { font-size: 10.5px; color: var(--muted-2); margin-top: 2px; }
.id-card .ic { color: var(--muted-2); flex: 0 0 auto; }
.wecom-card { display: flex; gap: 10px; align-items: flex-start; padding: 12px 13px; border-radius: 13px; background: #eef5ff; border: 1px solid #dbe9f8; font-size: 11.5px; color: #2b5c8f; line-height: 1.55; }
.wecom-card .ic { flex: 0 0 auto; margin-top: 1px; }
.wecom-card b { display: block; font-size: 12.5px; margin-bottom: 2px; }
.login-alt { text-align: center; margin-top: 20px; font-size: 11.5px; color: var(--muted-2); }

/* ---------------- 弹层 ---------------- */
.mask { position: fixed; inset: 0; z-index: 90; background: rgba(16, 33, 51, .46); display: flex; align-items: flex-end; justify-content: center; animation: fade .16s ease; }
.sheet {
  width: 100%; max-width: 560px; background: #fff;
  border-radius: 20px 20px 0 0; max-height: 88vh; display: flex; flex-direction: column;
  animation: up .22s cubic-bezier(.2, .9, .3, 1);
}
.sheet-head { padding: 16px 18px 10px; border-bottom: 1px solid var(--line-2); flex: 0 0 auto; }
.sheet-title { font-size: 16px; font-weight: 700; }
.sheet-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.sheet-body { padding: 14px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-foot { padding: 10px 18px calc(14px + var(--safe)); border-top: 1px solid var(--line-2); display: flex; gap: 8px; flex: 0 0 auto; background: #fff; }
.sheet-foot .btn { flex: 1; }
.sheet-close { position: absolute; right: 12px; top: 12px; }
@media (min-width: 900px) {
  .mask { align-items: center; }
  .sheet { border-radius: 18px; max-height: 82vh; margin-bottom: 0; box-shadow: var(--shadow-lg); }
  .sheet-foot { border-radius: 0 0 18px 18px; }
}
@keyframes up { from { transform: translateY(26px); opacity: .7; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.toast-host { position: fixed; top: 14px; left: 0; right: 0; z-index: 120; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast {
  max-width: 82vw; padding: 9px 15px; border-radius: 11px;
  background: rgba(22, 39, 58, .93); color: #fff; font-size: 13px; line-height: 1.45;
  box-shadow: 0 8px 22px rgba(16, 33, 51, .24); animation: drop .18s ease;
}
.toast.error { background: #a83a31; }
.toast.good { background: #0d7a52; }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* 预算缺口 */
.gap-hero { padding: 12px 14px; border-radius: 12px; background: var(--bad-bg); border: 1px solid #f6d9d4; margin-bottom: 12px; }
.gap-hero .t { font-size: 13px; font-weight: 700; color: var(--bad); }
.gap-hero .s { font-size: 11.5px; color: #a4453c; margin-top: 3px; line-height: 1.5; }
.gap-rows { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
.gap-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--line-2); }
.gap-row:last-child { border-bottom: 0; }
.gap-row .k { color: var(--muted); font-size: 12px; }
.gap-row .v { font-variant-numeric: tabular-nums; font-weight: 600; }
.gap-row.bad .k, .gap-row.bad .v { color: var(--bad); }
.gap-method { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.gap-method.on { border-color: #9dc2e6; background: #f7fbff; }
.gap-method h4 { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.gap-method p { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
.gap-method .bd { margin-top: 10px; }
.inline-input { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 42px; }
.inline-input .c { font-size: 15px; font-weight: 700; color: var(--brand); }
.inline-input input { flex: 1; min-width: 0; border: 0; outline: 0; font-size: 15px; font-weight: 600; }
.store-pick { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; font-size: 12.5px; background: #fff; width: 100%; text-align: left; }
.store-pick.on { border-color: var(--brand-2); background: #f5faff; }
.store-pick .r { margin-left: auto; font-size: 11px; color: var(--muted); }

/* 上传照片 */
.photo-pick { display: flex; align-items: center; gap: 12px; }
.photo-btn { width: 72px; height: 72px; border-radius: 12px; border: 1px dashed #c9d8e8; background: #f8fbfe; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 10px; }
.photo-prev { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; border: 1px solid var(--line); }
.photo-hint { font-size: 10.5px; color: var(--muted-2); line-height: 1.5; }

/* 供应商工作台 */
.sup-item { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; color: var(--ink-2); padding: 3px 0; }
.sup-item .q { margin-left: auto; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.ship-lines { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; }
.ship-line { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px dashed var(--line-2); }
.ship-line:last-child { border-bottom: 0; }
.ship-line .nm { flex: 1; min-width: 0; font-size: 12.5px; }
.ship-line .nm small { display: block; font-size: 10px; color: var(--muted-2); }
.ship-line input { width: 62px; height: 34px; border: 1px solid var(--line); border-radius: 8px; text-align: center; font-size: 13px; }
.ship-line .u { font-size: 10.5px; color: var(--muted-2); width: 22px; }

/* 其他 */
.note-box { font-size: 11.5px; color: var(--muted); line-height: 1.65; background: #f8fafd; border: 1px solid var(--line-2); border-radius: 11px; padding: 10px 12px; }
.note-box b { color: var(--ink-2); }
.pref-list { display: flex; flex-direction: column; gap: 10px; }
.pref-item { display: flex; gap: 10px; }
.pref-item .n { width: 20px; height: 20px; border-radius: 50%; background: #eef3f9; color: var(--muted); font-size: 10.5px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; margin-top: 1px; }
.pref-item .t { font-size: 12.5px; font-weight: 600; }
.pref-item .d { font-size: 11px; color: var(--muted); line-height: 1.55; margin-top: 2px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.hr { height: 1px; background: var(--line-2); margin: 14px 0; }
.tag-line { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.mini-tag { font-size: 10px; padding: 2px 6px; border-radius: 5px; background: #f0f4f9; color: var(--muted); }

.gap-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }

}

    keywords: ['易拉宝', '展架', '人字板', '条幅', '横幅', '吊旗', '侧旗', '刀旗', '桁架', '工卡', '挂绳', '锦旗', '抽奖', '奖牌', '奖杯', '帐篷', '桌布'] },
  { cat: '印刷品物料', key: 'film', label: '喷绘贴膜', short: '喷绘贴膜',
    keywords: ['喷绘', '刀刮布', '网格布', '背胶', '车贴', '单透', '透明贴', '玻璃贴', '地贴', '软膜', '广告贴', '反光贴', '地毯'] },
  { cat: '印刷品物料', key: 'service', label: '安装服务', short: '安装服务', keywords: [] }
];

// 精确名单优先（关键词容易误判的商品在这里钉死）
const EXPLICIT = {
  '灯箱画面': 'film',
  '车库悬挂式导向吊牌': 'sign',
  '电梯地毯': 'film',
  '桌面海报展示架': 'stand',
  '立式展示牌': 'stand',
  '活动抽奖箱': 'stand',
  '活动抽奖转盘': 'stand',
  '活动折叠帐篷': 'stand',
  '活动桌布': 'stand'
};

function groupOf(cat, product) {
  const name = product.name || '';
  const own = GROUPS.filter(function (g) { return g.cat === cat; });
  if (!own.length) return null;
  const pin = EXPLICIT[name];
  if (pin) {
    const hit = own.filter(function (g) { return g.key === pin; })[0];
    if (hit) return hit;
  }
  for (let i = 0; i < own.length; i++) {
    const g = own[i];
    for (let j = 0; j < g.keywords.length; j++) {
      if (name.indexOf(g.keywords[j]) >= 0) return g;
    }
  }
  return own.filter(function (g) { return !g.keywords.length; })[0] || own[own.length - 1];
}

// 生成二级分类索引：byId（商品 → 二级分类）+ nav（左侧导航树）
function build(catalog) {
  const byId = {};
  const buckets = {};
  catalog.forEach(function (p) {
    const g = groupOf(p.category, p);
    if (!g) return;
    const subKey = (CAT_KEY[p.category] || p.category) + '.' + g.key;
    byId[p.id] = { key: subKey, label: g.label, cat: p.category };
    if (!buckets[subKey]) buckets[subKey] = [];
    buckets[subKey].push(p.id);
  });

  const nav = [];
  Object.keys(CAT_KEY).forEach(function (cat) {
    const catKey = CAT_KEY[cat];
    const subs = GROUPS.filter(function (g) { return g.cat === cat; }).map(function (g) {
      const subKey = catKey + '.' + g.key;
      const ids = buckets[subKey] || [];
      return {
        key: subKey,
        label: g.label,
        short: g.short || g.label,
        count: ids.length,
        ids: ids
      };
    }).filter(function (s) { return s.count > 0; });
    const count = subs.reduce(function (s, x) { return s + x.count; }, 0);
    nav.push({ key: cat, label: cat, short: cat, count: count, subs: subs });
  });

  return { byId: byId, nav: nav };
}

module.exports = { build: build, CAT_KEY: CAT_KEY, GROUPS: GROUPS };

__def("utils/domain", function (module, exports, require) {
// 业务规则层：由 V1.24 server.js 移植（试算、分级审批、部门采购、接单、配送、验收、对账、SLA）
// 所有函数在传入的 state 上原地修改，校验失败抛出 Error，文案与网页版保持一致。
const { CATALOG, STORES, CATEGORY_ORDER, zoneOf } = require('../data/catalog');
const { SLA_HOURS, STAFF, SUPPLIERS } = require('../data/seed');
const BUDGET = require('../data/budget');
const { APPROVAL_DEFAULT, APPROVAL_LIMITS, CONTRACTS_DEFAULT } = require('../data/rules');
const fmt = require('./format');

const CATALOG_BY_ID = {};
CATALOG.forEach(function (p) { CATALOG_BY_ID[p.id] = p; });

const APPROVAL_STATUS = ['order-review', 'budget-region', 'budget-central', 'amount-approval', 'dept-approval'];
const INSTALL_REQUIRED = ['AD-013', 'AD-023', 'AD-054', 'AD-056', 'AD-057', 'AD-058', 'AD-059', 'AD-060', 'AD-061', 'AD-062', 'AD-063'];
const SHIPPING_METHODS = {
  express: '快递配送',
  lalamove: '同城货运（货拉拉等）',
  runner: '同城跑腿',
  self: '供应商自行配送'
};

function cents(n) { return Math.round(Number(n) * 100); }
function uid() {
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

/* ------------------- 动态物资目录 / 供应商 / 合同 / 审批规则（中台操作台） -------------------
 * 基础数据来自 data/catalog.js 与 data/rules.js；运营管理部在中台操作台做的增删改
 * 存放在 state.catalogCustom / state.contracts / state.approvalConfig，两端实时生效。
 */
function syncCatalogCache(list) {
  Object.keys(CATALOG_BY_ID).forEach(function (k) { delete CATALOG_BY_ID[k]; });
  list.forEach(function (p) { CATALOG_BY_ID[p.id] = p; });
}

function catalogStateOf(state) {
  if (!state) return { added: [], updated: {}, deleted: {} };
  if (!state.catalogCustom || typeof state.catalogCustom !== 'object') {
    state.catalogCustom = { added: [], updated: {}, deleted: {} };
  }
  const c = state.catalogCustom;
  if (!Array.isArray(c.added)) c.added = [];
  if (!c.updated || typeof c.updated !== 'object') c.updated = {};
  if (!c.deleted || typeof c.deleted !== 'object') c.deleted = {};
  return c;
}

function normalizeScope(item) {
  return item && (item.purchaseScope === 'central' || item.centralOnly === true) ? 'central' : 'all';
}

function canActorBuyItem(item, session) {
  if (!item) return false;
  if (normalizeScope(item) === 'central') {
    return !!(session && session.role === 'central');
  }
  return true;
}

// 当前生效的完整物资清单（含中台新增/编辑，默认不含已删除；includeDeleted=true 时保留并标 deleted:true；传 buyer 时按采购权限过滤）
function catalogOf(state, opts) {
  const c = catalogStateOf(state);
  const includeDeleted = opts && opts.includeDeleted;
  const activeOnly = opts && opts.activeOnly;
  const buyer = opts && opts.buyer;
  const out = [];
  const seen = {};

  CATALOG.forEach(function (base) {
    seen[base.id] = 1;
    const isDel = !!c.deleted[base.id];
    if (isDel && !includeDeleted) return;
    const patch = c.updated[base.id] || {};
    const merged = Object.assign({}, base, patch, {
      id: base.id,
      enabled: patch.enabled === undefined ? (base.enabled !== false) : !!patch.enabled,
      deleted: isDel,
      isCustom: false,
      isModified: Object.keys(patch).length > 0
    });
    merged.purchaseScope = normalizeScope(merged);
    merged.centralOnly = merged.purchaseScope === 'central';
    if (activeOnly && (!merged.enabled || merged.deleted)) return;
    if (buyer && !canActorBuyItem(merged, buyer)) return;
    out.push(merged);
  });

  (c.added || []).forEach(function (raw) {
    if (!raw || !raw.id || seen[raw.id]) return;
    seen[raw.id] = 1;
    const isDel = !!c.deleted[raw.id];
    if (isDel && !includeDeleted) return;
    const patch = c.updated[raw.id] || {};
    const merged = Object.assign({}, raw, patch, {
      id: raw.id,
      enabled: patch.enabled === undefined ? (raw.enabled !== false) : !!patch.enabled,
      deleted: isDel,
      isCustom: true,
      isModified: Object.keys(patch).length > 0
    });
    merged.purchaseScope = normalizeScope(merged);
    merged.centralOnly = merged.purchaseScope === 'central';
    if (activeOnly && (!merged.enabled || merged.deleted)) return;
    if (buyer && !canActorBuyItem(merged, buyer)) return;
    out.push(merged);
  });

  if (!includeDeleted && !activeOnly && !buyer) syncCatalogCache(out);
  return out;
}

function catalogMapOf(state) {
  const list = catalogOf(state);
  const map = {};
  list.forEach(function (p) { map[p.id] = p; });
  return map;
}

function suppliersOf(state) {
  const set = {};
  (SUPPLIERS || []).forEach(function (s) { if (s) set[s] = 1; });
  catalogOf(state, { includeDeleted: true }).forEach(function (p) { if (p.supplier) set[p.supplier] = 1; });
  ((state && state.contracts) || CONTRACTS_DEFAULT).forEach(function (c) { if (c && c.supplier) set[c.supplier] = 1; });
  return Object.keys(set);
}

// 新增或编辑物资（中台）
function saveCatalogItem(state, session, payload) {
  if (!session || session.role !== 'central') throw new Error('仅运营管理部可维护物资目录');
  const p = payload || {};
  const c = catalogStateOf(state);
  const all = catalogOf(state, { includeDeleted: true });
  const byId = {};
  all.forEach(function (x) { byId[x.id] = x; });

  const LEGACY_CAT_MAP = {
    '活动及社群物资': '社群活动物资',
    '奖品礼品': '客诉维护物资',
    '日常运营耗材': '客诉维护物资',
    '员工物资': '客诉维护物资',
    '宣传印刷物料': '印刷品物料'
  };
  const name = String(p.name || '').trim();
  if (!name || name.length > 60) throw new Error('请填写1至60字的物资名称');
  const rawCat = String(p.category || '').trim();
  const category = LEGACY_CAT_MAP[rawCat] || rawCat;
  if (CATEGORY_ORDER.indexOf(category) < 0) throw new Error('请选择有效的物资大类');
  const unit = String(p.unit || '').trim() || '个';
  if (unit.length > 16) throw new Error('计量单位不超过16字');
  const spec = String(p.spec || '').trim().slice(0, 120);
  const supplier = String(p.supplier || '').trim();
  if (!supplier || supplier.length > 60) throw new Error('请填写或选择供应商');
  const price = round2(Number(p.price));
  if (!isFinite(price) || price <= 0 || price > 1000000) throw new Error('单价需在 0.01 到 1,000,000 元之间');
  const note = String(p.note || '').trim().slice(0, 200);
  const budgetItem = p.budgetItem && BUDGET.NAME[p.budgetItem] ? p.budgetItem : '';
  const enabled = p.enabled === undefined ? true : !!p.enabled;
  const purchaseScope = (p.purchaseScope === 'central' || p.centralOnly === true) ? 'central' : 'all';
  const centralOnly = purchaseScope === 'central';

  let id = String(p.id || '').trim().toUpperCase();
  const isEdit = !!p.isEdit;
  const now = new Date().toISOString();

  if (isEdit) {
    if (!id || !byId[id]) throw new Error('找不到要修改的物资：' + id);
    delete c.deleted[id];
    c.updated[id] = {
      name: name, category: category, spec: spec, unit: unit,
      price: price, supplier: supplier, note: note,
      budgetItem: budgetItem || '',
      purchaseScope: purchaseScope,
      centralOnly: centralOnly,
      enabled: enabled,
      updatedAt: now,
      updatedBy: session.id
    };
    const next = catalogOf(state);
    const saved = next.filter(function (x) { return x.id === id; })[0];
    return {
      item: saved,
      created: false,
      audit: {
        orderId: id, kind: 'catalog', stage: 'catalog-edit', decision: '修改物资',
        role: '运营管理部（' + session.id + '）', from: '', to: '',
        note: name + '（' + category + '，¥' + fmt.money(price) + '/' + unit + (centralOnly ? '，仅中台采购' : '') + '）',
        at: now
      }
    };
  }

  if (!id) {
    const prefix = category === '印刷品物料' ? 'AD' : 'WZ';
    let maxNum = 0;
    all.forEach(function (x) {
      const m = String(x.id || '').match(new RegExp('^' + prefix + '-(\\d+)$'));
      if (m && Number(m[1]) > maxNum) maxNum = Number(m[1]);
    });
    id = prefix + '-' + String(maxNum + 1).padStart(3, '0');
  } else if (!/^[A-Z0-9_-]{2,24}$/.test(id)) {
    throw new Error('物资编号仅支持大写字母、数字、下划线或连字符（2-24位）');
  }
  if (byId[id] && !c.deleted[id]) throw new Error('物资编号已存在：' + id);

  delete c.deleted[id];
  delete c.updated[id];
  const item = {
    id: id, name: name, spec: spec, unit: unit, price: price,
    supplier: supplier, category: category, note: note,
    budgetItem: budgetItem || '',
    purchaseScope: purchaseScope,
    centralOnly: centralOnly,
    enabled: enabled, demoOnly: false,
    createdAt: now, createdBy: session.id
  };
  c.added = c.added.filter(function (x) { return x.id !== id; });
  c.added.unshift(item);
  catalogOf(state);
  return {
    item: Object.assign({ isCustom: true, enabled: enabled }, item),
    created: true,
    audit: {
      orderId: id, kind: 'catalog', stage: 'catalog-add', decision: '新增物资',
      role: '运营管理部（' + session.id + '）', from: '', to: '',
      note: name + '（' + category + '，¥' + fmt.money(price) + '/' + unit + (centralOnly ? '，仅中台采购' : '') + '）',
      at: now
    }
  };
}

// 采购权限范围切换（仅运营管理部可设置：'central' 仅中台采购 / 'all' 门店及各部门均可自行下单）
function setCatalogItemScope(state, session, payload) {
  if (!session || session.role !== 'central') throw new Error('仅运营管理部可设置物资采购权限');
  const p = payload || {};
  const map = catalogMapOf(state);
  const c = catalogStateOf(state);
  const ids = Array.isArray(p.ids) && p.ids.length ? p.ids : [String(p.id || '').trim()];
  if (!ids[0]) throw new Error('请选择要设置的物资');
  const now = new Date().toISOString();
  const changed = [];
  let lastScope = 'all';

  ids.forEach(function (id) {
    const cur = map[id];
    if (!cur) throw new Error('找不到物资：' + id);
    const nextScope = p.purchaseScope === 'central' || p.purchaseScope === 'all'
      ? p.purchaseScope
      : (normalizeScope(cur) === 'central' ? 'all' : 'central');
    lastScope = nextScope;
    c.updated[id] = Object.assign({}, c.updated[id] || {}, {
      purchaseScope: nextScope,
      centralOnly: nextScope === 'central',
      updatedAt: now,
      updatedBy: session.id
    });
    changed.push(cur.name + '（' + id + '）');
  });

  catalogOf(state);
  return {
    id: ids[0],
    ids: ids,
    name: changed.length === 1 ? map[ids[0]].name : (changed.length + ' 项物资'),
    purchaseScope: lastScope,
    centralOnly: lastScope === 'central',
    audit: {
      orderId: ids.length === 1 ? ids[0] : '',
      kind: 'catalog',
      stage: 'catalog-scope',
      decision: lastScope === 'central' ? '设为仅中台采购' : '开放全员下单',
      role: '运营管理部（' + session.id + '）',
      from: '', to: '',
      note: changed.slice(0, 5).join('、') + (changed.length > 5 ? ' 等' + changed.length + '项' : ''),
      at: now
    }
  };
}

// 上下架切换
function toggleCatalogItem(state, session, payload) {
  if (!session || session.role !== 'central') throw new Error('仅运营管理部可上下架物资');
  const id = String((payload && payload.id) || '').trim();
  const map = catalogMapOf(state);
  const cur = map[id];
  if (!cur) throw new Error('找不到物资：' + id);
  const c = catalogStateOf(state);
  const nextEnabled = payload.enabled === undefined ? !cur.enabled : !!payload.enabled;
  const now = new Date().toISOString();
  c.updated[id] = Object.assign({}, c.updated[id] || {}, {
    enabled: nextEnabled,
    updatedAt: now,
    updatedBy: session.id
  });
  catalogOf(state);
  return {
    id: id,
    name: cur.name,
    enabled: nextEnabled,
    audit: {
      orderId: id, kind: 'catalog', stage: 'catalog-toggle', decision: nextEnabled ? '上架物资' : '下架物资',
      role: '运营管理部（' + session.id + '）', from: '', to: '',
      note: cur.name + '（' + id + '）',
      at: now
    }
  };
}

// 删除物资：若有未完结订单引用该物资，禁止直接删除（建议先下架）；历史已完成单不受影响
function deleteCatalogItem(state, session, id) {
  if (!session || session.role !== 'central') throw new Error('仅运营管理部可删除物资');
  const targetId = String(id || '').trim();
  const all = catalogOf(state, { includeDeleted: true });
  const item = all.filter(function (x) { return x.id === targetId && !x.deleted; })[0];
  if (!item) throw new Error('物资不存在或已删除');

  const activeOrder = (state.orders || []).filter(function (o) {
    if (['done', 'cancelled', 'rejected'].indexOf(o.status) >= 0) return false;
    return (o.items || []).some(function (x) { return x.id === targetId; });
  })[0];
  if (activeOrder) {
    throw new Error('在途订单 ' + activeOrder.id + ' 包含该物资，请先设为「下架」或等订单完结后再删除');
  }

  const now = new Date().toISOString();
  const c = catalogStateOf(state);
  c.deleted[targetId] = { at: now, by: session.id, name: item.name };
  catalogOf(state);
  return {
    id: targetId,
    name: item.name,
    audit: {
      orderId: targetId, kind: 'catalog', stage: 'catalog-delete', decision: '删除物资',
      role: '运营管理部（' + session.id + '）', from: '', to: '',
      note: item.name + '（' + targetId + '）',
      at: now
    }
  };
}

// 恢复已删除物资
function restoreCatalogItem(state, session, id) {
  if (!session || session.role !== 'central') throw new Error('仅运营管理部可恢复物资');
  const targetId = String(id || '').trim();
  const c = catalogStateOf(state);
  if (!c.deleted[targetId]) throw new Error('该物资未被删除');
  delete c.deleted[targetId];
  const list = catalogOf(state);
  const item = list.filter(function (x) { return x.id === targetId; })[0];
  const now = new Date().toISOString();
  const itemName = (item && item.name) || targetId;
  return {
    id: targetId,
    name: itemName,
    audit: {
      orderId: targetId, kind: 'catalog', stage: 'catalog-restore', decision: '恢复物资',
      role: '运营管理部（' + session.id + '）', from: '', to: '',
      note: itemName + '（' + targetId + '）',
      at: now
    }
  };
}

/* ------------------- 门店审批规则配置 ------------------- */
function approvalConfigOf(state) {
  const raw = (state && state.approvalConfig) || {};
  const autoMax = isFinite(Number(raw.autoMax)) ? round2(Number(raw.autoMax)) : APPROVAL_DEFAULT.autoMax;
  const regionMax = isFinite(Number(raw.regionMax)) ? round2(Number(raw.regionMax)) : APPROVAL_DEFAULT.regionMax;
  const splitDays = isFinite(Number(raw.splitDays)) ? Math.round(Number(raw.splitDays)) : APPROVAL_DEFAULT.splitDays;
  return {
    autoMax: autoMax,
    regionMax: Math.max(autoMax, regionMax),
    splitGuard: raw.splitGuard === undefined ? APPROVAL_DEFAULT.splitGuard : !!raw.splitGuard,
    splitDays: Math.max(1, Math.min(31, splitDays)),
    autoSkipReview: raw.autoSkipReview === undefined ? APPROVAL_DEFAULT.autoSkipReview : !!raw.autoSkipReview
  };
}

function saveApprovalConfig(state, session, payload) {
  if (!session || session.role !== 'central') throw new Error('仅运营管理部可调整审批规则');
  const p = payload || {};
  const cur = approvalConfigOf(state);
  const autoMax = p.autoMax === undefined ? cur.autoMax : round2(Number(p.autoMax));
  const regionMax = p.regionMax === undefined ? cur.regionMax : round2(Number(p.regionMax));
  const splitDays = p.splitDays === undefined ? cur.splitDays : Math.round(Number(p.splitDays));
  if (!isFinite(autoMax) || autoMax < APPROVAL_LIMITS.autoMax[0] || autoMax > APPROVAL_LIMITS.autoMax[1]) {
    throw new Error('小额上限需在 ' + APPROVAL_LIMITS.autoMax[0] + ' 到 ' + APPROVAL_LIMITS.autoMax[1] + ' 元之间');
  }
  if (!isFinite(regionMax) || regionMax < autoMax || regionMax > APPROVAL_LIMITS.regionMax[1]) {
    throw new Error('战区终审上限需不小于小额上限，且不超过 ' + APPROVAL_LIMITS.regionMax[1] + ' 元');
  }
  if (!isFinite(splitDays) || splitDays < APPROVAL_LIMITS.splitDays[0] || splitDays > APPROVAL_LIMITS.splitDays[1]) {
    throw new Error('防拆单统计天数需在 1 到 31 天之间');
  }
  state.approvalConfig = {
    autoMax: autoMax,
    regionMax: regionMax,
    splitGuard: p.splitGuard === undefined ? cur.splitGuard : !!p.splitGuard,
    splitDays: splitDays,
    autoSkipReview: p.autoSkipReview === undefined ? cur.autoSkipReview : !!p.autoSkipReview
  };
  const now = new Date().toISOString();
  return {
    config: state.approvalConfig,
    audit: {
      orderId: '', kind: 'rules', stage: 'rules-save', decision: '更新审批规则',
      role: '运营管理部（' + session.id + '）', from: '', to: '',
      note: '小额≤¥' + fmt.money(autoMax) + '，战区终审≤¥' + fmt.money(regionMax) +
        (state.approvalConfig.splitGuard ? '，防拆单' + splitDays + '天' : '，关闭防拆单') +
        (state.approvalConfig.autoSkipReview ? '，小额免审直发' : ''),
      at: now
    }
  };
}

// 某门店近 N 天已提交的有效订单累计金额（分）——用于防拆单定档（支持按同费用科目过滤且排除已中台审批大单）
function recentStoreCents(state, store, days, excludeId, budgetKeys) {
  const windowMs = (days || APPROVAL_DEFAULT.splitDays) * 86400000;
  const now = Date.now();
  const keys = Array.isArray(budgetKeys) && budgetKeys.length ? budgetKeys : null;
  let sum = 0;
  (state.orders || []).forEach(function (o) {
    if (!o || o.id === excludeId) return;
    if (o.purchaseType === 'department' || o.store !== store) return;
    if (['rejected', 'cancelled'].indexOf(o.status) >= 0) return;
    if (o.tier === 'central') return;
    const ts = parseTime(o.createdAt || o.created);
    if (!isNaN(ts) && now - ts > windowMs) return;
    if (keys) {
      const sp = splitOrder(o);
      keys.forEach(function (k) {
        if (sp[k]) sum += cents(sp[k].total);
      });
    } else {
      sum += cents(o.total || 0);
    }
  });
  return sum;
}

/* ------------------- 供应商合同总额上限（职能部门采购） -------------------
 * 规则：职能部门不设部门预算，但每个供应商签有年度/框架合同总额上限；
 *       所有有效采购单（已结算按结算金额、未结算按下单金额）累计不得超过该供应商合同总额。
 */
function contractsOf(state) {
  if (!state) return CONTRACTS_DEFAULT.slice();
  if (!Array.isArray(state.contracts) || !state.contracts.length) {
    state.contracts = JSON.parse(JSON.stringify(CONTRACTS_DEFAULT));
  }
  return state.contracts;
}

// 订单在各供应商上的有效金额（分）：若已双方确认结算，按确认值或分供应商明细计算；否则按订单明细金额
function supplierOrderCents(order, supplier) {
  if (!order || ['rejected', 'cancelled'].indexOf(order.status) >= 0) return 0;
  const items = (order.items || []).filter(function (x) { return x.supplier === supplier; });
  if (!items.length) return 0;
  const rawCents = items.reduce(function (s, x) {
    return s + cents(Number(x.price || 0) * Number(x.qty || 0));
  }, 0);
  const settle = order.settlement;
  if (settle && settle.status === 'confirmed' && isFinite(Number(settle.amount))) {
    if (settle.bySupplier && isFinite(Number(settle.bySupplier[supplier]))) {
      return cents(settle.bySupplier[supplier]);
    }
    const orderRaw = (order.items || []).reduce(function (s, x) {
      return s + cents(Number(x.price || 0) * Number(x.qty || 0));
    }, 0);
    if (orderRaw > 0) return Math.round(cents(settle.amount) * (rawCents / orderRaw));
  }
  return rawCents;
}

function contractSummary(state, excludeOrderId) {
  const list = contractsOf(state);
  return list.map(function (c) {
    const capCents = cents(c.total || 0);
    let deptUsed = 0;
    let storeUsed = 0;
    (state.orders || []).forEach(function (o) {
      if (!o || o.id === excludeOrderId || ['rejected', 'cancelled'].indexOf(o.status) >= 0) return;
      const amt = supplierOrderCents(o, c.supplier);
      if (!amt) return;
      if (o.purchaseType === 'department') deptUsed += amt;
      else storeUsed += amt;
    });
    const usedCents = deptUsed + storeUsed;
    const remainCents = Math.max(0, capCents - usedCents);
    return {
      id: c.id,
      supplier: c.supplier,
      name: c.name || (c.supplier + '框架合同'),
      total: round2(capCents / 100),
      deptUsed: round2(deptUsed / 100),
      storeUsed: round2(storeUsed / 100),
      used: round2(usedCents / 100),
      remaining: round2(remainCents / 100),
      usedPct: capCents > 0 ? Math.min(100, Math.round(usedCents / capCents * 100)) : 0,
      start: c.start || '',
      end: c.end || '',
      note: c.note || ''
    };
  });
}

function saveContract(state, session, payload) {
  if (!session || session.role !== 'central') throw new Error('仅运营管理部可维护合同上限');
  const p = payload || {};
  const list = contractsOf(state);
  const supplier = String(p.supplier || '').trim();
  if (!supplier) throw new Error('请选择或填写供应商名称');
  const name = String(p.name || '').trim() || (supplier + '采购合同');
  const total = round2(Number(p.total));
  if (!isFinite(total) || total <= 0 || total > 100000000) throw new Error('合同总额需在 0.01 到 1 亿元之间');
  let id = String(p.id || '').trim();
  const now = new Date().toISOString();
  const existing = list.filter(function (c) { return (id && c.id === id) || c.supplier === supplier; })[0];
  if (existing) {
    existing.supplier = supplier;
    existing.name = name;
    existing.total = total;
    existing.start = String(p.start || existing.start || '').slice(0, 20);
    existing.end = String(p.end || existing.end || '').slice(0, 20);
    existing.note = String(p.note !== undefined ? p.note : (existing.note || '')).slice(0, 120);
    return {
      contract: existing,
      created: false,
      audit: {
        orderId: existing.id, kind: 'contract', stage: 'contract-edit', decision: '调整合同上限',
        role: '运营管理部（' + session.id + '）', from: '', to: '',
        note: supplier + '（总额 ¥' + fmt.money(total) + '）',
        at: now
      }
    };
  }
  if (!id) id = 'HT-' + new Date().getFullYear() + '-' + String(list.length + 1).padStart(3, '0');
  const row = {
    id: id, supplier: supplier, name: name, total: total,
    start: String(p.start || '').slice(0, 20),
    end: String(p.end || '').slice(0, 20),
    note: String(p.note || '').slice(0, 120)
  };
  list.push(row);
  return {
    contract: row,
    created: true,
    audit: {
      orderId: row.id, kind: 'contract', stage: 'contract-add', decision: '新增供应商合同',
      role: '运营管理部（' + session.id + '）', from: '', to: '',
      note: supplier + '（总额 ¥' + fmt.money(total) + '）',
      at: now
    }
  };
}


/* ------------------- 费用预算（门店 × 科目） -------------------
 * 额度 = 房间数 × 科目系数（中台可按门店改系数或直接定额），再叠加手工增减：
 *   adjust>0  机动预算池追加 / 其他门店调剂进来
 *   adjust<0  调出给其他门店
 * 订单按商品归类到科目，一张单可以跨科目，各自占用对应额度。
 */
function budgetCfg(state) {
  if (!state.budgetConfig) state.budgetConfig = {};
  return BUDGET.normalize(state.budgetConfig);
}

function flexCentsOf(state) {
  return cents(Number(state.flex === undefined ? 20000 : state.flex));
}

// 订单在各科目上的金额：{ key: { total, accepted } }（元）
// 若订单已双方确认结算（settlement.status === 'confirmed'），按最终结算金额同比例分摊到各科目，释放折让部分的预算占用
function splitOrder(order) {
  const out = {};
  BUDGET.KEYS.forEach(function (k) { out[k] = { total: 0, accepted: 0 }; });
  if (!order) return out;
  (order.items || []).forEach(function (x) {
    const p = CATALOG_BY_ID[x.id];
    const k = BUDGET.itemOf(x.budgetItem ? x : (p || x));
    // 订单行通常带 price；历史数据缺失时回退到目录价，避免金额算成 0
    const price = Number(x.price !== undefined ? x.price : (p && p.price) || 0);
    const total = price * Number(x.qty || 0);
    const accepted = Math.min(total, price * Number(x.accepted || 0));
    if (!out[k]) out[k] = { total: 0, accepted: 0 };
    out[k].total = round2(out[k].total + total);
    out[k].accepted = round2(out[k].accepted + accepted);
  });
  const settle = order.settlement;
  if (settle && settle.status === 'confirmed' && isFinite(Number(settle.amount))) {
    if (settle.bySupplier && typeof settle.bySupplier === 'object') {
      const supRaw = {};
      const nextOut = {};
      BUDGET.KEYS.forEach(function (k) { nextOut[k] = { total: 0, accepted: 0 }; });
      (order.items || []).forEach(function (x) {
        const p = CATALOG_BY_ID[x.id];
        const price = Number(x.price !== undefined ? x.price : (p && p.price) || 0);
        const raw = price * Number(x.qty || 0);
        const sup = x.supplier || '_';
        supRaw[sup] = (supRaw[sup] || 0) + raw;
      });
      (order.items || []).forEach(function (x) {
        const p = CATALOG_BY_ID[x.id];
        const k = BUDGET.itemOf(x.budgetItem ? x : (p || x));
        const price = Number(x.price !== undefined ? x.price : (p && p.price) || 0);
        const raw = price * Number(x.qty || 0);
        const sup = x.supplier || '_';
        const supSettled = isFinite(Number(settle.bySupplier[sup])) ? Number(settle.bySupplier[sup]) : supRaw[sup];
        const scaled = supRaw[sup] > 0 ? round2(raw * (supSettled / supRaw[sup])) : 0;
        if (!nextOut[k]) nextOut[k] = { total: 0, accepted: 0 };
        nextOut[k].total = round2(nextOut[k].total + scaled);
        nextOut[k].accepted = round2(nextOut[k].accepted + scaled);
      });
      return nextOut;
    }
    const rawSum = BUDGET.KEYS.reduce(function (s, k) { return s + out[k].total; }, 0);
    if (rawSum > 0) {
      const ratio = Number(settle.amount) / rawSum;
      BUDGET.KEYS.forEach(function (k) {
        const scaled = round2(out[k].total * ratio);
        out[k].total = scaled;
        out[k].accepted = scaled;
      });
    }
  }
  return out;
}

// 是否占用门店额度：部门采购走部门预算、不计入门店；驳回/撤销/待核定不占
function occupiesStore(order) {
  if (!order) return false;
  if (order.purchaseType === 'department') return false;
  if (['rejected', 'cancelled'].indexOf(order.status) >= 0) return false;
  if (order.overPending) return false;
  return true;
}

// 某门店某科目的占用情况（分）
function storeItemCents(state, store, key, excludeId) {
  const cfg = budgetCfg(state);
  const budget = cents(BUDGET.budgetOf(cfg, store, key));
  const baseUsed = cents(BUDGET.baseUsedOf(cfg, store, key));
  let reserved = 0;
  (state.orders || []).forEach(function (o) {
    if (o.id === excludeId || o.store !== store || !occupiesStore(o)) return;
    reserved += cents(splitOrder(o)[key].total);
  });
  return {
    budget: budget,
    baseUsed: baseUsed,
    reserved: reserved,
    usable: Math.max(0, budget - baseUsed - reserved)
  };
}

// 门店可用额度（分）。传 key 只算该科目，不传为该店三科目合计
function storeUsableCents(state, store, excludeId, key) {
  if (key) return storeItemCents(state, store, key, excludeId).usable;
  return BUDGET.KEYS.reduce(function (s, k) {
    return s + storeItemCents(state, store, k, excludeId).usable;
  }, 0);
}

// 预算追加回收：撤销 / 关闭 / 驳回已追加预算的订单时，把追加额度退回机动预算
function revertBudgetTransfer(state, order) {
  if (!order || !order.budgetApplied) return 0;
  const cfg = budgetCfg(state);
  const amounts = {};
  if (order.budgetTransferByItem && typeof order.budgetTransferByItem === 'object') {
    BUDGET.KEYS.forEach(function (k) {
      amounts[k] = Number(order.budgetTransferByItem[k] || 0);
    });
  } else {
    // 老数据没有科目明细：按订单金额分摊退回
    const split = splitOrder(order);
    const total = BUDGET.KEYS.reduce(function (s, k) { return s + split[k].total; }, 0);
    const whole = Number(order.budgetTransfer || 0);
    BUDGET.KEYS.forEach(function (k) {
      amounts[k] = total > 0 ? round2(whole * split[k].total / total) : 0;
    });
  }
  let reverted = 0;
  BUDGET.KEYS.forEach(function (k) {
    const amt = cents(amounts[k] || 0);
    if (!amt) return;
    cfg.adjust[order.store] = cfg.adjust[order.store] || {};
    cfg.adjust[order.store][k] = round2((cfg.adjust[order.store][k] || 0) - amt / 100);
    reverted += amt;
  });
  if (reverted > 0) state.flex = round2((flexCentsOf(state) + reverted) / 100);
  order.budgetApplied = false;
  order.budgetTransfer = 0;
  order.budgetTransferByItem = null;
  return round2(reverted / 100);
}

/* ------------------- 预算缺口 / 机动预算调整 ------------------- */
// 预算核定节点用：这笔单在每个科目各缺多少、机动池够不够、单笔最多能核定多少
function budgetGap(state, order) {
  const cfg = budgetCfg(state);
  const flex = flexCentsOf(state);
  const split = splitOrder(order);
  const rows = BUDGET.KEYS.map(function (key) {
    const amount = cents(split[key].total);
    const info = storeItemCents(state, order.store, key, order.id);
    const needed = Math.max(0, amount - info.usable);
    return {
      key: key,
      name: BUDGET.NAME[key],
      short: BUDGET.SHORT[key],
      budget: round2(info.budget / 100),
      baseUsed: round2(info.baseUsed / 100),
      usable: round2(info.usable / 100),
      total: round2(amount / 100),
      needed: round2(needed / 100),
      over: needed > 0
    };
  }).filter(function (r) { return r.total > 0; });

  const sum = function (f) {
    return rows.reduce(function (s, r) { return s + cents(r[f]); }, 0);
  };
  const totalCents = sum('total');
  const usableCents = sum('usable');
  const neededCents = sum('needed');
  const short = Math.max(0, neededCents - flex);

  return {
    store: order.store,
    rows: rows,
    flex: round2(flex / 100),
    // 整单口径（页面与审计按这些字段显示）
    budget: round2(rows.reduce(function (s, r) { return s + r.budget; }, 0)),
    baseUsed: round2(rows.reduce(function (s, r) { return s + r.baseUsed; }, 0)),
    usable: round2(usableCents / 100),
    total: round2(totalCents / 100),
    needed: round2(neededCents / 100),
    short: round2(short / 100),
    maxSupport: round2((usableCents + flex) / 100),
    ok: neededCents <= flex,
    mix: rows.length > 1
  };
}

// 按缺口把机动预算拨到对应门店的对应科目，记录在订单上便于撤销时退回
function applyGapBudget(state, order, gap) {
  const cfg = budgetCfg(state);
  const byItem = {};
  let totalCents = 0;
  (gap.rows || []).forEach(function (r) {
    const amt = cents(r.needed);
    if (amt <= 0) return;
    cfg.adjust[order.store] = cfg.adjust[order.store] || {};
    cfg.adjust[order.store][r.key] = round2((cfg.adjust[order.store][r.key] || 0) + amt / 100);
    byItem[r.key] = round2(amt / 100);
    totalCents += amt;
  });
  state.flex = round2((flexCentsOf(state) - totalCents) / 100);
  order.budgetApplied = true;
  order.budgetTransfer = round2(totalCents / 100);
  order.budgetTransferByItem = byItem;
  return round2(totalCents / 100);
}

// 机动（预留）预算追加：预算核定被卡住时唯一的出口，由运营管理部操作并留痕
function adjustFlex(state, session, amount, reason) {
  if (!session || session.role !== 'central') throw new Error('仅运营管理部可调整机动预算');
  const add = cents(Number(amount));
  if (!isFinite(add) || add <= 0) throw new Error('追加金额需大于 0');
  if (add > 50000000) throw new Error('单次追加不超过 50 万元');
  const before = flexCentsOf(state);
  state.flex = round2((before + add) / 100);
  return { amount: round2(add / 100), before: round2(before / 100), after: state.flex, reason: String(reason || '').slice(0, 100) };
}

// 门店间同科目调剂：把别家门店该科目的闲置额度划给当前门店，不增加公司总预算
function transferStoreBudget(state, session, fromStore, toStore, amount, key) {
  if (!session || session.role !== 'central') throw new Error('仅运营管理部可调剂门店额度');
  if (!fromStore || !toStore) throw new Error('请选择调出与调入门店');
  if (fromStore === toStore) throw new Error('调出与调入不能是同一门店');
  if (!key || !BUDGET.NAME[key]) throw new Error('请选择费用科目');
  const move = cents(Number(amount));
  if (!isFinite(move) || move <= 0) throw new Error('调剂金额需大于 0');
  const free = storeUsableCents(state, fromStore, null, key);
  if (move > free) {
    throw new Error(fromStore + '「' + BUDGET.NAME[key] + '」可用结余仅 ¥' + fmt.money(free / 100));
  }
  const cfg = budgetCfg(state);
  cfg.adjust[fromStore] = cfg.adjust[fromStore] || {};
  cfg.adjust[toStore] = cfg.adjust[toStore] || {};
  cfg.adjust[fromStore][key] = round2((cfg.adjust[fromStore][key] || 0) - move / 100);
  cfg.adjust[toStore][key] = round2((cfg.adjust[toStore][key] || 0) + move / 100);
  return {
    amount: round2(move / 100),
    key: key,
    item: BUDGET.NAME[key],
    from: fromStore,
    to: toStore,
    fromFreeBefore: round2(free / 100)
  };
}

/* ------------------- 预算参数维护（中台） ------------------- */
// 改房间数 / 科目系数 / 直接定额。传 null 表示清除该项（回到公式或上级默认）
function saveBudgetConfig(state, session, payload) {
  if (!session || session.role !== 'central') throw new Error('仅运营管理部可调整门店预算');
  const p = payload || {};
  const store = String(p.store || '');
  if (!store) throw new Error('请选择门店');
  const cfg = budgetCfg(state);
  const changed = [];

  if (p.rooms !== undefined) {
    const rooms = Number(p.rooms);
    if (!isFinite(rooms) || rooms <= 0 || rooms > 1000000) throw new Error('房间数需在 1 到 1000000 之间');
    cfg.rooms[store] = Math.round(rooms);
    changed.push('房间数=' + Math.round(rooms));
  }

  if (p.coef && typeof p.coef === 'object') {
    BUDGET.KEYS.forEach(function (k) {
      if (p.coef[k] === undefined) return;
      if (p.coef[k] === null || p.coef[k] === '') {
        if (cfg.storeCoef[store]) delete cfg.storeCoef[store][k];
        changed.push(BUDGET.NAME[k] + '系数=默认');
        return;
      }
      const v = Number(p.coef[k]);
      if (!isFinite(v) || v < 0 || v > 100000) throw new Error(BUDGET.NAME[k] + '系数需在 0 到 100000 之间');
      cfg.storeCoef[store] = cfg.storeCoef[store] || {};
      cfg.storeCoef[store][k] = round2(v);
      changed.push(BUDGET.NAME[k] + '系数=' + round2(v));
    });
  }

  if (p.override && typeof p.override === 'object') {
    BUDGET.KEYS.forEach(function (k) {
      if (p.override[k] === undefined) return;
      cfg.override[store] = cfg.override[store] || {};
      if (p.override[k] === null || p.override[k] === '') {
        delete cfg.override[store][k];
        changed.push(BUDGET.NAME[k] + '改回公式');
        return;
      }
      const v = Number(p.override[k]);
      if (!isFinite(v) || v < 0 || v > 100000000) throw new Error(BUDGET.NAME[k] + '定额需在 0 到 1 亿之间');
      cfg.override[store][k] = round2(v);
      changed.push(BUDGET.NAME[k] + '定额=¥' + fmt.money(round2(v)));
    });
  }

  if (!changed.length) throw new Error('没有需要保存的调整');
  return { store: store, changed: changed };
}

// 预算配置矩阵：某门店的 房间数 / 三科目 基数、系数、定额、追加、额度
function budgetConfigOf(state, store) {
  const cfg = budgetCfg(state);
  return {
    store: store,
    rooms: BUDGET.roomsOf(cfg, store),
    flex: round2(flexCentsOf(state) / 100),
    items: BUDGET.KEYS.map(function (k) {
      return {
        key: k,
        name: BUDGET.NAME[k],
        short: BUDGET.SHORT[k],
        coef: BUDGET.coefOf(cfg, store, k),
        coefDefault: BUDGET.COEF_DEFAULT[k],
        storeCoef: (cfg.storeCoef[store] || {})[k] === undefined ? null : cfg.storeCoef[store][k],
        override: BUDGET.overrideOf(cfg, store, k),
        basis: BUDGET.basisOf(cfg, store, k),
        base: BUDGET.budgetBaseOf(cfg, store, k),
        adjust: BUDGET.adjustOf(cfg, store, k),
        budget: BUDGET.budgetOf(cfg, store, k),
        baseUsed: BUDGET.baseUsedOf(cfg, store, k)
      };
    }),
    total: BUDGET.storeBudgetOf(cfg, store)
  };
}


/* ------------------------- 试算 ------------------------- */
function computeQuote(state, input) {
  if (!input || !input.store) throw new Error('请选择收货门店');
  if (!Array.isArray(input.items) || input.items.length < 1 || input.items.length > 80) {
    throw new Error('请选择1至80项物料');
  }
  const catMap = catalogMapOf(state);
  let totalCents = 0;
  const confirmed = [];
  const seen = {};
  input.items.forEach(function (line) {
    if (!line || !line.id || !Number.isSafeInteger(line.qty) || line.qty < 1 || line.qty > 9999) {
      throw new Error('物料数量必须为1至9999的整数');
    }
    if (seen[line.id]) throw new Error('商品重复，请在一行填写数量');
    seen[line.id] = 1;
    const item = catMap[line.id] || CATALOG_BY_ID[line.id];
    if (!item || item.deleted) throw new Error('商品未找到：' + line.id);
    if (item.enabled === false) throw new Error('商品已下架，暂不能下单：' + item.name);
    if (normalizeScope(item) === 'central') {
      throw new Error('「' + item.name + '」已设为仅运营管理部（中台）集中采购，门店不可自行下单');
    }
    if (typeof item.price !== 'number' || !isFinite(item.price) || item.price <= 0) {
      throw new Error('商品尚无合同价，暂不能下单：' + item.name);
    }
    const unitCents = cents(item.price);
    totalCents += unitCents * line.qty;
    confirmed.push({ id: item.id, name: item.name, qty: line.qty, unitPrice: unitCents / 100, amount: unitCents * line.qty / 100 });
  });
  if (totalCents <= 0 || totalCents > 1000000000) throw new Error('试算金额超出演示范围');

  // 按费用科目拆分这笔单：每个科目各自比对可用额度（额度 = 房间数 × 系数）
  const cfg = budgetCfg(state);
  const split = {};
  BUDGET.KEYS.forEach(function (k) { split[k] = { total: 0, usable: 0, over: 0 }; });
  confirmed.forEach(function (line) {
    const k = BUDGET.itemOf(catMap[line.id] || CATALOG_BY_ID[line.id]);
    split[k].total = round2(split[k].total + line.amount);
  });
  const budgetRows = BUDGET.KEYS.filter(function (k) {
    return split[k].total > 0;
  }).map(function (k) {
    const usable = round2(storeUsableCents(state, input.store, input.excludeId || null, k) / 100);
    const total = split[k].total;
    return {
      key: k,
      name: BUDGET.NAME[k],
      short: BUDGET.SHORT[k],
      budget: round2(BUDGET.budgetOf(cfg, input.store, k)),
      total: total,
      usable: usable,
      over: round2(Math.max(0, total - usable)),
      overBudget: total > usable
    };
  });
  const availableCents = cents(budgetRows.reduce(function (s, r) { return s + r.usable; }, 0));
  const overAmountCents = cents(budgetRows.reduce(function (s, r) { return s + r.over; }, 0));
  // 机动（预留）池能补的上限：超预算是从这里划额度，超出即核不出来，下单端直接拦截
  const flexCents = flexCentsOf(state);
  const maxSupportCents = availableCents + flexCents;
  const hardOver = overAmountCents > flexCents;

  // 审批定档：支持中台自定义阈值 + 近 N 天同店同科目累计防拆单
  const ac = approvalConfigOf(state);
  const autoMaxCents = cents(ac.autoMax);
  const regionMaxCents = cents(ac.regionMax);
  const activeKeys = budgetRows.map(function (r) { return r.key; });
  const recentCents = ac.splitGuard ? recentStoreCents(state, input.store, ac.splitDays, input.excludeId, activeKeys) : 0;
  const basisCents = ac.splitGuard ? (totalCents + recentCents) : totalCents;
  const rawTier = totalCents <= autoMaxCents ? 'auto' : totalCents <= regionMaxCents ? 'region' : 'central';
  const tier = basisCents <= autoMaxCents ? 'auto' : basisCents <= regionMaxCents ? 'region' : 'central';
  const splitUpgraded = ac.splitGuard && tier !== rawTier;
  const autoSkip = overAmountCents <= 0 && tier === 'auto' && ac.autoSkipReview;
  const nextStep = autoSkip ? 'supplier' : 'order-review';

  let pathText = '';
  if (hardOver) {
    pathText = '超出科目可用额度 ¥' + fmt.money(overAmountCents / 100) + '，且超过机动池上限（¥' + fmt.money(flexCents / 100) + '），无法提交，请拆分下单或联系运营管理部';
  } else if (overAmountCents > 0) {
    pathText = '提交后先由战区审核（需填写超预算理由），通过后由运营管理部一步完成预算核定与金额审批';
  } else if (autoSkip) {
    pathText = '预算内且 ≤¥' + fmt.money(ac.autoMax) + '（含近' + ac.splitDays + '天累计），免战区审核直接发送供应商';
