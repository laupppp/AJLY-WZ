<!doctype html><meta charset="utf-8">
<style>html,body{margin:0}iframe{width:390px;height:844px;border:0}</style>
<iframe id="f"></iframe>
<script>
var u = new URLSearchParams(location.search).get('u') || '/index.html';
var f = document.getElementById('f');
f.onload = function () {
  setTimeout(function () {
    try {
      var d = f.contentDocument, w = f.contentWindow;
      var de = d.documentElement;
      var wide = [];
      d.querySelectorAll('body *').forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.width > 391 && r.height > 0) wide.push(el.className || el.tagName);
      });
      document.title = 'SW=' + de.scrollWidth + ' CW=' + de.clientWidth + ' IW=' + w.innerWidth +
        ' OVER=' + (de.scrollWidth > de.clientWidth ? 'YES' : 'no') +
        ' WIDE=' + wide.slice(0, 5).join('|');
    } catch (e) { document.title = 'ERR ' + e.message; }
  }, 700);
};
f.src = u;
</script>
